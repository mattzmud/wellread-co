<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WellRead Co. — Admin</title>
  <meta name="theme-color" content="#2D1B4E">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon-96x96.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --lavender-mist: #F7F3FF;
      --aged-paper:    #FAF6EE;
      --deep-plum:     #2D1B4E;
      --amethyst:      #7B5EA7;
      --faded-moss:    #9DC4B0;
      --warm-gold:     #C9A84C;
      --terracotta:    #A0674A;
      --border:        #E8DFC8;
    }
    html, body { min-height: 100%; font-family: 'Nunito Sans', sans-serif; background: var(--lavender-mist); color: var(--deep-plum); }

    .page-wrap { max-width: 1100px; margin: 0 auto; padding: 2rem 1.25rem 6rem; }

    .page-header { margin-bottom: 1.75rem; }
    .page-title  { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; color: var(--deep-plum); margin-bottom: 4px; }
    .page-subtitle { font-size: 14px; color: var(--terracotta); }

    /* ── Stats Row ── */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 1.75rem; }
    .stat-card { background: #fff; border-radius: 12px; border: 1px solid var(--border); padding: 1.25rem; text-align: center; }
    .stat-num   { font-family: 'Playfair Display', serif; font-size: 32px; color: var(--amethyst); display: block; }
    .stat-label { font-size: 13px; color: var(--terracotta); margin-top: 4px; }

    /* ── Notification Panel ── */
    .ql-toolbar { border-radius: 8px 8px 0 0 !important; border-color: var(--border) !important; background: var(--lavender-mist) !important; }
    .ql-container { border-radius: 0 0 8px 8px !important; border-color: var(--border) !important; font-family: 'Nunito Sans', sans-serif !important; font-size: 14px !important; }
    .ql-editor { min-height: 100px; color: var(--deep-plum); }
    .ql-editor.ql-blank::before { color: #BDB5CC; font-style: normal; }
    #notifBodyEditor .ql-toolbar { border-top: none; border-left: none; border-right: none; }
    #notifBodyEditor { border: 1.5px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; } background: #fff; border-radius: 16px; border: 1px solid var(--border); padding: 1.5rem; margin-bottom: 1.75rem; }
    .card-title  { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--deep-plum); margin-bottom: 1rem; }

    .notif-input {
      width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 8px;
      font-family: 'Nunito Sans', sans-serif; font-size: 14px; color: var(--deep-plum);
      background: var(--aged-paper); outline: none; margin-bottom: 0.75rem;
      transition: border-color 0.2s;
    }
    .notif-input:focus { border-color: var(--amethyst); background: #fff; }

    .notif-body {
      width: 100%; min-height: 120px; padding: 11px 14px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-family: 'Nunito Sans', sans-serif; font-size: 14px; color: var(--deep-plum);
      background: var(--aged-paper); outline: none; resize: vertical; margin-bottom: 0.75rem;
      transition: border-color 0.2s;
    }
    .notif-body:focus { border-color: var(--amethyst); background: #fff; }

    .notif-options { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .notif-checkbox { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--deep-plum); cursor: pointer; }
    .notif-checkbox input { accent-color: var(--amethyst); width: 15px; height: 15px; cursor: pointer; }

    .send-notif-btn {
      font-family: 'Nunito Sans', sans-serif; font-size: 14px; font-weight: 600;
      padding: 11px 24px; border-radius: 8px; border: none;
      background: var(--amethyst); color: #FAF6EE; cursor: pointer;
      transition: opacity 0.15s; display: inline-flex; align-items: center; gap: 8px;
    }
    .send-notif-btn:hover { opacity: 0.88; }
    .send-notif-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .send-notif-btn .spinner { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    .send-notif-btn.loading .spinner { display: block; }
    .send-notif-btn.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Users Table ── */
    .users-card { background: #fff; border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
    .users-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

    .search-input {
      padding: 9px 14px; border: 1.5px solid var(--border); border-radius: 8px;
      font-family: 'Nunito Sans', sans-serif; font-size: 14px; color: var(--deep-plum);
      background: var(--lavender-mist); outline: none; width: 260px;
    }
    .search-input:focus { border-color: var(--amethyst); background: #fff; }

    .sort-select {
      padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px;
      font-family: 'Nunito Sans', sans-serif; font-size: 13px; color: var(--deep-plum);
      background: #fff; outline: none; cursor: pointer;
    }

    .users-table { width: 100%; border-collapse: collapse; }
    .users-table th {
      text-align: left; padding: 0.75rem 1rem;
      font-size: 11px; font-weight: 600; color: var(--terracotta);
      text-transform: uppercase; letter-spacing: 0.06em;
      background: var(--lavender-mist); border-bottom: 1px solid var(--border);
    }
    .users-table td { padding: 0.875rem 1rem; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--deep-plum); vertical-align: middle; }
    .users-table tr:last-child td { border-bottom: none; }
    .users-table tr:hover td { background: var(--lavender-mist); cursor: pointer; }

    .user-cell { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .user-avatar-ph { width: 36px; height: 36px; border-radius: 50%; background: var(--lavender-mist); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; border: 1px solid var(--border); }
    .user-name    { font-weight: 600; color: var(--deep-plum); }
    .user-handle  { font-size: 11px; color: var(--terracotta); }

    .status-badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
    .status-active    { background: #DCF0E8; color: #2E6B50; }
    .status-suspended { background: #FCE8E8; color: #8B2020; }

    .provider-badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: var(--lavender-mist); color: var(--amethyst); }

    /* ── User Detail Modal ── */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(45,27,78,0.45); z-index: 500; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }

    .user-modal {
      background: var(--aged-paper); border-radius: 20px; padding: 1.75rem;
      width: min(640px, 96vw); max-height: 90vh; overflow-y: auto;
      box-shadow: 0 8px 40px rgba(45,27,78,0.22);
    }

    .modal-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 1.5rem; }
    .modal-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 3px solid var(--faded-moss); }
    .modal-avatar-ph { width: 64px; height: 64px; border-radius: 50%; background: var(--lavender-mist); display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; border: 3px solid var(--faded-moss); }
    .modal-user-name { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--deep-plum); margin-bottom: 3px; }
    .modal-user-email { font-size: 13px; color: var(--terracotta); }
    .modal-close { margin-left: auto; background: none; border: none; font-size: 20px; color: var(--terracotta); cursor: pointer; padding: 4px 8px; border-radius: 6px; flex-shrink: 0; }
    .modal-close:hover { background: #EDE4F7; }

    .modal-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.25rem; }
    .modal-stat  { background: var(--lavender-mist); border-radius: 10px; padding: 0.75rem; text-align: center; }
    .modal-stat-num   { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--amethyst); }
    .modal-stat-label { font-size: 10px; color: var(--terracotta); margin-top: 2px; }

    .modal-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.25rem; }
    .info-item label { display: block; font-size: 10px; font-weight: 600; color: var(--terracotta); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
    .info-item span  { font-size: 13px; color: var(--deep-plum); }

    .action-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin-bottom: 1rem; }

    .action-btn {
      font-family: 'Nunito Sans', sans-serif; font-size: 12px; font-weight: 600;
      padding: 9px 14px; border-radius: 8px; border: 1.5px solid var(--border);
      background: #fff; color: var(--deep-plum); cursor: pointer; text-align: center;
      transition: background 0.15s;
    }
    .action-btn:hover { background: var(--lavender-mist); }
    .action-btn.danger { border-color: #F5C6C6; color: #922B21; }
    .action-btn.danger:hover { background: #FDECEC; }
    .action-btn.success { border-color: #9DC4B0; color: #2E6B50; }
    .action-btn.success:hover { background: #DCF0E8; }

    .confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(45,27,78,0.6); z-index: 9999; align-items: center; justify-content: center; }
    .confirm-overlay.open { display: flex; }
    .confirm-box { background: var(--aged-paper); border-radius: 16px; padding: 1.5rem; width: min(400px, 94vw); box-shadow: 0 8px 32px rgba(45,27,78,0.22); }
    .confirm-title { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--deep-plum); margin-bottom: 0.5rem; }
    .confirm-desc  { font-size: 13px; color: var(--terracotta); margin-bottom: 1.25rem; line-height: 1.5; }
    .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .confirm-btn { font-family: 'Nunito Sans', sans-serif; font-size: 13px; font-weight: 600; padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer; transition: opacity 0.15s; }
    .confirm-btn:hover { opacity: 0.85; }
    .confirm-cancel  { background: var(--aged-paper); color: var(--terracotta); border: 1.5px solid var(--border); }
    .confirm-proceed { background: #C0392B; color: #fff; }
    .confirm-safe    { background: var(--amethyst); color: #fff; }

    @media (max-width: 600px) {
      .modal-stats     { grid-template-columns: repeat(2,1fr); }
      .modal-info-grid { grid-template-columns: 1fr; }
      .search-input    { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page-wrap">

    <div class="page-header">
      <h1 class="page-title">⚙️ Admin Dashboard</h1>
      <p class="page-subtitle">WellRead Co. platform management</p>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card" onclick="showView('users')" style="cursor:pointer;" title="View all users">
        <span class="stat-num" id="statUsers">—</span>
        <span class="stat-label">Total Users</span>
      </div>
      <div class="stat-card" onclick="showView('books')" style="cursor:pointer;" title="View book database">
        <span class="stat-num" id="statBooks">—</span>
        <span class="stat-label">Books in Database</span>
      </div>
      <div class="stat-card" onclick="showView('clubs')" style="cursor:pointer;" title="View book clubs">
        <span class="stat-num" id="statClubs">—</span>
        <span class="stat-label">Book Clubs</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statActive">—</span>
        <span class="stat-label">Active Accounts</span>
      </div>
    </div>

    <!-- Detail Views (shown when stat card clicked) -->
    <div id="detailView" style="display:none;margin-bottom:1.75rem;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
        <h2 id="detailViewTitle" style="font-family:'Playfair Display',serif;font-size:20px;color:var(--deep-plum);"></h2>
        <button onclick="hideDetailView()" style="font-family:'Nunito Sans',sans-serif;font-size:13px;font-weight:600;padding:7px 14px;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--terracotta);cursor:pointer;">✕ Close</button>
      </div>
      <div id="detailViewContent" style="background:#fff;border-radius:12px;border:1px solid var(--border);overflow:hidden;"></div>
    </div>

    <!-- Notification Deployment -->
    <div class="notif-card">
      <h2 class="card-title">📢 Send App Notification</h2>

      <div class="form-group" style="margin-bottom:0.75rem;">
        <label style="display:block;font-size:11px;font-weight:600;color:var(--terracotta);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Title</label>
        <input type="text" class="notif-input" id="notifTitle" placeholder="Notification title" style="margin-bottom:0;">
      </div>

      <div class="form-group" style="margin-bottom:0.75rem;">
        <label style="display:block;font-size:11px;font-weight:600;color:var(--terracotta);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Body</label>
        <div id="notifBodyEditor" style="background:#fff;border:1.5px solid var(--border);border-radius:8px;font-family:'Nunito Sans',sans-serif;font-size:14px;color:var(--deep-plum);min-height:120px;"></div>
        <input type="hidden" id="notifBody">
      </div>

      <div class="notif-options" style="margin-bottom:1.25rem;">
        <label class="notif-checkbox">
          <input type="checkbox" id="notifInApp" checked>
          Send as in-app notification
        </label>
        <label class="notif-checkbox">
          <input type="checkbox" id="notifEmail" checked>
          Also send as email
        </label>
      </div>

      <!-- Test buttons -->
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0.875rem 1rem;background:var(--lavender-mist);border-radius:10px;margin-bottom:1rem;">
        <span style="font-size:12px;font-weight:600;color:var(--terracotta);text-transform:uppercase;letter-spacing:0.05em;">🧪 Test First</span>
        <button class="send-notif-btn" id="testInAppBtn" onclick="sendTestInApp()"
          style="background:var(--faded-moss);padding:8px 16px;font-size:13px;">
          <div class="spinner"></div>
          <span class="btn-text">Test In-App</span>
        </button>
        <button class="send-notif-btn" id="testEmailBtn" onclick="sendTestEmail()"
          style="background:var(--faded-moss);padding:8px 16px;font-size:13px;">
          <div class="spinner"></div>
          <span class="btn-text">Test Email</span>
        </button>
        <span style="font-size:11px;color:#BDB5CC;">Sends only to you</span>
      </div>

      <!-- Send to all -->
      <button class="send-notif-btn" id="sendNotifBtn" onclick="sendAppNotification()">
        <div class="spinner"></div>
        <span class="btn-text">📣 Send to All Users</span>
      </button>

      <!-- Sent ledger -->
      <div style="margin-top:1.75rem;border-top:1px solid var(--border);padding-top:1.25rem;">
        <h3 style="font-family:'Playfair Display',serif;font-size:16px;color:var(--deep-plum);margin-bottom:0.875rem;">📋 Sent Notifications</h3>
        <div id="notifLedger">
          <p style="font-size:13px;color:#BDB5CC;">Loading...</p>
        </div>
      </div>
    </div>

  </div>

  <!-- ── User Detail Modal ── -->
  <div class="modal-overlay" id="userModal" onclick="if(event.target===this)closeUserModal()">
    <div class="user-modal" id="userModalInner"></div>
  </div>

  <!-- ── Confirm Dialog ── -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <h3 class="confirm-title" id="confirmTitle">Are you sure?</h3>
      <p  class="confirm-desc"  id="confirmDesc"></p>
      <div class="confirm-actions">
        <button class="confirm-btn confirm-cancel" onclick="closeConfirm()">Cancel</button>
        <button class="confirm-btn" id="confirmProceedBtn" onclick="proceedConfirm()">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Quill rich text editor -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <script src="common.js"></script>

  <script>
    // ── State ─────────────────────────────────────────────────
    let allUsers      = [];
    let displayUsers  = [];
    let selectedUser  = null;
    let confirmAction = null;

    // ── Init ──────────────────────────────────────────────────
    WR.initAuth(async (user) => {
      if (!user) return;
      if (!WR.isAdmin()) {
        WR.showToast("Access denied.", "error");
        setTimeout(() => { location.href = "index.html"; }, 1000);
        return;
      }
      await Promise.all([loadStats(), loadUsers(), loadNotifLedger()]);
      try { initQuill(); } catch(e) { console.error("Quill init error:", e); }

      // Belt-and-suspenders: attach confirm button listener directly
      // in case inline onclick can't reach proceedConfirm
      const confirmBtn = document.getElementById("confirmProceedBtn");
      if (confirmBtn) {
        confirmBtn.addEventListener("click", async () => {
          console.log("Confirm button clicked via event listener, confirmAction:", !!confirmAction);
          document.getElementById("confirmOverlay").classList.remove("open");
          if (confirmAction) {
            const fn = confirmAction;
            confirmAction = null;
            await fn();
          }
        });
      }
    });

    // ── Stats ─────────────────────────────────────────────────
    async function loadStats() {
      const db = WR.getDb();
      try {
        const [users, books, clubs] = await Promise.all([
          db.collection("users").get(),
          db.collection("books").get(),
          db.collection("clubs").get()
        ]);
        const active = users.docs.filter(d => !d.data().suspended).length;
        document.getElementById("statUsers").textContent  = users.size;
        document.getElementById("statBooks").textContent  = books.size;
        document.getElementById("statClubs").textContent  = clubs.size;
        document.getElementById("statActive").textContent = active;
      } catch (e) { console.error("Stats error:", e); }
    }

    // ── Users ─────────────────────────────────────────────────
    async function loadUsers() {
      try {
        const snap = await WR.getDb().collection("users").orderBy("joinedAt", "desc").limit(200).get();
        allUsers     = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
        displayUsers = [...allUsers];
        // Only render table if the element exists (it's inside the detail view)
        if (document.getElementById("usersTableWrap")) renderUsersTable();
      } catch (e) {
        console.error("Load users error:", e);
      }
    }

    function filterUsers(val) {
      const q = val.toLowerCase().trim();
      displayUsers = q
        ? allUsers.filter(u =>
            (u.displayName || "").toLowerCase().includes(q) ||
            (u.firstName   || "").toLowerCase().includes(q) ||
            (u.lastName    || "").toLowerCase().includes(q) ||
            (u.email       || "").toLowerCase().includes(q)
          )
        : [...allUsers];
      applySort();
    }

    function applySort() {
      const sortEl = document.getElementById("userSort");
      if (!sortEl) { renderUsersTable(); return; }
      const val   = sortEl.value;
      const [field, dir] = val.split("-");

      if (val === "suspended") {
        displayUsers = displayUsers.filter(u => u.suspended);
        renderUsersTable();
        return;
      }

      displayUsers.sort((a, b) => {
        if (field === "joinedAt") {
          const av = a.joinedAt?.seconds || 0;
          const bv = b.joinedAt?.seconds || 0;
          return dir === "desc" ? bv - av : av - bv;
        }
        if (field === "displayName") {
          const av = (a.displayName || "").toLowerCase();
          const bv = (b.displayName || "").toLowerCase();
          return av.localeCompare(bv);
        }
        return 0;
      });
      renderUsersTable();
    }

    function renderUsersTableHTML() {
      if (!displayUsers.length) {
        return `<p style="padding:2rem;text-align:center;color:var(--terracotta);font-size:14px;">No users found.</p>`;
      }
      return `
        <table class="users-table">
          <thead>
            <tr>
              <th>User</th>
              <th>Email</th>
              <th>Provider</th>
              <th>Joined</th>
              <th>Last Login</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            ${displayUsers.map(u => `
              <tr onclick="openUserModal('${u.uid}')">
                <td>
                  <div class="user-cell">
                    ${u.photoURL
                      ? `<img class="user-avatar" src="${WR.escapeHTML(u.photoURL)}" alt="">`
                      : `<div class="user-avatar-ph">👤</div>`}
                    <div>
                      <div class="user-name">${WR.escapeHTML(u.displayName || "—")}</div>
                      <div class="user-handle">${WR.escapeHTML(u.firstName || "")} ${WR.escapeHTML(u.lastName || "")}</div>
                    </div>
                  </div>
                </td>
                <td>${WR.escapeHTML(u.email || "—")}</td>
                <td><span class="provider-badge">${u.authProvider === "google" ? "Google" : "Email"}</span></td>
                <td>${u.joinedAt ? WR.formatRelativeTime(u.joinedAt) : "—"}</td>
                <td>${u.lastLoginAt ? WR.formatRelativeTime(u.lastLoginAt) : "—"}</td>
                <td>
                  <span class="status-badge ${u.suspended ? "status-suspended" : "status-active"}">
                    ${u.suspended ? "Suspended" : "Active"}
                  </span>
                </td>
              </tr>`).join("")}
          </tbody>
        </table>`;
    }

    function renderUsersTable() {
      const wrap = document.getElementById("usersTableWrap");
      if (wrap) wrap.innerHTML = renderUsersTableHTML();
    }

    // ── User Detail Modal ─────────────────────────────────────
    async function openUserModal(uid) {
      selectedUser = allUsers.find(u => u.uid === uid);
      if (!selectedUser) return;

      const u = selectedUser;

      // Load book counts
      let libraryCount = 0, readCount = 0, wishlistCount = 0, tbrCount = 0;
      try {
        const booksSnap = await WR.getDb()
          .collection("users").doc(uid).collection("books").get();
        booksSnap.forEach(d => {
          const b = d.data();
          if (b.inLibrary)  libraryCount++;
          if (b.onReadList) readCount++;
          if (b.onWishlist) wishlistCount++;
          if (b.onTBR)      tbrCount++;
        });
      } catch (e) {}

      const joined    = u.joinedAt ? WR.formatFullDate(u.joinedAt) : "—";
      const lastLogin = u.lastLoginAt ? WR.formatFullDate(u.lastLoginAt) : "—";

      document.getElementById("userModalInner").innerHTML = `
        <div class="modal-header">
          ${u.photoURL
            ? `<img class="modal-avatar" src="${WR.escapeHTML(u.photoURL)}" alt="">`
            : `<div class="modal-avatar-ph">👤</div>`}
          <div>
            <div class="modal-user-name">${WR.escapeHTML(u.displayName || "—")}</div>
            <div class="modal-user-email">${WR.escapeHTML(u.email || "—")}</div>
          </div>
          <button class="modal-close" onclick="closeUserModal()">✕</button>
        </div>

        <div class="modal-stats">
          <div class="modal-stat"><div class="modal-stat-num">${libraryCount}</div><div class="modal-stat-label">Library</div></div>
          <div class="modal-stat"><div class="modal-stat-num">${readCount}</div><div class="modal-stat-label">Read</div></div>
          <div class="modal-stat"><div class="modal-stat-num">${wishlistCount}</div><div class="modal-stat-label">Wishlist</div></div>
          <div class="modal-stat"><div class="modal-stat-num">${tbrCount}</div><div class="modal-stat-label">TBR</div></div>
        </div>

        <div class="modal-info-grid">
          <div class="info-item"><label>Full Name</label><span>${WR.escapeHTML((u.firstName||"")+" "+(u.lastName||""))}</span></div>
          <div class="info-item"><label>Display Name</label><span>${WR.escapeHTML(u.displayName||"—")}</span></div>
          <div class="info-item"><label>Auth Provider</label><span>${u.authProvider === "google" ? "Google" : "Email/Password"}</span></div>
          <div class="info-item"><label>Status</label><span>${u.suspended ? "🔴 Suspended" : "🟢 Active"}</span></div>
          <div class="info-item"><label>Joined</label><span>${joined}</span></div>
          <div class="info-item"><label>Last Login</label><span>${lastLogin}</span></div>
        </div>

        <div class="action-grid">
          <button class="action-btn" onclick="adminResetPassword('${uid}','${WR.escapeHTML(u.email||"")}')">🔑 Reset Password</button>
          ${u.suspended
            ? `<button class="action-btn success" onclick="adminReinstate('${uid}')">✅ Reinstate Account</button>`
            : `<button class="action-btn danger"  onclick="adminSuspend('${uid}')">⏸️ Suspend Account</button>`}
          <button class="action-btn danger"  onclick="adminReset('${uid}')">🔄 Reset Account Data</button>
          <button class="action-btn danger"  onclick="adminDelete('${uid}')">🗑️ Delete Account</button>
        </div>

        <div style="margin-top:0.5rem;">
          <a href="profile.html?uid=${uid}" target="_blank" style="font-size:13px;color:var(--amethyst);text-decoration:none;">View public profile →</a>
        </div>`;

      document.getElementById("userModal").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeUserModal() {
      document.getElementById("userModal").classList.remove("open");
      document.body.style.overflow = "";
      selectedUser = null;
    }

    // ── Admin Actions ─────────────────────────────────────────
    async function adminResetPassword(uid, email) {
      if (!email) { WR.showToast("No email on file.", "error"); return; }
      showConfirm(
        "Reset Password",
        `Send a password reset email to ${email}?`,
        "Send Reset Email",
        "safe",
        async () => {
          try {
            await WR.getAuth().sendPasswordResetEmail(email);
            WR.showToast("Password reset email sent!", "success");
          } catch (e) {
            WR.showToast("Error sending reset email.", "error");
          }
        }
      );
    }

    async function adminSuspend(uid) {
      showConfirm(
        "Suspend Account",
        "This will block the user from accessing the platform. Their data will be preserved.",
        "Suspend Account",
        "danger",
        async () => {
          try {
            await WR.getDb().collection("users").doc(uid).set(
              { suspended: true, suspendedAt: firebase.firestore.FieldValue.serverTimestamp() },
              { merge: true }
            );
            updateLocalUser(uid, { suspended: true });
            renderUsersTable();
            closeUserModal();
            WR.showToast("Account suspended.");
          } catch (e) { WR.showToast("Error suspending account.", "error"); }
        }
      );
    }

    async function adminReinstate(uid) {
      showConfirm(
        "Reinstate Account",
        "This will restore the user's access to the platform.",
        "Reinstate",
        "safe",
        async () => {
          try {
            await WR.getDb().collection("users").doc(uid).set(
              { suspended: false, suspendedAt: null },
              { merge: true }
            );
            updateLocalUser(uid, { suspended: false });
            renderUsersTable();
            closeUserModal();
            WR.showToast("Account reinstated.", "success");
          } catch (e) { WR.showToast("Error reinstating account.", "error"); }
        }
      );
    }

    async function adminReset(uid) {
      showConfirm(
        "Reset Account Data",
        "This will permanently delete the user's library, read list, wishlist, reviews, and club memberships. Their login and basic profile will be preserved. This CANNOT be undone.",
        "Reset Account Data",
        "danger",
        async () => {
          try {
            // Delete subcollection books (client-side batch for up to 500)
            const booksSnap = await WR.getDb().collection("users").doc(uid).collection("books").get();
            const batch = WR.getDb().batch();
            booksSnap.docs.forEach(d => batch.delete(d.ref));
            await batch.commit();
            WR.showToast("Account data reset.", "success");
            closeUserModal();
          } catch (e) { WR.showToast("Error resetting account.", "error"); }
        }
      );
    }

    async function adminDelete(uid) {
      showConfirm(
        "Permanently Delete Account",
        "This will permanently mark the account for deletion and suspend access. Full data cleanup requires the Cloudflare Worker. THIS CANNOT BE UNDONE.",
        "Delete Account",
        "danger",
        async () => {
          try {
            await WR.getDb().collection("users").doc(uid).set(
              { suspended: true, deletedAt: firebase.firestore.FieldValue.serverTimestamp() },
              { merge: true }
            );
            allUsers     = allUsers.filter(u => u.uid !== uid);
            displayUsers = displayUsers.filter(u => u.uid !== uid);
            renderUsersTable();
            closeUserModal();
            document.getElementById("statUsers").textContent = allUsers.length;
            WR.showToast("Account marked for deletion.");
          } catch (e) { WR.showToast("Error deleting account.", "error"); }
        }
      );
    }

    function updateLocalUser(uid, updates) {
      const idx = allUsers.findIndex(u => u.uid === uid);
      if (idx !== -1) allUsers[idx] = { ...allUsers[idx], ...updates };
      const idx2 = displayUsers.findIndex(u => u.uid === uid);
      if (idx2 !== -1) displayUsers[idx2] = { ...displayUsers[idx2], ...updates };
    }

    // ── Constants ─────────────────────────────────────────────
    const ADMIN_UID   = "lxXxOVUQ8IVzBop4n1eqDHal6Gy2";
    const ADMIN_EMAIL = "matt.zmud@gmail.com";

    // ── Stat Card Detail Views ────────────────────────────────
    function showView(type) {
      const view    = document.getElementById("detailView");
      const title   = document.getElementById("detailViewTitle");
      const content = document.getElementById("detailViewContent");
      view.style.display = "block";
      view.scrollIntoView({ behavior: "smooth", block: "start" });

      if (type === "users") {
        title.textContent = "👤 All Users";
        content.innerHTML = `
          <div style="display:flex;gap:8px;flex-wrap:wrap;padding:1rem;border-bottom:1px solid var(--border);">
            <input type="text" class="search-input" id="userSearch" placeholder="Search by name or email..."
              oninput="filterUsers(this.value)"
              style="flex:1;min-width:200px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'Nunito Sans',sans-serif;font-size:13px;color:var(--deep-plum);outline:none;">
            <select id="userSort" onchange="applySort()"
              style="padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'Nunito Sans',sans-serif;font-size:13px;color:var(--deep-plum);background:#fff;cursor:pointer;outline:none;">
              <option value="joinedAt-desc">Newest First</option>
              <option value="joinedAt-asc">Oldest First</option>
              <option value="displayName-asc">Name A–Z</option>
              <option value="suspended">Suspended</option>
            </select>
          </div>
          <div id="usersTableWrap">${renderUsersTableHTML()}</div>`;
      } else if (type === "books") {
        title.textContent = "📚 Books in Database";
        content.innerHTML = `<p style="padding:2rem;text-align:center;color:var(--terracotta);font-size:14px;">Loading books...</p>`;
        loadBooksView(content);
      } else if (type === "clubs") {
        title.textContent = "👥 Book Clubs";
        content.innerHTML = `<p style="padding:2rem;text-align:center;color:var(--terracotta);font-size:14px;">Loading clubs...</p>`;
        loadClubsView(content);
      }
    }

    function hideDetailView() {
      document.getElementById("detailView").style.display = "none";
    }

    async function loadBooksView(container) {
      try {
        const snap  = await WR.getDb().collection("books").orderBy("title").limit(200).get();
        const books = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (!books.length) {
          container.innerHTML = `<p style="padding:2rem;text-align:center;color:var(--terracotta);font-size:14px;">No books in database yet.</p>`;
          return;

          <table class="users-table">
            <thead><tr>
              <th>Title</th><th>Author</th><th>ISBN</th><th>Source</th>
            </tr></thead>
            <tbody>
              ${books.map(b => `
                <tr onclick="location.href='book.html?id=${b.id}'" style="cursor:pointer;">
                  <td style="font-weight:600;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${WR.escapeHTML(b.title || "—")}</td>
                  <td style="color:var(--terracotta);">${WR.escapeHTML(b.author || b.authors?.[0] || "—")}</td>
                  <td style="font-size:11px;color:#BDB5CC;font-family:monospace;">${b.isbn13 || b.isbn || b.googleBooksId?.slice(0,10) || "—"}</td>

                </tr>`).join("")}

          </table>`;

    async function loadClubsView(container) {
      try {
        const snap  = await WR.getDb().collection("clubs").orderBy("name").limit(100).get();
        const clubs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        container.innerHTML = `
          <table class="users-table">
            <thead><tr>
              <th>Club Name</th><th>Members</th><th>Current Read</th><th>Created</th>
            </tr></thead>
            <tbody>
              ${clubs.map(c => `
                <tr onclick="location.href='club.html?id=${c.id}'" style="cursor:pointer;">
                  <td style="font-weight:600;">${WR.escapeHTML(c.name||"")}</td>
                  <td>${c.memberUids?.length||0}</td>
                  <td>${c.currentRead?.title ? WR.escapeHTML(c.currentRead.title) : "—"}</td>
                  <td style="font-size:11px;color:#BDB5CC;">${c.createdAt ? WR.formatRelativeTime(c.createdAt) : "—"}</td>

            </tbody>

        container.innerHTML = `<p style="padding:2rem;color:var(--terracotta);">Error loading clubs: ${e.message}</p>`;

    // ── Quill Rich Text Editor ────────────────────────────────
    let quillEditor = null;

    function initQuill() {
      quillEditor = new Quill("#notifBodyEditor", {
        theme: "snow",
        placeholder: "Notification body — supports bold, italic, links, emoji...",
        modules: {
          toolbar: [
            ["bold", "italic", "underline"],
            [{ list: "ordered" }, { list: "bullet" }],
            ["link"],
            ["clean"]
          ]
        }
      });
    }

    // ── Notification Helpers ──────────────────────────────────
    function getNotifFields() {
      const title    = document.getElementById("notifTitle").value.trim();
      // Quill getText() always includes a trailing \n — trim it
      // Also check if the editor only contains whitespace/newlines
      const rawText  = quillEditor ? quillEditor.getText() : "";
      const body     = rawText.replace(/\n+$/, "").trim();
      const bodyHTML = quillEditor ? quillEditor.root.innerHTML.trim() : "";
      // If Quill only has the default empty paragraph, treat as empty
      const isEmptyHTML = bodyHTML === "<p><br></p>" || bodyHTML === "";
      const inApp    = document.getElementById("notifInApp").checked;
      const email    = document.getElementById("notifEmail").checked;
      return { title, body: isEmptyHTML ? "" : body, bodyHTML: isEmptyHTML ? "" : bodyHTML, inApp, email };
    }

    function clearNotifForm() {
      document.getElementById("notifTitle").value = "";
      if (quillEditor) quillEditor.setContents([]);
    }

    // ── Test In-App Notification ──────────────────────────────
    async function sendTestInApp() {
      const { title, body, bodyHTML } = getNotifFields();
      if (!title || !body) { WR.showToast("Enter a title and body first.", "error"); return; }
      const btn = document.getElementById("testInAppBtn");
      btn.classList.add("loading"); btn.disabled = true;
      try {
        await WR.getDb()
          .collection("notifications").doc(ADMIN_UID)
          .collection("items").add({
            type:      "app_admin",
            title,
            body,
            bodyHTML:  bodyHTML || null,
            linkedId:  null,
            read:      false,
            dismissed: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        WR.showToast("Test in-app notification sent to you! 🔔", "success");
      } catch (e) {
        console.error("Test in-app error:", e);
        WR.showToast("Error sending test.", "error");
      } finally {
        btn.classList.remove("loading"); btn.disabled = false;
      }
    }

    // ── Test Email ────────────────────────────────────────────
    async function sendTestEmail() {
      const { title, body } = getNotifFields();
      if (!title || !body) { WR.showToast("Enter a title and body first.", "error"); return; }
      const btn = document.getElementById("testEmailBtn");
      btn.classList.add("loading"); btn.disabled = true;
      try {
        const result = await WR.callWorker("send_broadcast_emails", {
          title,
          body,
          users: [{ email: ADMIN_EMAIL, displayName: "Matt (Test)" }]
        });
        if (result?.success) {
          WR.showToast(`Test email sent to ${ADMIN_EMAIL}! 📧`, "success");
        } else {
          throw new Error(result?.error || "Unknown error");
        }
      } catch (e) {
        console.error("Test email error:", e);
        WR.showToast("Error sending test email: " + e.message, "error");
      } finally {
        btn.classList.remove("loading"); btn.disabled = false;
      }
    }

    // ── Send to All Users ─────────────────────────────────────
    async function sendAppNotification() {
      const { title, body, bodyHTML, inApp, email } = getNotifFields();

      console.log("sendAppNotification called:", { title, bodyLen: body.length, inApp, email, allUsersCount: allUsers.length });

      if (!title || !body) {
        WR.showToast("Please enter a title and body.", "error");
        return;
      }
      if (!inApp && !email) {
        WR.showToast("Select at least one delivery method.", "error");
        return;
      }

      const userCount = allUsers.length;

      if (userCount === 0) {
        WR.showToast("No users loaded yet — please wait a moment and try again.", "error");
        console.error("allUsers is empty — loadUsers may have failed");
        return;
      }

      showConfirm(
        "Send to All Users",
        `Send "${title}" to all ${userCount} users?${email ? " Includes email." : ""}`,
        "Send to All",
        "safe",
        async () => {
          const btn = document.getElementById("sendNotifBtn");
          btn.classList.add("loading"); btn.disabled = true;
          try {
            console.log("Starting broadcast to", userCount, "users");

            // 1. Save to appNotifications ledger
            console.log("Writing to ledger...");
            await WR.getDb().collection("appNotifications").add({
              title,
              body,
              inApp,
              emailAlso: email,
              recipientCount: userCount,
              sentAt:    firebase.firestore.FieldValue.serverTimestamp(),
              sentByUid: WR.getCurrentUser().uid
            });
            console.log("Ledger written ✓");

            // 2. Send in-app notifications via Firestore batch
            if (inApp) {
              console.log("Sending in-app notifications...");
              const batchSize = 400;
              for (let i = 0; i < allUsers.length; i += batchSize) {
                const batch = WR.getDb().batch();
                allUsers.slice(i, i + batchSize).forEach(u => {
                  const ref = WR.getDb()
                    .collection("notifications").doc(u.uid)
                    .collection("items").doc();
                  batch.set(ref, {
                    type: "app_admin", title, body,
                    bodyHTML: bodyHTML || null, linkedId: null,
                    read: false, dismissed: false,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                  });
                });
                await batch.commit();
                console.log(`Batch ${i / batchSize + 1} committed ✓`);
              }
            }

            // 3. Send broadcast emails via Worker
            if (email) {
              console.log("Sending broadcast emails...");
              const emailUsers = allUsers
                .filter(u => u.email && !u.suspended)
                .map(u => ({ email: u.email, displayName: u.displayName || "reader" }));

              if (emailUsers.length) {
                const result = await WR.callWorker("send_broadcast_emails", {
                  title, body, users: emailUsers
                });
                console.log("Broadcast email result:", result);
                if (!result?.success) {
                  WR.showToast(`In-app sent. Email had issues: ${result?.error || "check logs"}`, "error");
                  return;
                }
              }
            }

            clearNotifForm();
            WR.showToast(`Sent to ${userCount} users! 📢`, "success");
            loadNotifLedger();
          } catch (e) {
            console.error("Broadcast error:", e);
            WR.showToast("Error sending notification: " + e.message, "error");
          } finally {
            btn.classList.remove("loading"); btn.disabled = false;
          }
        }
      );
    }

    // ── Notification Ledger ───────────────────────────────────
    async function loadNotifLedger() {
      const el = document.getElementById("notifLedger");
      try {
        const snap = await WR.getDb()
          .collection("appNotifications")
          .orderBy("sentAt", "desc")
          .limit(20)
          .get();

        if (snap.empty) {
          el.innerHTML = `<p style="font-size:13px;color:#BDB5CC;">No notifications sent yet.</p>`;
          return;
        }

        el.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:8px;">
            ${snap.docs.map(d => {
              const n = d.data();
              const date = n.sentAt?.toDate
                ? n.sentAt.toDate().toLocaleString("en-US", { month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit" })
                : "Unknown date";
              const badges = [
                n.inApp !== false ? `<span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:8px;background:var(--lavender-mist);color:var(--amethyst);">🔔 In-App</span>` : "",
                n.emailAlso ? `<span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:8px;background:#FEF3CD;color:#8B6914;">📧 Email</span>` : ""
              ].filter(Boolean).join(" ");
              return `
                <div style="padding:10px 12px;background:var(--lavender-mist);border-radius:8px;border:1px solid var(--border);">
                  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px;">
                    <span style="font-size:13px;font-weight:600;color:var(--deep-plum);">${WR.escapeHTML(n.title||"")}</span>
                    <span style="font-size:11px;color:#BDB5CC;white-space:nowrap;flex-shrink:0;">${date}</span>
                  </div>
                  <div style="font-size:12px;color:var(--terracotta);margin-bottom:6px;">${WR.escapeHTML((n.body||"").slice(0,120))}${(n.body||"").length > 120 ? "…" : ""}</div>
                  <div style="display:flex;align-items:center;gap:6px;">
                    ${badges}
                    ${n.recipientCount ? `<span style="font-size:10px;color:#BDB5CC;">${n.recipientCount} recipients</span>` : ""}
                  </div>
                </div>`;
            }).join("")}
          </div>`;
      } catch (e) {
        el.innerHTML = `<p style="font-size:13px;color:var(--terracotta);">Error loading ledger.</p>`;
        console.error("Ledger error:", e);
      }
    }

    // ── Confirm Dialog ────────────────────────────────────────
    function showConfirm(title, desc, btnLabel, btnType, onConfirm) {
      document.getElementById("confirmTitle").textContent = title;
      document.getElementById("confirmDesc").textContent  = desc;
      const btn = document.getElementById("confirmProceedBtn");
      btn.textContent = btnLabel;
      btn.className   = `confirm-btn ${btnType === "danger" ? "confirm-proceed" : "confirm-safe"}`;
      confirmAction   = onConfirm;
      document.getElementById("confirmOverlay").classList.add("open");
    }

    function closeConfirm() {
      document.getElementById("confirmOverlay").classList.remove("open");
      confirmAction = null;
    }

    async function proceedConfirm() {
      closeConfirm();
      if (confirmAction) await confirmAction();
    }

    window.filterUsers         = filterUsers;
    window.applySort           = applySort;
    window.openUserModal       = openUserModal;
    window.closeUserModal      = closeUserModal;
    window.adminResetPassword  = adminResetPassword;
    window.adminSuspend        = adminSuspend;
    window.adminReinstate      = adminReinstate;
    window.adminReset          = adminReset;
    window.adminDelete         = adminDelete;
    window.sendAppNotification = sendAppNotification;
    window.sendTestInApp       = sendTestInApp;
    window.sendTestEmail       = sendTestEmail;
    window.showView            = showView;
    window.hideDetailView      = hideDetailView;
    window.closeConfirm        = closeConfirm;
    window.proceedConfirm      = proceedConfirm;
  </script>

  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
  </script>
