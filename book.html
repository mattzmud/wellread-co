<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WellRead Co. — Book Detail</title>
  <meta name="theme-color" content="#2D1B4E">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon-96x96.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --lavender-mist: #F7F3FF;
      --aged-paper:    #FAF6EE;
      --deep-plum:     #2D1B4E;
      --amethyst:      #7B5EA7;
      --faded-moss:    #9DC4B0;
      --warm-gold:     #C9A84C;
      --terracotta:    #A0674A;
      --border:        #E8DFC8;
    }

    html, body {
      min-height: 100%;
      font-family: 'Nunito Sans', sans-serif;
      background: var(--lavender-mist);
      color: var(--deep-plum);
    }

    /* ── Page Layout ── */
    .page-wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1.25rem 6rem;
    }

    /* ── Back Link ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--amethyst);
      text-decoration: none;
      margin-bottom: 1.5rem;
      padding: 6px 0;
    }

    .back-link:hover { text-decoration: underline; }

    /* ── Hero Section ── */
    .book-hero {
      display: flex;
      gap: 2rem;
      margin-bottom: 2rem;
      align-items: flex-start;
    }

    .book-cover-col { flex-shrink: 0; }

    .book-cover-large {
      width: 160px;
      height: 230px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 4px 6px 24px rgba(45,27,78,0.22);
      display: block;
    }

    .book-cover-placeholder-large {
      width: 160px;
      height: 230px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--amethyst), #4A2D7A);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      box-shadow: 4px 6px 24px rgba(45,27,78,0.22);
    }

    .book-meta-col { flex: 1; min-width: 0; }

    .book-club-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 0.75rem;
    }

    .club-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      background: #EDE4F7;
      color: #5B3E8A;
      border: 1px solid #D4C8F0;
    }

    .book-title-large {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--deep-plum);
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }

    .book-author-large {
      font-size: 16px;
      color: var(--terracotta);
      margin-bottom: 0.75rem;
    }

    /* ── Rating Display ── */
    .rating-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1rem;
    }

    .stars-large { font-size: 20px; color: var(--warm-gold); letter-spacing: 2px; }
    .rating-num  { font-size: 20px; font-weight: 600; color: var(--deep-plum); }
    .rating-cnt  { font-size: 13px; color: #BDB5CC; }

    /* ── Book Details Grid ── */
    .book-details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
      margin-bottom: 1.25rem;
    }

    .detail-item { }

    .detail-label {
      font-size: 10px;
      font-weight: 600;
      color: #BDB5CC;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .detail-value {
      font-size: 13px;
      color: var(--deep-plum);
      margin-top: 1px;
    }

    /* ── Action Buttons ── */
    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 1rem;
    }

    .action-btn {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .action-btn:hover  { opacity: 0.85; }
    .action-btn:active { transform: scale(0.97); }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-library  { background: var(--amethyst); color: #FAF6EE; }
    .btn-read     { background: var(--faded-moss); color: #1A3D2E; }
    .btn-tbr      { background: var(--warm-gold); color: #FAF6EE; }
    .btn-wishlist { background: var(--aged-paper); color: var(--terracotta); border: 1.5px solid var(--border); }
    .btn-view     { background: var(--lavender-mist); color: var(--amethyst); border: 1.5px solid var(--amethyst); }
    .btn-greyed   { background: #F0EAF8; color: #BDB5CC; cursor: default; }
    .btn-remove   { background: transparent; color: var(--terracotta); border: 1.5px solid var(--border); }
    .btn-refresh  { background: transparent; color: #BDB5CC; border: 1.5px solid var(--border); font-size: 12px; padding: 7px 14px; }

    /* ── Content Sections ── */
    .content-section {
      background: #fff;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 1.25rem;
      overflow: hidden;
    }

    .section-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .section-toggle:hover { background: var(--lavender-mist); }

    .section-toggle-title {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      color: var(--deep-plum);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-count {
      font-size: 12px;
      font-weight: 600;
      background: var(--lavender-mist);
      color: var(--amethyst);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .section-arrow {
      font-size: 12px;
      color: var(--terracotta);
      transition: transform 0.2s;
    }

    .section-toggle.open .section-arrow { transform: rotate(180deg); }

    .section-body {
      display: none;
      padding: 0 1.25rem 1.25rem;
      border-top: 1px solid var(--border);
    }

    .section-body.open { display: block; }

    /* ── Description ── */
    .description-text {
      font-size: 14px;
      line-height: 1.75;
      color: var(--deep-plum);
      padding-top: 1rem;
    }

    .description-text.clamped {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .read-more-btn {
      background: none;
      border: none;
      color: var(--amethyst);
      font-family: 'Nunito Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      padding: 4px 0;
      display: block;
      margin-top: 6px;
    }

    /* ── Reviews ── */
    .review-card {
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
    }

    .review-card:last-child { border-bottom: none; }

    .review-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 0.5rem;
    }

    .reviewer-photo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .reviewer-placeholder {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--lavender-mist);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .reviewer-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--deep-plum);
      text-decoration: none;
    }

    .reviewer-name:hover { color: var(--amethyst); }

    .review-date {
      font-size: 11px;
      color: #BDB5CC;
      margin-left: auto;
    }

    .review-stars { font-size: 14px; color: var(--warm-gold); margin-bottom: 0.4rem; }

    .review-text {
      font-size: 13px;
      line-height: 1.6;
      color: var(--deep-plum);
    }

    .review-club-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      background: #EDE4F7;
      color: #5B3E8A;
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 6px;
    }

    .no-reviews {
      padding: 1.5rem 0;
      text-align: center;
      font-size: 14px;
      color: var(--terracotta);
    }

    /* ── Write a Review ── */
    .write-review-section {
      background: var(--lavender-mist);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .write-review-title {
      font-family: 'Playfair Display', serif;
      font-size: 15px;
      color: var(--deep-plum);
      margin-bottom: 0.75rem;
    }

    .star-picker-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0.75rem;
    }

    .star-pick-label {
      font-size: 12px;
      color: var(--terracotta);
    }

    .review-textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 14px;
      color: var(--deep-plum);
      background: #fff;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 0.75rem;
    }

    .review-textarea:focus { border-color: var(--amethyst); }

    .review-submit-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .publish-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--terracotta);
      cursor: pointer;
    }

    .publish-toggle input { cursor: pointer; accent-color: var(--amethyst); }

    .submit-review-btn {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 8px;
      border: none;
      background: var(--amethyst);
      color: #FAF6EE;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .submit-review-btn:hover    { opacity: 0.85; }
    .submit-review-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── My Notes section ── */
    .my-notes-prompt {
      padding: 1rem 0;
      font-size: 14px;
      color: var(--terracotta);
      text-align: center;
    }

    .my-notes-prompt a {
      color: var(--amethyst);
      text-decoration: none;
    }

    .my-notes-prompt a:hover { text-decoration: underline; }

    /* ── Loading State ── */
    .skeleton-hero {
      display: flex;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .skeleton-cover-lg {
      width: 160px;
      height: 230px;
      border-radius: 8px;
      background: linear-gradient(90deg, #ede8f5 25%, #e0d8ef 50%, #ede8f5 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      flex-shrink: 0;
    }

    .skeleton-meta { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-top: 4px; }

    .skeleton-line {
      height: 14px;
      border-radius: 7px;
      background: linear-gradient(90deg, #ede8f5 25%, #e0d8ef 50%, #ede8f5 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Not Found ── */
    .not-found {
      text-align: center;
      padding: 4rem 2rem;
    }

    .not-found-icon  { font-size: 52px; margin-bottom: 1rem; display: block; }
    .not-found-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: var(--deep-plum);
      margin-bottom: 0.5rem;
    }
    .not-found-desc { font-size: 14px; color: var(--terracotta); margin-bottom: 1.5rem; }

    /* ── Responsive ── */
    @media (max-width: 580px) {
      .book-hero {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .book-club-badges  { justify-content: center; }
      .rating-row        { justify-content: center; }
      .book-details-grid { grid-template-columns: 1fr; }
      .action-buttons    { justify-content: center; }

      .book-cover-large,
      .book-cover-placeholder-large {
        width: 130px;
        height: 186px;
      }

      .skeleton-hero { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>

  <div class="page-wrap" id="pageWrap">
    <a href="javascript:history.back()" class="back-link">← Back</a>
    <div id="bookContent">
      <!-- Skeleton while loading -->
      <div class="skeleton-hero">
        <div class="skeleton-cover-lg"></div>
        <div class="skeleton-meta">
          <div class="skeleton-line" style="width:70%;height:28px;"></div>
          <div class="skeleton-line" style="width:45%"></div>
          <div class="skeleton-line" style="width:30%"></div>
          <div class="skeleton-line" style="width:55%"></div>
          <div class="skeleton-line" style="width:80%"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Reading Details Modal ── -->
  <div class="modal-overlay" id="readModal" onclick="if(event.target===this)closeReadModal()" style="display:none;position:fixed;inset:0;background:rgba(45,27,78,0.45);z-index:500;align-items:center;justify-content:center;padding:1.25rem;">
    <div style="background:var(--aged-paper);border-radius:20px;padding:1.75rem;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(45,27,78,0.25);">
      <div style="width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 1.25rem;"></div>
      <h2 style="font-family:'Playfair Display',serif;font-size:20px;color:var(--deep-plum);margin-bottom:0.25rem;">📖 Log Reading</h2>
      <p style="font-size:13px;color:var(--terracotta);margin-bottom:1.25rem;">Record how and when you read this book.</p>

      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:11px;font-weight:600;color:var(--terracotta);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">Format</label>
        <div style="display:flex;gap:8px;">
          <button class="read-format-btn active" id="fmtRead"     onclick="selectFormat('read')"     style="flex:1;padding:10px;border-radius:8px;border:1.5px solid var(--amethyst);background:var(--amethyst);color:#FAF6EE;font-family:'Nunito Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;">📖 Read</button>
          <button class="read-format-btn"        id="fmtListened" onclick="selectFormat('listened')" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--deep-plum);font-family:'Nunito Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;">🎧 Listened</button>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem;">
        <div>
          <label style="display:block;font-size:11px;font-weight:600;color:var(--terracotta);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Start Date <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#BDB5CC;font-size:10px;">(optional)</span></label>
          <input type="date" id="rmStartDate" style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'Nunito Sans',sans-serif;font-size:13px;color:var(--deep-plum);background:#fff;outline:none;">
        </div>
        <div>
          <label style="display:block;font-size:11px;font-weight:600;color:var(--terracotta);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Finish Date <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#BDB5CC;font-size:10px;">(optional)</span></label>
          <input type="date" id="rmEndDate" style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'Nunito Sans',sans-serif;font-size:13px;color:var(--deep-plum);background:#fff;outline:none;" oninput="onEndDateInput()">
        </div>
      </div>

      <label id="rmNoDateWrap" style="display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--deep-plum);cursor:pointer;padding:10px 12px;background:#EDF7F0;border-radius:8px;margin-bottom:0.75rem;border:1px solid #C8E6D0;">
        <input type="checkbox" id="rmNoDate" style="width:16px;height:16px;accent-color:var(--faded-moss);cursor:pointer;margin-top:1px;flex-shrink:0;" onchange="onNoDateChange()">
        <div>
          <div style="font-weight:600;color:#2E6B50;">Log as complete without a date</div>
          <div style="font-size:11px;color:#5A8A6A;margin-top:2px;">Counts toward your all-time reads but not "This Year".</div>
        </div>
      </label>

      <label style="display:flex;align-items:center;gap:10px;font-size:14px;color:var(--deep-plum);cursor:pointer;padding:10px;background:var(--lavender-mist);border-radius:8px;margin-bottom:1.25rem;">
        <input type="checkbox" id="rmDNF" style="width:16px;height:16px;accent-color:var(--amethyst);cursor:pointer;">
        Did Not Finish (DNF)
      </label>

      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button onclick="closeReadModal()" style="font-family:'Nunito Sans',sans-serif;font-size:14px;font-weight:600;padding:10px 20px;border-radius:8px;border:1.5px solid var(--border);background:var(--aged-paper);color:var(--terracotta);cursor:pointer;">Cancel</button>
        <button onclick="confirmMarkRead()" style="font-family:'Nunito Sans',sans-serif;font-size:14px;font-weight:600;padding:10px 20px;border-radius:8px;border:none;background:var(--amethyst);color:#FAF6EE;cursor:pointer;">Save</button>
      </div>
    </div>
  </div>

  <!-- ── Lending Modal ── -->
  <div class="modal-overlay" id="lendModal" onclick="if(event.target===this)closeLendModal()" style="display:none;position:fixed;inset:0;background:rgba(45,27,78,0.45);z-index:500;align-items:flex-end;justify-content:center;">
    <div style="background:var(--aged-paper);border-radius:20px 20px 0 0;padding:1.75rem;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;box-shadow:0 -4px 32px rgba(45,27,78,0.18);">
      <div style="width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 1.25rem;"></div>
      <h2 style="font-family:'Playfair Display',serif;font-size:20px;color:var(--deep-plum);margin-bottom:0.25rem;">📖 Lend This Book</h2>
      <p style="font-size:13px;color:var(--terracotta);margin-bottom:1.25rem;">Track who has your book and when you lent it.</p>
      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:11px;font-weight:600;color:var(--terracotta);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Borrower Name</label>
        <input type="text" id="lmBorrower" placeholder="Their name" style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:'Nunito Sans',sans-serif;font-size:14px;color:var(--deep-plum);background:#fff;outline:none;" oninput="this.style.borderColor='var(--amethyst)'">
      </div>
      <div style="margin-bottom:1.25rem;">
        <label style="display:block;font-size:11px;font-weight:600;color:var(--terracotta);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Date Lent</label>
        <input type="date" id="lmDate" style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:'Nunito Sans',sans-serif;font-size:14px;color:var(--deep-plum);background:#fff;outline:none;">
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button onclick="closeLendModal()" style="font-family:'Nunito Sans',sans-serif;font-size:14px;font-weight:600;padding:10px 20px;border-radius:8px;border:1.5px solid var(--border);background:var(--aged-paper);color:var(--terracotta);cursor:pointer;">Cancel</button>
        <button onclick="confirmLend()" style="font-family:'Nunito Sans',sans-serif;font-size:14px;font-weight:600;padding:10px 20px;border-radius:8px;border:none;background:var(--amethyst);color:#FAF6EE;cursor:pointer;">Record Loan</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <script src="common.js"></script>

  <script>
    // ── State ─────────────────────────────────────────────────
    let book        = null;
    let userBook    = null;
    let allReviews  = [];
    let clubReviews = [];
    let userClubs   = [];
    let myRating    = 0;
    let descExpanded = false;

    // ── Init ──────────────────────────────────────────────────
    WR.initAuth(async (user) => {
      if (!user) return;

      const params = new URLSearchParams(location.search);
      const bookId = params.get("id");

      if (!bookId) {
        showNotFound();
        return;
      }

      // Fetch book data and user data in parallel.
      // Try Firestore DB and Google Books API simultaneously —
      // whichever returns first wins for the book data.
      // This solves the first-navigation Firestore timing issue.
      const [firestoreBook, apiBook] = await Promise.all([
        WR.getDb().collection("books").doc(bookId).get()
          .then(snap => snap.exists ? { id: snap.id, ...snap.data() } : null)
          .catch(() => null),
        fetchFromAPI(bookId),
        loadUserBook(bookId),
        loadUserClubs()
      ]);

      // Prefer Firestore data (more complete), fall back to API
      book = firestoreBook || apiBook;

      if (!book) {
        showNotFound();
        return;
      }

      // Save to Firestore if it only came from API
      if (!firestoreBook && apiBook) {
        WR.saveBookToDb(apiBook).catch(() => {});
      }

      document.title = `${book.title} — WellRead Co.`;

      await Promise.all([
        loadReviews(bookId),
        loadClubReviews(bookId)
      ]);

      renderPage();
      WR.initStarPicker("myStarPicker");
      renderLendingSection();
    });

    // ── Data Loaders ──────────────────────────────────────────
    async function fetchFromAPI(bookId) {
      try {
        let result = null;
        if (bookId.length === 13 && /^\d+$/.test(bookId)) {
          result = await WR.getGoogleBookByISBN(bookId);
        }
        if (!result) {
          const res  = await fetch(`https://www.googleapis.com/books/v1/volumes/${bookId}?key=AIzaSyCdPs_QjB6XKHcx3Q18WQcqQezDn8hYVCo`);
          const data = await res.json();
          if (data.id) result = WR.normalizeGoogleBook(data);
        }
        return result || null;
      } catch (e) {
        console.error("API fetch error:", e);
        return null;
      }
    }

    async function loadUserBook(bookId) {
      userBook = await WR.getUserBook(bookId);
    }

    async function loadUserClubs() {
      const user = WR.getCurrentUser();
      if (!user) return;
      try {
        const snap = await WR.getDb()
          .collection("clubs")
          .where("memberUids", "array-contains", user.uid)
          .get();
        userClubs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (e) {
        console.error("Error loading clubs:", e);
      }
    }

    async function loadReviews(bookId) {
      try {
        const snap = await WR.getDb()
          .collection("books").doc(bookId)
          .collection("reviews")
          .orderBy("createdAt", "desc")
          .limit(50)
          .get();
        allReviews = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (e) {
        console.error("Error loading reviews:", e);
      }
    }

    async function loadClubReviews(bookId) {
      if (!userClubs.length) return;
      const clubIds   = userClubs.map(c => c.id);
      clubReviews     = allReviews.filter(r => r.clubId && clubIds.includes(r.clubId));
    }

    // ── Render ────────────────────────────────────────────────

      // Details

        { label: "ISBN",      value: book.isbn13 || book.isbn10 || "—" },
        { label: "Published", value: book.publishedDate ? book.publishedDate.substring(0,4) : "—" },

        : "";

      const clubReviewCountHTML = clubReviews.length
        ? `<span class="section-count">${clubReviews.length}</span>`
        : "";

      content.innerHTML = `
        <!-- Hero -->
        <div class="book-hero">
          <div class="book-cover-col">
            ${coverHTML}
            ${placeholderHTML}
          </div>
          <div class="book-meta-col">
            ${clubBadgesHTML}
            <h1 class="book-title-large">${WR.escapeHTML(book.title || "Unknown Title")}</h1>
            <p class="book-author-large">by <a href="search.html?author=${encodeURIComponent(authors)}" style="color:inherit;text-decoration:none;border-bottom:1px dashed rgba(255,255,255,0.4);cursor:pointer;" title="Search for more books by ${WR.escapeHTML(authors)}">${WR.escapeHTML(authors)}</a></p>
            ${book.seriesInfo ? `<p style="font-size:13px;color:rgba(255,255,255,0.7);margin-top:4px;">📚 ${WR.escapeHTML(book.seriesInfo)}</p>` : ""}
            ${(() => {
              const genres = book.genres?.length ? book.genres : WR.normalizeGenres(book.categories || []);
              return genres.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">
                ${genres.map(g => `<span style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--lavender-mist);color:var(--amethyst);border:1px solid var(--border);letter-spacing:0.03em;">${WR.escapeHTML(g)}</span>`).join("")}

            ${ratingHTML}

            <div class="action-buttons">${actionsHTML}</div>

        <!-- Description -->
        ${book.description ? `
        <div class="content-section">
          <div class="section-toggle open" onclick="toggleSection('desc', this)">
            <span class="section-toggle-title">📝 About this book</span>
            <span class="section-arrow">▼</span>
          </div>
          <div class="section-body open" id="desc-body">
            <p class="description-text clamped" id="descText">${WR.escapeHTML(book.description)}</p>

        <!-- My Notes -->
        <div class="content-section">

            <span class="section-toggle-title">🗒️ My Notes & Rating</span>

          </div>
          <div class="section-body" id="notes-body">
            ${renderMyNotes()}

        </div>

        <!-- All Reviews -->
        <div class="content-section">
          <div class="section-toggle" onclick="toggleSection('reviews', this)">
            <span class="section-toggle-title">⭐ Reader Reviews ${reviewCountHTML}</span>

          </div>
          <div class="section-body" id="reviews-body">
            ${renderReviewsList(publicReviews)}
          </div>

        <div class="content-section">
          <div class="section-toggle" onclick="toggleSection('club-reviews', this)">

            <span class="section-arrow">▼</span>

    function buildActionButtons() {
      const bookId = book.bookId || book.isbn13 || book.id;
      let html = "";

      if (!userBook) {
        html += `<button class="action-btn btn-library" onclick="openQuickAdd('library')">📚 Add to Library</button>`;
        html += `<button class="action-btn btn-read"    onclick="openReadModal()">📖 Log Reading</button>`;
        html += `<button class="action-btn btn-tbr"     onclick="openQuickAdd('tbr')">🔖 To Be Read</button>`;
        html += `<button class="action-btn btn-wishlist" onclick="openQuickAdd('wishlist')">⭐ Add to Wishlist</button>`;
      } else {
        if (userBook.inLibrary) {
          html += `<button class="action-btn btn-view" onclick="location.href='library.html'">📚 In My Library</button>`;
          html += `<button class="action-btn btn-remove" onclick="removeFromLibrary()">🗑 Remove from Library</button>`;
        } else {
          html += `<button class="action-btn btn-library" onclick="openQuickAdd('library')">📚 Add to Library</button>`;
        }

        if (userBook.readingSessions?.length > 0) {
          html += `<button class="action-btn btn-read" onclick="openReadModal()">📖 Update Reading</button>`;
          html += `<button class="action-btn btn-remove" onclick="removeFromReadList()">✕ Remove from Read List</button>`;
        } else {
          html += `<button class="action-btn btn-read" onclick="openReadModal()">📖 Log Reading</button>`;
        }

        if (userBook.onTBR) {
          html += `<button class="action-btn btn-greyed" disabled>🔖 On TBR List</button>`;
        } else {
          html += `<button class="action-btn btn-tbr" onclick="openQuickAdd('tbr')">🔖 To Be Read</button>`;
        }

        if (userBook.onWishlist) {
          html += `<button class="action-btn btn-view" onclick="location.href='library.html?tab=wishlist'">⭐ View on Wishlist</button>`;
        } else {
          html += `<button class="action-btn btn-wishlist" onclick="openQuickAdd('wishlist')">⭐ Add to Wishlist</button>`;
        }
      }

      return html + `<button class="action-btn btn-refresh" onclick="refreshBookData()" id="refreshBtn" title="Pull fresh metadata from Google Books / Open Library">🔄 Refresh Book Data</button>`;
    }

    async function refreshBookData() {
      const btn    = document.getElementById("refreshBtn");
      const bookId = book.bookId || book.isbn13 || book.id;
      if (btn) { btn.textContent = "Refreshing..."; btn.disabled = true; }

      try {
        const fresh = await fetchFromAPI(bookId);
        if (!fresh) {
          WR.showToast("Couldn't find updated data for this book.", "error");
          return;
        }

        // Save fresh metadata to the global books collection
        await WR.saveBookToDb(fresh);

        // Merge into current book object (keep user-specific fields)
        book = {
          ...book,
          title:         fresh.title         || book.title,
          authors:       fresh.authors        || book.authors,
          description:   fresh.description    || book.description,
          coverURL:      fresh.coverURL        || book.coverURL,
          categories:    fresh.categories     || book.categories,
          seriesInfo:    fresh.seriesInfo      ?? book.seriesInfo,
          pageCount:     fresh.pageCount       || book.pageCount,
          publisher:     fresh.publisher       || book.publisher,
          publishedDate: fresh.publishedDate   || book.publishedDate
        };

        // Re-render the page with fresh data
        renderPage();
        WR.showToast("Book data refreshed! ✓", "success");
      } catch (e) {
        console.error("Refresh error:", e);
        WR.showToast("Error refreshing book data.", "error");
      } finally {
        if (btn) { btn.textContent = "🔄 Refresh Book Data"; btn.disabled = false; }
      }
    }

    function renderMyNotes() {
      const bookId = book.bookId || book.isbn13 || book.id;
      if (!userBook?.onReadList && !userBook?.inLibrary) {
        return `<p class="my-notes-prompt">
          Add this book to your <a href="#" onclick="openQuickAdd('library');return false;">library</a>
          or <a href="#" onclick="openQuickAdd('read');return false;">read list</a> to leave a personal note and rating.
        </p>`;
      }

      const session        = userBook?.readingSessions?.[0];
      const existingRating = session?.rating || 0;
      const existingReview = session?.review || "";
      myRating = existingRating;

      // If a review already exists, show the saved state
      if (existingRating || existingReview) {
        return renderSavedReview(existingReview, existingRating, session?.reviewPublished || false);
      }

      // No review yet — show the write form
      return `
        <div class="write-review-section" style="margin-top:1rem;">
          <p class="write-review-title">Your Rating & Review</p>
          <div class="star-picker-row">
            <span class="star-pick-label">Rating:</span>
            ${WR.renderStarPicker("myStarPicker", existingRating, (val) => { myRating = val; })}
          </div>
          <textarea class="review-textarea" id="myReviewText" rows="4"
                    placeholder="Share your thoughts about this book...">${WR.escapeHTML(existingReview)}</textarea>
          <div class="review-submit-row">
            <label class="publish-toggle">
              <input type="checkbox" id="publishReview" ${session?.reviewPublished ? "checked" : ""}>
              Share publicly on this book's page
            </label>
            <button class="submit-review-btn" onclick="saveMyReview()">Save Review</button>
          </div>
        </div>
      `;
    }

    function renderReviewsList(reviews) {
      if (!reviews.length) {
        return `<p class="no-reviews">No reviews yet. Be the first to share your thoughts!</p>`;
      }

      return reviews.map(r => {
        const stars  = r.rating ? "★".repeat(r.rating) + "☆".repeat(5 - r.rating) : "";
        const date   = WR.formatRelativeTime(r.createdAt);
        const photo  = r.photoURL
          ? `<img class="reviewer-photo" src="${WR.escapeHTML(r.photoURL)}" alt="${WR.escapeHTML(r.displayName || "")}">`
          : `<div class="reviewer-placeholder">👤</div>`;
        const clubTag = r.clubName
          ? `<span class="review-club-tag">📖 ${WR.escapeHTML(r.clubName)}</span>`
          : "";

        return `
          <div class="review-card">
            <div class="review-header">
              ${photo}
              <a class="reviewer-name" href="profile.html?uid=${WR.escapeHTML(r.uid || "")}">
                ${WR.escapeHTML(r.displayName || "Anonymous")}
              </a>
              <span class="review-date">${date}</span>
            </div>
            ${stars ? `<div class="review-stars">${stars}</div>` : ""}
            <p class="review-text">${WR.escapeHTML(r.review || "")}</p>
            ${clubTag}
          </div>`;
      }).join("");
    }

    // ── Toggle Sections ───────────────────────────────────────
    function toggleSection(id, toggle) {
      const body = document.getElementById(id + "-body");
      if (!body) return;
      const isOpen = body.classList.contains("open");
      toggle.classList.toggle("open", !isOpen);
      body.classList.toggle("open", !isOpen);
      // Always init star picker when notes section is opened
      if (id === "notes" && !isOpen) {
        setTimeout(() => WR.initStarPicker("myStarPicker"), 50);
      }
    }

    function toggleDesc() {
      const text = document.getElementById("descText");
      const btn  = document.getElementById("readMoreBtn");
      descExpanded = !descExpanded;
      text.classList.toggle("clamped", !descExpanded);
      btn.textContent = descExpanded ? "← Show less" : "Read more →";
    }

    // ── Quick Add ─────────────────────────────────────────────
    async function openQuickAdd(type) {
      const bookId = book.bookId || book.isbn13 || book.id;

      // Merge with existing flags so adding to read list
      // doesn't remove the book from library, and vice versa
      const existing = {
        inLibrary:  userBook?.inLibrary  || false,
        onReadList: userBook?.onReadList || false,
        onTBR:      userBook?.onTBR      || false,
        onWishlist: userBook?.onWishlist || false
      };

      const flags = {
        ...existing,
        inLibrary:           type === "library"  ? true : existing.inLibrary,
        onReadList:          type === "read"      ? true : existing.onReadList,
        onTBR:               type === "tbr"       ? true : existing.onTBR,
        onWishlist:          type === "wishlist"  ? true : existing.onWishlist,
        tbrNeedsAcquisition: type === "tbr" && !existing.inLibrary
      };

      try {
        await WR.addBookToUserCollection(book, flags);
        userBook = await WR.getUserBook(bookId);

        const labels = {
          library: "Added to your library! 📚",
          read:    "Added to your read list! ✅",
          tbr:     "Added to your TBR list! 🔖",
          wishlist:"Added to your wishlist! ⭐"
        };

        WR.showToast(labels[type] || "Added!", "success");

        // Re-render action buttons
        document.querySelector(".action-buttons").innerHTML = buildActionButtons();
        // Re-render my notes section
        const notesBody = document.getElementById("notes-body");
        if (notesBody && notesBody.classList.contains("open")) {
          notesBody.innerHTML = renderMyNotes();
          WR.initStarPicker("myStarPicker");
        }

      } catch (e) {
        console.error("Quick add error:", e);
        WR.showToast("Something went wrong. Please try again.", "error");
      }
    }

    // ── Remove From Library ───────────────────────────────────
    async function removeFromReadList() {
      if (!confirm("Remove this book from your reading log? This will delete your reading sessions and review for this book.")) return;
      const user   = WR.getCurrentUser();
      const bookId = book.bookId || book.isbn13 || book.id;
      try {
        await WR.getDb()
          .collection("users").doc(user.uid)
          .collection("books").doc(bookId)
          .set({
            readingSessions: [],
            onReadList:      false,
            updatedAt:       firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });

        if (userBook) {
          userBook.readingSessions = [];
          userBook.onReadList      = false;
        }

        // Re-render the page sections that changed
        document.querySelector(".action-buttons").innerHTML = buildActionButtons();
        document.getElementById("my-notes-section").innerHTML = renderMyNotes();
        WR.showToast("Removed from reading log.", "success");
      } catch (e) {
        console.error("Remove from read list error:", e);
        WR.showToast("Something went wrong.", "error");
      }
    }

    async function removeFromLibrary() {
      if (!confirm("Remove this book from your library? Your reading history and reviews will be kept.")) return;
      const user   = WR.getCurrentUser();
      const bookId = book.bookId || book.isbn13 || book.id;
      try {
        await WR.getDb()
          .collection("users").doc(user.uid)
          .collection("books").doc(bookId)
          .set({ inLibrary: false, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        if (userBook) userBook.inLibrary = false;
        document.querySelector(".action-buttons").innerHTML = buildActionButtons();
        renderLendingSection();
        WR.showToast("Removed from library.", "success");
      } catch (e) {
        console.error("Remove from library error:", e);
        WR.showToast("Something went wrong.", "error");
      }
    }

    // ── Reading Details Modal ─────────────────────────────────
    let selectedFormat = "read";

    function onEndDateInput() {
      // If user enters an end date, uncheck the no-date option
      if (document.getElementById("rmEndDate").value) {
        document.getElementById("rmNoDate").checked = false;
      }
    }

    function onNoDateChange() {
      // If user checks no-date, clear the end date field
      if (document.getElementById("rmNoDate").checked) {
        document.getElementById("rmEndDate").value = "";
      }
    }

    function openReadModal() {
      const session = userBook?.readingSessions?.[0];
      selectedFormat = session?.format || "read";
      document.getElementById("rmStartDate").value  = session?.startDate || "";
      document.getElementById("rmEndDate").value    = session?.endDate   || "";
      document.getElementById("rmDNF").checked      = session?.dnf       || false;
      document.getElementById("rmNoDate").checked   = session?.completedWithoutDate || false;
      selectFormat(selectedFormat);
      const modal = document.getElementById("readModal");
      // Update modal title based on whether this is an update
      const titleEl = modal.querySelector("h2");
      const descEl  = modal.querySelector("p");
      if (titleEl) titleEl.textContent = session ? "📖 Update Reading" : "📖 Log Reading";
      if (descEl)  descEl.textContent  = session ? "Update your reading details for this book." : "Record how and when you read this book.";
      modal.style.display = "flex";
      document.body.style.overflow = "hidden";
    }

    function closeReadModal() {
      document.getElementById("readModal").style.display = "none";
      document.body.style.overflow = "";
    }

    function selectFormat(fmt) {
      selectedFormat = fmt;
      const readBtn     = document.getElementById("fmtRead");
      const listenedBtn = document.getElementById("fmtListened");
      if (fmt === "read") {
        readBtn.style.background     = "var(--amethyst)";
        readBtn.style.color          = "#FAF6EE";
        readBtn.style.borderColor    = "var(--amethyst)";
        listenedBtn.style.background = "#fff";
        listenedBtn.style.color      = "var(--deep-plum)";
        listenedBtn.style.borderColor = "var(--border)";
      } else {
        listenedBtn.style.background  = "var(--amethyst)";
        listenedBtn.style.color       = "#FAF6EE";
        listenedBtn.style.borderColor = "var(--amethyst)";
        readBtn.style.background      = "#fff";
        readBtn.style.color           = "var(--deep-plum)";
        readBtn.style.borderColor     = "var(--border)";
      }
    }

    async function confirmMarkRead() {
      const user      = WR.getCurrentUser();
      const bookId    = book.bookId || book.isbn13 || book.id;
      const startDate          = document.getElementById("rmStartDate").value || null;
      const endDate            = document.getElementById("rmEndDate").value   || null;
      const dnf                = document.getElementById("rmDNF").checked;
      const completedNoDate    = document.getElementById("rmNoDate").checked && !endDate && !dnf;
      const completed          = (!!endDate || completedNoDate) && !dnf;

      try {
        const existing = {
          inLibrary:  userBook?.inLibrary  || false,
          onReadList: true,
          onTBR:      userBook?.onTBR      || false,
          onWishlist: userBook?.onWishlist || false
        };
        await WR.addBookToUserCollection(book, existing);

        const ref  = WR.getDb().collection("users").doc(user.uid).collection("books").doc(bookId);
        const snap = await ref.get();
        let sessions = snap.exists ? (snap.data().readingSessions || []) : [];

        if (sessions.length > 0) {
          // Update the most recent session
          sessions[0] = {
            ...sessions[0],
            startDate: startDate || sessions[0].startDate || null,
            endDate:              endDate   || null,
            completed:            completed,
            completedWithoutDate: completedNoDate,
            dnf,
            format:    selectedFormat
          };
          await ref.update({ readingSessions: sessions, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        } else {
          // Create a new session
          const session = {
            sessionId:       WR.generateId(),
            startDate:       startDate || null,
            endDate:              endDate   || null,
            completed:            completed,
            completedWithoutDate: completedNoDate,
            dnf,
            format:          selectedFormat,
            review:          null,
            rating:          null,
            reviewPublished: false
          };
          await ref.update({ readingSessions: firebase.firestore.FieldValue.arrayUnion(session), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
          sessions = [session];
        }

        userBook = await WR.getUserBook(bookId);
        closeReadModal();
        const msg = completed ? "Reading logged! ✅" : endDate ? "Reading logged! ✅" : "Started reading! 📖";
        WR.showToast(msg, "success");

        // Check for newly earned badges after logging a completed read
        if (completed && !dnf) {
          setTimeout(() => WR.checkBadges().then(() => WR.showBadgePopupIfNeeded()), 500);
        }
        document.querySelector(".action-buttons").innerHTML = buildActionButtons();

        // Always re-render notes section so review form appears with fresh data
        const notesBody = document.getElementById("notes-body");
        if (notesBody) {
          notesBody.innerHTML = renderMyNotes();
          WR.initStarPicker("myStarPicker");
        }
        renderLendingSection();
      } catch (e) {
        console.error("Mark as read error:", e);
        WR.showToast("Something went wrong.", "error");
      }
    }

    // ── Lending Modal ─────────────────────────────────────────
    function openLendModal() {
      document.getElementById("lmBorrower").value = "";
      document.getElementById("lmDate").value     = new Date().toISOString().split("T")[0];
      const modal = document.getElementById("lendModal");
      modal.style.display = "flex";
      document.body.style.overflow = "hidden";
      setTimeout(() => document.getElementById("lmBorrower").focus(), 100);
    }

    function closeLendModal() {
      document.getElementById("lendModal").style.display = "none";
      document.body.style.overflow = "";
    }

    async function confirmLend() {
      const user     = WR.getCurrentUser();
      const bookId   = book.bookId || book.isbn13 || book.id;
      const borrower = document.getElementById("lmBorrower").value.trim();
      const lentDate = document.getElementById("lmDate").value || null;

      if (!borrower) {
        WR.showToast("Please enter the borrower's name.", "error");
        return;
      }

      const lend = { lendId: WR.generateId(), borrowerUid: null, borrowerName: borrower, lentDate: lentDate || null, returnedDate: null, currentlyLent: true };

      try {
        await WR.getDb()
          .collection("users").doc(user.uid)
          .collection("books").doc(bookId)
          .update({ lendingHistory: firebase.firestore.FieldValue.arrayUnion(lend), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });

        if (!userBook) userBook = { id: bookId };
        if (!userBook.lendingHistory) userBook.lendingHistory = [];
        userBook.lendingHistory.push(lend);

        closeLendModal();
        WR.showToast(`Lent to ${borrower}! 📖`, "success");
        renderLendingSection();
      } catch (e) {
        console.error("Lend error:", e);
        WR.showToast("Something went wrong.", "error");
      }
    }

    async function markReturned(lendId) {
      const user   = WR.getCurrentUser();
      const bookId = book.bookId || book.isbn13 || book.id;
      try {
        const snap = await WR.getDb()
          .collection("users").doc(user.uid)
          .collection("books").doc(bookId).get();
        if (!snap.exists) return;
        const history = (snap.data().lendingHistory || []).map(l =>
          l.lendId === lendId ? { ...l, currentlyLent: false, returnedDate: new Date().toISOString().split("T")[0] } : l
        );
        await WR.getDb()
          .collection("users").doc(user.uid)
          .collection("books").doc(bookId)
          .update({ lendingHistory: history });
        if (userBook) userBook.lendingHistory = history;
        WR.showToast("Marked as returned!", "success");
        renderLendingSection();
      } catch (e) {
        console.error("Return error:", e);
        WR.showToast("Something went wrong.", "error");
      }
    }

    function renderLendingSection() {
      const el = document.getElementById("lending-section");
      if (!el || !userBook?.inLibrary) return;
      const lentItems    = (userBook?.lendingHistory || []).filter(l => l.currentlyLent);
      const returnedItems = (userBook?.lendingHistory || []).filter(l => !l.currentlyLent);
      el.innerHTML = `
        <div style="background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-top:1.25rem;">
          <div style="padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
            <h2 style="font-family:'Playfair Display',serif;font-size:17px;color:var(--deep-plum);">📖 Lending</h2>
            <button onclick="openLendModal()" style="font-family:'Nunito Sans',sans-serif;font-size:13px;font-weight:600;padding:7px 14px;border-radius:7px;border:none;background:var(--amethyst);color:#FAF6EE;cursor:pointer;">+ Lend Out</button>
          </div>
          <div style="padding:1rem 1.25rem;">
            ${lentItems.length ? lentItems.map(l => `
              <div style="display:flex;align-items:center;justify-content:space-between;background:var(--lavender-mist);border-radius:8px;padding:10px 12px;margin-bottom:8px;">
                <div>
                  <div style="font-size:14px;font-weight:600;color:var(--deep-plum);">${WR.escapeHTML(l.borrowerName || "")}</div>
                  <div style="font-size:12px;color:var(--terracotta);">${l.lentDate ? "Lent " + WR.formatDateInput(l.lentDate) : "Lent recently"}</div>
                </div>
                <button onclick="markReturned('${l.lendId}')" style="font-family:'Nunito Sans',sans-serif;font-size:12px;font-weight:600;padding:6px 12px;border-radius:6px;border:none;background:var(--faded-moss);color:#1A3D2E;cursor:pointer;">✓ Returned</button>
              </div>`).join("") : `<p style="font-size:13px;color:var(--terracotta);">Not currently lent out.</p>`}
            ${returnedItems.length ? `
              <p style="font-size:11px;font-weight:600;color:#BDB5CC;text-transform:uppercase;letter-spacing:0.06em;margin-top:12px;margin-bottom:6px;">History</p>
              ${returnedItems.map(l => `
                <div style="display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#BDB5CC;padding:4px 0;border-bottom:1px solid var(--border);">
                  <span>${WR.escapeHTML(l.borrowerName || "")}</span>
                  <span>${l.lentDate || "?"} → ${l.returnedDate || "?"}</span>
                </div>`).join("")}` : ""}
          </div>
        </div>`;
    }
    async function saveMyReview() {
      const user    = WR.getCurrentUser();
      const bookId  = book.bookId || book.isbn13 || book.id;
      const text    = document.getElementById("myReviewText")?.value.trim() || "";
      const publish = document.getElementById("publishReview")?.checked || false;

      if (!myRating && !text) {
        WR.showToast("Add a rating or review before saving.", "error");
        return;
      }

      // Disable save button while saving
      const saveBtn = document.querySelector(".submit-review-btn");
      if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = "Saving..."; }

      try {
        const db = WR.getDb();

        // Update reading session in user's book doc
        const userBookRef = db.collection("users").doc(user.uid).collection("books").doc(bookId);
        const snap        = await userBookRef.get();

        // Create a session if none exists
        let sessions = [];
        if (snap.exists) {
          sessions = snap.data().readingSessions || [];
        }
        if (sessions.length === 0) {
          sessions = [{ sessionId: WR.generateId(), startDate: null, endDate: null,
            completed: false, dnf: false, format: "read" }];
        }
        sessions[0].rating          = myRating || null;
        sessions[0].review          = text || null;
        sessions[0].reviewPublished = publish;

        await userBookRef.set(
          { readingSessions: sessions, updatedAt: firebase.firestore.FieldValue.serverTimestamp() },
          { merge: true }
        );

        // Write / update public review if published
        if (publish && (myRating || text)) {
          const profile = WR.getCurrentUser()._profile;
          await db.collection("books").doc(bookId)
            .collection("reviews").doc(user.uid)
            .set({
              uid:         user.uid,
              displayName: profile?.displayName || "Anonymous",
              photoURL:    profile?.photoURL    || null,
              rating:      myRating || null,
              review:      text || null,
              clubId:      null,
              clubName:    null,
              reviewPublished: true,
              createdAt:   firebase.firestore.FieldValue.serverTimestamp(),
              updatedAt:   firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

          // Recompute aggregate rating
          await updateAggregateRating(bookId);
          await loadReviews(bookId);
          const publicReviews = allReviews.filter(r => !r.clubId || r.reviewPublished !== false);
          const reviewsBody   = document.getElementById("reviews-body");
          if (reviewsBody) reviewsBody.innerHTML = renderReviewsList(publicReviews);
        }

        // Update local userBook so re-render reflects saved state
        if (!userBook) userBook = { id: bookId };
        if (!userBook.readingSessions) userBook.readingSessions = [{}];
        userBook.readingSessions[0] = {
          ...userBook.readingSessions[0],
          rating: myRating || null,
          review: text || null,
          reviewPublished: publish
        };

        // Re-render notes section to show saved state
        const notesBody = document.getElementById("notes-body");
        if (notesBody) {
          notesBody.innerHTML = renderSavedReview(text, myRating, publish);
        }

        WR.showToast("Review saved! 📖", "success");
        setTimeout(() => WR.checkBadges().then(() => WR.showBadgePopupIfNeeded()), 500);

      } catch (e) {
        console.error("Save review error:", e);
        WR.showToast("Something went wrong saving your review.", "error");
        if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = "Save Review"; }
      }
    }

    // ── Saved Review State ────────────────────────────────────
    function renderSavedReview(text, rating, published) {
      const stars = rating
        ? "★".repeat(rating) + "☆".repeat(5 - rating)
        : "";
      return `
        <div class="write-review-section" style="margin-top:1rem;background:#DCF0E8;border-radius:10px;padding:1rem;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;">
            <p style="font-size:14px;font-weight:600;color:#2E6B50;">✅ Review saved</p>
            <button class="submit-review-btn" style="background:var(--amethyst);font-size:12px;padding:6px 14px;"
                    onclick="editMyReview()">Edit Review</button>
          </div>
          ${stars ? `<div style="font-size:20px;color:var(--warm-gold);margin-bottom:0.5rem;">${stars}</div>` : ""}
          ${text ? `<p style="font-size:14px;color:var(--deep-plum);line-height:1.6;font-style:italic;">"${WR.escapeHTML(text)}"</p>` : ""}
          <p style="font-size:11px;color:#4A8A62;margin-top:8px;">
            ${published ? "🌐 Shared publicly on this book's page" : "🔒 Private — only visible to you"}
          </p>
        </div>`;
    }

    function editMyReview() {
      const notesBody = document.getElementById("notes-body");
      if (notesBody) {
        notesBody.innerHTML = renderMyNotes();
        WR.initStarPicker("myStarPicker");
      }
    }

    async function updateAggregateRating(bookId) {
      try {
        const snap = await WR.getDb()
          .collection("books").doc(bookId)
          .collection("reviews")
          .where("rating", ">", 0)
          .get();
        const ratings = snap.docs.map(d => d.data().rating).filter(Boolean);
        if (!ratings.length) return;
        const avg = ratings.reduce((a, b) => a + b, 0) / ratings.length;
        await WR.getDb().collection("books").doc(bookId).update({
          averageRating: Math.round(avg * 10) / 10,
          ratingsCount:  ratings.length
        });
      } catch (e) {
        console.error("Rating update error:", e);
      }
    }

    // ── Not Found ─────────────────────────────────────────────
    function showNotFound() {
      document.getElementById("bookContent").innerHTML = `
        <div class="not-found">
          <span class="not-found-icon">📭</span>
          <h2 class="not-found-title">Book not found</h2>
          <p class="not-found-desc">We couldn't find that book in our database or the Google Books catalog.</p>
          <button class="action-btn btn-library" onclick="location.href='search.html'">🔍 Search for a Book</button>
        </div>`;
    }

    // ── Expose for HTML handlers ──────────────────────────────
    window.toggleSection   = toggleSection;
    window.toggleDesc      = toggleDesc;
    window.openQuickAdd    = openQuickAdd;
    window.saveMyReview    = saveMyReview;
    window.editMyReview    = editMyReview;
    window.onEndDateInput     = onEndDateInput;
    window.onNoDateChange     = onNoDateChange;
    window.removeFromReadList = removeFromReadList;
    window.refreshBookData    = refreshBookData;
    window.removeFromLibrary  = removeFromLibrary;
    window.openReadModal   = openReadModal;
    window.closeReadModal = closeReadModal;
    window.selectFormat   = selectFormat;
    window.confirmMarkRead = confirmMarkRead;
    window.openLendModal  = openLendModal;
    window.closeLendModal = closeLendModal;
    window.confirmLend    = confirmLend;
    window.markReturned   = markReturned;
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>

</body>
