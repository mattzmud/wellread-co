<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WellRead Co. — My Library</title>
  <meta name="theme-color" content="#2D1B4E">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon-96x96.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --lavender-mist: #F7F3FF;
      --aged-paper:    #FAF6EE;
      --deep-plum:     #2D1B4E;
      --amethyst:      #7B5EA7;
      --faded-moss:    #9DC4B0;
      --warm-gold:     #C9A84C;
      --terracotta:    #A0674A;
      --border:        #E8DFC8;
    }
    html, body { min-height: 100%; font-family: 'Nunito Sans', sans-serif; background: var(--lavender-mist); color: var(--deep-plum); }

    .page-wrap { max-width: 1000px; margin: 0 auto; padding: 2rem 1.25rem 6rem; }

    /* ── Header ── */
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .page-title  { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; color: var(--deep-plum); margin-bottom: 0.25rem; }
    .page-subtitle { font-size: 14px; color: var(--terracotta); }
    .header-btn {
      font-family: 'Nunito Sans', sans-serif; font-size: 14px; font-weight: 600;
      padding: 10px 18px; border-radius: 8px; border: none;
      background: var(--amethyst); color: #FAF6EE; cursor: pointer;
      white-space: nowrap; transition: opacity 0.15s; text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .header-btn:hover { opacity: 0.85; }

    /* ── Tab Bar ── */
    .tab-bar {
      display: flex;
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 5px;
      gap: 4px;
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 8px;
      border: none;
      border-radius: 8px;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--terracotta);
      background: none;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .tab-btn:hover { background: var(--lavender-mist); color: var(--amethyst); }
    .tab-btn.active { background: var(--amethyst); color: #FAF6EE; }
    .tab-count {
      font-size: 10px;
      font-weight: 700;
      background: rgba(255,255,255,0.25);
      padding: 1px 6px;
      border-radius: 10px;
    }
    .tab-btn:not(.active) .tab-count {
      background: var(--lavender-mist);
      color: var(--amethyst);
    }

    /* ── Stats Bar ── */
    .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 1.25rem; }
    .stat-card { background: #fff; border-radius: 12px; border: 1px solid var(--border); padding: 0.875rem; text-align: center; }
    .stat-num   { font-family: 'Playfair Display', serif; font-size: 26px; color: var(--amethyst); display: block; }
    .stat-label { font-size: 11px; color: var(--terracotta); margin-top: 2px; }

    /* ── Controls ── */
    .controls-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .sort-select {
      font-family: 'Nunito Sans', sans-serif; font-size: 13px; font-weight: 600;
      padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px;
      background: #fff; color: var(--deep-plum); cursor: pointer; outline: none;
    }
    .sort-select:focus { border-color: var(--amethyst); }
    .view-toggle { display: flex; gap: 4px; }
    .view-btn {
      padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px;
      background: #fff; font-size: 16px; cursor: pointer; transition: all 0.15s; color: var(--terracotta);
    }
    .view-btn.active { background: var(--amethyst); border-color: var(--amethyst); color: #FAF6EE; }

    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
    .filter-pill {
      padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border);
      background: #fff; font-family: 'Nunito Sans', sans-serif;
      font-size: 12px; font-weight: 600; color: var(--terracotta); cursor: pointer; transition: all 0.15s;
    }
    .filter-pill:hover  { border-color: var(--amethyst); color: var(--amethyst); }
    .filter-pill.active { background: var(--amethyst); border-color: var(--amethyst); color: #FAF6EE; }

    /* ── Lending Panel ── */
    .lending-panel { background: #fff; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 1.25rem; overflow: hidden; }
    .lending-toggle { display: flex; align-items: center; justify-content: space-between; padding: 0.875rem 1.25rem; cursor: pointer; user-select: none; transition: background 0.15s; }
    .lending-toggle:hover { background: var(--lavender-mist); }
    .lending-toggle-title { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--deep-plum); display: flex; align-items: center; gap: 8px; }
    .lending-count { font-size: 11px; font-weight: 600; background: var(--lavender-mist); color: var(--amethyst); padding: 2px 8px; border-radius: 10px; }
    .lending-arrow { font-size: 12px; color: var(--terracotta); transition: transform 0.2s; }
    .lending-toggle.open .lending-arrow { transform: rotate(180deg); }
    .lending-body { display: none; padding: 0 1.25rem 1.25rem; border-top: 1px solid var(--border); }
    .lending-body.open { display: block; }
    .lending-tabs { display: flex; gap: 8px; padding: 0.75rem 0 0.5rem; }
    .lending-tab { font-family: 'Nunito Sans', sans-serif; font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: #fff; color: var(--terracotta); cursor: pointer; transition: all 0.15s; }
    .lending-tab.active { background: var(--amethyst); border-color: var(--amethyst); color: #FAF6EE; }
    .lending-item { display: flex; align-items: center; gap: 12px; padding: 0.75rem; border-radius: 10px; background: var(--lavender-mist); margin-bottom: 8px; }
    .lending-item-icon { font-size: 20px; flex-shrink: 0; }
    .lending-item-info { flex: 1; min-width: 0; }
    .lending-item-title { font-size: 14px; font-weight: 600; color: var(--deep-plum); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lending-item-meta  { font-size: 12px; color: var(--terracotta); margin-top: 1px; }
    .lending-empty { text-align: center; padding: 1rem; font-size: 13px; color: var(--terracotta); }
    .lend-out { color: var(--warm-gold); font-weight: 600; font-size: 12px; }

    /* ── Grid View ── */
    .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 20px; }
    .grid-book-item { cursor: pointer; text-align: center; transition: transform 0.15s; }
    .grid-book-item:hover { transform: translateY(-3px); }
    .grid-cover-img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 6px; box-shadow: 2px 4px 12px rgba(45,27,78,0.18); display: block; margin-bottom: 8px; }
    .grid-cover-placeholder { width: 100%; aspect-ratio: 2/3; border-radius: 6px; background: linear-gradient(135deg, var(--amethyst), #4A2D7A); display: flex; align-items: center; justify-content: center; font-size: 36px; box-shadow: 2px 4px 12px rgba(45,27,78,0.18); margin-bottom: 8px; }
    .grid-book-title  { font-size: 12px; font-weight: 600; color: var(--deep-plum); margin-bottom: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
    .grid-book-author { font-size: 11px; color: var(--terracotta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── List View / Read List Cards ── */
    .books-list { display: flex; flex-direction: column; gap: 12px; }
    .book-card { background: #fff; border-radius: 14px; border: 1px solid var(--border); overflow: hidden; transition: box-shadow 0.15s; }
    .book-card:hover { box-shadow: 0 4px 16px rgba(45,27,78,0.08); }
    .card-main { display: flex; gap: 14px; padding: 1rem; align-items: flex-start; cursor: pointer; }
    .book-cover-img { width: 60px; height: 86px; object-fit: cover; border-radius: 5px; box-shadow: 1px 2px 8px rgba(45,27,78,0.14); flex-shrink: 0; display: block; }
    .book-cover-placeholder { width: 60px; height: 86px; border-radius: 5px; background: linear-gradient(135deg, var(--amethyst), #4A2D7A); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
    .card-info { flex: 1; min-width: 0; }
    .card-title  { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--deep-plum); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-author { font-size: 13px; color: var(--terracotta); margin-bottom: 5px; }
    .card-meta   { font-size: 12px; color: #BDB5CC; margin-bottom: 6px; }
    .card-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .status-badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
    .badge-read    { background: #DCF0E8; color: #2E6B50; }
    .badge-reading { background: #EDE4F7; color: #5B3E8A; }
    .badge-lent    { background: #FEF3CD; color: #8B6914; }
    .badge-dnf     { background: #FCE8E8; color: #8B2020; }
    .badge-listened { background: #FEF3CD; color: #8B6914; }
    .card-stars { font-size: 14px; color: var(--warm-gold); margin-bottom: 6px; }
    .card-actions { display: flex; gap: 8px; }
    .card-btn { font-family: 'Nunito Sans', sans-serif; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; transition: opacity 0.15s; }
    .card-btn:hover { opacity: 0.8; }
    .card-btn-expand { background: var(--lavender-mist); color: var(--amethyst); }
    .card-btn-view   { background: var(--aged-paper); color: var(--terracotta); border: 1px solid var(--border); }
    .card-review-section { border-top: 1px solid var(--border); padding: 1rem; display: none; background: var(--lavender-mist); }
    .card-review-section.open { display: block; }
    .review-text { font-size: 13px; line-height: 1.7; color: var(--deep-plum); font-style: italic; }
    .no-review-text { font-size: 13px; color: #BDB5CC; }

    /* ── TBR Drag and Drop ── */
    .tbr-drag-handle {
      cursor: grab;
      color: #BDB5CC;
      font-size: 18px;
      padding: 0 8px 0 4px;
      flex-shrink: 0;
      user-select: none;
      touch-action: none;
    }
    .tbr-drag-handle:active { cursor: grabbing; }
    .book-card.dragging {
      opacity: 0.4;
      border: 2px dashed var(--amethyst);
    }
    .book-card.drag-over {
      border-color: var(--amethyst);
      background: var(--lavender-mist);
      transform: scale(1.01);
    }
    .tbr-drag-note {
      font-size: 12px;
      color: #BDB5CC;
      text-align: center;
      padding: 6px 0 2px;
      margin-bottom: 8px;
    }

    /* ── TBR specific ── */
    .tbr-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    .tbr-btn { font-family: 'Nunito Sans', sans-serif; font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; white-space: nowrap; transition: opacity 0.15s; }
    .tbr-btn:hover { opacity: 0.8; }
    .tbr-btn-start  { background: var(--amethyst); color: #FAF6EE; }
    .tbr-btn-remove { background: var(--aged-paper); color: var(--terracotta); border: 1px solid var(--border); }
    .flag-badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
    .flag-acquire { background: #FEF3CD; color: #8B6914; }
    .flag-owned   { background: #DCF0E8; color: #2E6B50; }

    /* ── Wishlist specific ── */
    .visibility-banner { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 0.875rem 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .visibility-info { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--deep-plum); }
    .toggle-switch { position: relative; width: 44px; height: 24px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-track { position: absolute; inset: 0; background: var(--border); border-radius: 12px; transition: background 0.2s; cursor: pointer; }
    .toggle-track::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: transform 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
    .toggle-switch input:checked + .toggle-track { background: var(--amethyst); }
    .toggle-switch input:checked + .toggle-track::after { transform: translateX(20px); }
    .share-box { background: var(--lavender-mist); border: 1px solid #DDD6F3; border-radius: 10px; padding: 0.875rem 1.25rem; margin-bottom: 1.25rem; display: none; }
    .share-box.show { display: block; }
    .share-link-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
    .share-link-input { flex: 1; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-family: 'Nunito Sans', sans-serif; font-size: 13px; color: var(--deep-plum); background: #fff; outline: none; }
    .copy-btn { font-family: 'Nunito Sans', sans-serif; font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 8px; border: none; background: var(--amethyst); color: #FAF6EE; cursor: pointer; white-space: nowrap; transition: opacity 0.15s; }
    .copy-btn:hover { opacity: 0.85; }
    .wish-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    .wish-btn { font-family: 'Nunito Sans', sans-serif; font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; white-space: nowrap; transition: opacity 0.15s; }
    .wish-btn:hover { opacity: 0.8; }
    .wish-btn-add    { background: var(--amethyst); color: #FAF6EE; }
    .wish-btn-tbr    { background: var(--faded-moss); color: #1A3D2E; }
    .wish-btn-remove { background: var(--aged-paper); color: var(--terracotta); border: 1px solid var(--border); }

    /* ── Book Detail Modal ── */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(45,27,78,0.45); z-index: 500; align-items: flex-end; justify-content: center; }
    .modal-overlay.open { display: flex; }
    @media (min-width: 640px) { .modal-overlay { align-items: center; } }
    .book-modal { background: var(--aged-paper); border-radius: 20px 20px 0 0; padding: 1.5rem; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; box-shadow: 0 -4px 32px rgba(45,27,78,0.18); }
    @media (min-width: 640px) { .book-modal { border-radius: 20px; max-height: 85vh; } }
    .modal-drag { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 1.25rem; }
    @media (min-width: 640px) { .modal-drag { display: none; } }
    .modal-top { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 1.25rem; }
    .modal-cover { width: 70px; height: 100px; object-fit: cover; border-radius: 6px; flex-shrink: 0; box-shadow: 2px 4px 12px rgba(45,27,78,0.18); }
    .modal-cover-placeholder { width: 70px; height: 100px; border-radius: 6px; background: linear-gradient(135deg, var(--amethyst), #4A2D7A); display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
    .modal-title-area { flex: 1; min-width: 0; }
    .modal-book-title  { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--deep-plum); margin-bottom: 4px; line-height: 1.3; }
    .modal-book-author { font-size: 13px; color: var(--terracotta); margin-bottom: 8px; }
    .modal-close { background: none; border: none; font-size: 18px; color: var(--terracotta); cursor: pointer; padding: 4px 8px; border-radius: 6px; flex-shrink: 0; }
    .modal-close:hover { background: #EDE4F7; }
    .modal-section { margin-bottom: 1.25rem; }
    .modal-label { font-size: 11px; font-weight: 600; color: var(--terracotta); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    .modal-field-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .modal-field { flex: 1; min-width: 120px; }
    .modal-field label { display: block; font-size: 11px; font-weight: 600; color: var(--terracotta); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .modal-field input[type="date"], .modal-field input[type="text"], .modal-field select { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-family: 'Nunito Sans', sans-serif; font-size: 13px; color: var(--deep-plum); background: #fff; outline: none; transition: border-color 0.2s; }
    .modal-field input:focus, .modal-field select:focus { border-color: var(--amethyst); }
    .modal-checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--deep-plum); cursor: pointer; padding: 6px 0; }
    .modal-checkbox-row input { width: 16px; height: 16px; accent-color: var(--amethyst); cursor: pointer; }
    .lend-history { background: var(--lavender-mist); border-radius: 8px; padding: 0.75rem; margin-top: 0.5rem; }
    .lend-history-title { font-size: 11px; font-weight: 600; color: var(--terracotta); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .lend-history-item { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--deep-plum); padding: 4px 0; border-bottom: 1px solid var(--border); }
    .lend-history-item:last-child { border-bottom: none; }
    .lend-returned { color: var(--faded-moss); font-weight: 600; }
    .modal-btn-row { display: flex; gap: 10px; justify-content: flex-end; padding-top: 0.5rem; border-top: 1px solid var(--border); }
    .modal-btn { font-family: 'Nunito Sans', sans-serif; font-size: 14px; font-weight: 600; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; transition: opacity 0.15s; }
    .modal-btn:hover { opacity: 0.85; }
    .modal-btn-cancel { background: var(--aged-paper); color: var(--terracotta); border: 1.5px solid var(--border); }
    .modal-btn-save   { background: var(--amethyst); color: #FAF6EE; }
    .modal-btn-view   { background: var(--faded-moss); color: #1A3D2E; }

    /* ── Empty State ── */
    .empty-state { text-align: center; padding: 3rem 2rem; }
    .empty-icon  { font-size: 52px; margin-bottom: 1rem; display: block; }
    .empty-title { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--deep-plum); margin-bottom: 0.5rem; }
    .empty-desc  { font-size: 14px; color: var(--terracotta); margin-bottom: 1.5rem; line-height: 1.6; }
    .empty-btn   { display: inline-flex; align-items: center; gap: 6px; font-family: 'Nunito Sans', sans-serif; font-size: 14px; font-weight: 600; padding: 11px 22px; background: var(--amethyst); color: #FAF6EE; border: none; border-radius: 8px; cursor: pointer; text-decoration: none; transition: opacity 0.15s; }
    .empty-btn:hover { opacity: 0.85; }

    /* ── Skeleton ── */
    .skeleton-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 20px; }
    .skeleton-book { display: flex; flex-direction: column; gap: 8px; }
    .skeleton-cover { aspect-ratio: 2/3; border-radius: 6px; background: linear-gradient(90deg,#ede8f5 25%,#e0d8ef 50%,#ede8f5 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
    .skeleton-line  { height: 10px; border-radius: 5px; background: linear-gradient(90deg,#ede8f5 25%,#e0d8ef 50%,#ede8f5 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    @media (max-width: 768px) {
      .page-header { flex-direction: column; }
      .books-grid  { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
      .tbr-actions, .wish-actions { flex-direction: row; }
      .tab-btn { font-size: 11px; padding: 8px 4px; }
    }
  </style>
</head>
<body>

  <div class="page-wrap">

    <!-- Header -->
    <div class="page-header">
      <div>
        <h1 class="page-title" id="pageTitle">📚 My Library</h1>
        <p class="page-subtitle" id="pageSubtitle">Loading...</p>
      </div>
      <a href="search.html" class="header-btn">+ Add a Book</a>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-library"  onclick="switchTab('library')">
        📚 Library <span class="tab-count" id="count-library">0</span>
      </button>
      <button class="tab-btn" id="tab-readlist" onclick="switchTab('readlist')">
        📖 Reading Log <span class="tab-count" id="count-readlist">0</span>
      </button>
      <button class="tab-btn" id="tab-tbr"      onclick="switchTab('tbr')">
        🔖 TBR <span class="tab-count" id="count-tbr">0</span>
      </button>
      <button class="tab-btn" id="tab-wishlist" onclick="switchTab('wishlist')">
        ⭐ Wishlist <span class="tab-count" id="count-wishlist">0</span>
      </button>
    </div>

    <!-- Dynamic content area -->
    <div id="contentArea">
      <div class="skeleton-grid">
        <div class="skeleton-book"><div class="skeleton-cover"></div><div class="skeleton-line" style="width:80%"></div><div class="skeleton-line" style="width:55%"></div></div>
        <div class="skeleton-book"><div class="skeleton-cover"></div><div class="skeleton-line" style="width:70%"></div><div class="skeleton-line" style="width:45%"></div></div>
        <div class="skeleton-book"><div class="skeleton-cover"></div><div class="skeleton-line" style="width:85%"></div><div class="skeleton-line" style="width:60%"></div></div>
        <div class="skeleton-book"><div class="skeleton-cover"></div><div class="skeleton-line" style="width:65%"></div><div class="skeleton-line" style="width:50%"></div></div>
        <div class="skeleton-book"><div class="skeleton-cover"></div><div class="skeleton-line" style="width:75%"></div><div class="skeleton-line" style="width:40%"></div></div>
        <div class="skeleton-book"><div class="skeleton-cover"></div><div class="skeleton-line" style="width:80%"></div><div class="skeleton-line" style="width:55%"></div></div>
      </div>
    </div>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <script src="common.js"></script>

  <script>
    // ── State ─────────────────────────────────────────────────
    let allBooks     = [];
    let tbrOrder     = []; // persisted order of TBR book IDs
    let activeTab    = "library";
    let currentView  = "grid";
    let activeFilter = "all";
    let lendTab      = "out";
    let openBookId   = null;
    let isPublic     = true;
    let shareBoxOpen = false;

    // ── Init ──────────────────────────────────────────────────
    WR.initAuth(async (user) => {
      if (!user) return;

      // Check URL param for initial tab
      const params = new URLSearchParams(location.search);
      const tab    = params.get("tab");
      if (["library","readlist","tbr","wishlist"].includes(tab)) {
        activeTab = tab;
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.getElementById("tab-" + tab).classList.add("active");
      }

      await loadAllBooks();
    });

    // ── Load All Books ────────────────────────────────────────
    async function loadAllBooks() {
      const user = WR.getCurrentUser();
      try {
        const snap = await WR.getDb()
          .collection("users").doc(user.uid)
          .collection("books").get();

        allBooks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        updateCounts();

        // Load user settings (wishlist visibility + TBR order) BEFORE rendering
        // so TBR order is available on first render
        try {
          const usnap = await WR.getDb().collection("users").doc(user.uid).get();
          if (usnap.exists) {
            isPublic = usnap.data().profileVisibility?.wishlist !== false;
            tbrOrder = usnap.data().tbrOrder || [];
          }
        } catch (e) {
          console.error("User settings load error:", e);
        }

        renderTab();
      } catch (e) {
        console.error("Error loading books:", e);
        WR.showToast("Error loading your books. Please refresh.", "error");
      }
    }

    function updateCounts() {
      const library  = allBooks.filter(b => b.inLibrary).length;
      const readlist = allBooks.filter(b => b.readingSessions?.length > 0).length;
      const tbr      = allBooks.filter(b => b.onTBR).length;
      const wishlist = allBooks.filter(b => b.onWishlist).length;
      document.getElementById("count-library").textContent  = library;
      document.getElementById("count-readlist").textContent = readlist;
      document.getElementById("count-tbr").textContent      = tbr;
      document.getElementById("count-wishlist").textContent = wishlist;
    }

    // ── Tab Switching ─────────────────────────────────────────
    function switchTab(tab) {
      activeTab    = tab;
      activeFilter = "all";
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("tab-" + tab).classList.add("active");
      renderTab();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderTab() {
      switch (activeTab) {
        case "library":  renderLibrary();  break;
        case "readlist": renderReadList(); break;
        case "tbr":      renderTBR();      break;
        case "wishlist": renderWishlist(); break;
      }
    }

    // ════════════════════════════════════════════════════════
    // ── LIBRARY TAB ─────────────────────────────────────────
    // ════════════════════════════════════════════════════════
    function renderLibrary() {
      const books = allBooks.filter(b => b.inLibrary);
      document.getElementById("pageTitle").textContent    = "📚 My Library";
      document.getElementById("pageSubtitle").textContent = `${books.length} book${books.length === 1 ? "" : "s"} in your collection`;

      const total   = books.length;
      const read    = books.filter(b => b.readingSessions?.some(s => s.completed)).length;
      const reading = books.filter(b => {
        const s = b.readingSessions?.[0];
        return s?.startDate && !s.completed && !s.dnf && !s.completedWithoutDate;
      }).length;
      const lent    = books.filter(b => b.lendingHistory?.some(l => l.currentlyLent)).length;

      const lentItems = [];
      books.forEach(book => {
        (book.lendingHistory || []).filter(l => l.currentlyLent).forEach(l => {
          lentItems.push({ book, lend: l });
        });
      });

      document.getElementById("contentArea").innerHTML = `
        <!-- Stats -->
        <div class="stats-bar" style="margin-bottom:1.25rem;">
          <div class="stat-card"><span class="stat-num">${total}</span><span class="stat-label">Total</span></div>
          <div class="stat-card"><span class="stat-num">${read}</span><span class="stat-label">Read</span></div>
          <div class="stat-card"><span class="stat-num">${reading}</span><span class="stat-label">Reading</span></div>
          <div class="stat-card"><span class="stat-num">${lent}</span><span class="stat-label">Lent Out</span></div>
        </div>

        <!-- Lending Panel -->
        <div class="lending-panel">
          <div class="lending-toggle" id="lendingToggle" onclick="toggleLending()">
            <span class="lending-toggle-title">📖 Lending Tracker <span class="lending-count">${lent}</span></span>
            <span class="lending-arrow" id="lendingArrow">▼</span>
          </div>
          <div class="lending-body" id="lendingBody">
            <div class="lending-tabs">
              <button class="lending-tab active" onclick="switchLendTab('out')">Lent Out</button>
              <button class="lending-tab" onclick="switchLendTab('borrowed')">Borrowing</button>
            </div>
            <div class="lending-list" id="lendingList">
              ${lentItems.length
                ? lentItems.map(({ book, lend }) => `
                    <div class="lending-item" onclick="location.href='book.html?id=${encodeURIComponent(book.id)}'" style="cursor:pointer;">
                      <span class="lending-item-icon">📖</span>
                      <div class="lending-item-info">
                        <div class="lending-item-title">${WR.escapeHTML(book.title || "")}</div>
                        <div class="lending-item-meta">Lent to <strong>${WR.escapeHTML(lend.borrowerName || "someone")}</strong>${lend.lentDate ? " on " + WR.formatDateInput(lend.lentDate) : ""}</div>
                      </div>
                      <span class="lend-out">Out</span>
                    </div>`).join("")
                : `<div class="lending-empty">No books currently lent out.</div>`}
            </div>
          </div>
        </div>

        <!-- Controls -->
        <div class="controls-bar">
          <select class="sort-select" id="sortSelect" onchange="applyLibrarySort()">
            <option value="addedAt-desc">Recently Added</option>
            <option value="title-asc">Title A–Z</option>
            <option value="title-desc">Title Z–A</option>
            <option value="author-asc">Author A–Z</option>
          </select>
          <div class="view-toggle">
            <button class="view-btn active" id="viewGrid" onclick="setView('grid')" title="Grid">▦</button>
            <button class="view-btn"        id="viewList" onclick="setView('list')" title="List">☰</button>
          </div>
        </div>

        <!-- Books -->
        <div id="libraryBooksArea">${renderLibraryBooks(books)}</div>
      `;
    }

    function renderLibraryBooks(books) {
      if (!books.length) return `
        <div class="empty-state">
          <span class="empty-icon">📚</span>
          <h2 class="empty-title">Your library is empty</h2>
          <p class="empty-desc">Start building your collection by searching for books you own.</p>
          <a href="search.html" class="empty-btn">🔍 Find a Book</a>
        </div>`;

      if (currentView === "grid") {
        return `<div class="books-grid">${books.map(b => buildGridCard(b)).join("")}</div>`;
      } else {
        return `<div class="books-list">${books.map(b => buildLibraryListCard(b)).join("")}</div>`;
      }
    }

    function buildGridCard(book) {
      const cover = book.coverURL
        ? `<img class="grid-cover-img" src="${WR.escapeHTML(book.coverURL)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : "";
      const ph = `<div class="grid-cover-placeholder" ${book.coverURL ? 'style="display:none"' : ""}>📖</div>`;
      return `
        <a class="grid-book-item" href="book.html?id=${encodeURIComponent(book.id)}" style="text-decoration:none;">
          ${cover}${ph}
          <div class="grid-book-title">${WR.escapeHTML(book.title || "")}</div>
          <div class="grid-book-author">${WR.escapeHTML(book.author || "")}</div>
        </a>`;
    }

    function buildLibraryListCard(book) {
      const cover = book.coverURL
        ? `<img class="book-cover-img" src="${WR.escapeHTML(book.coverURL)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : "";
      const ph      = `<div class="book-cover-placeholder" ${book.coverURL ? 'style="display:none"' : ""}>📖</div>`;
      const session = book.readingSessions?.[0];
      let badges = "";
      if (session?.completed)                                          badges += `<span class="status-badge badge-read">Read</span>`;
      if (session?.startDate && !session?.completed && !session?.dnf && !session?.completedWithoutDate) badges += `<span class="status-badge badge-reading">Reading</span>`;
      if (session?.dnf)                                               badges += `<span class="status-badge badge-dnf">DNF</span>`;
      if (book.lendingHistory?.some(l => l.currentlyLent))           badges += `<span class="status-badge badge-lent">Lent Out</span>`;
      return `
        <a class="book-card" href="book.html?id=${encodeURIComponent(book.id)}" style="text-decoration:none;">
          <div class="card-main">
            ${cover}${ph}
            <div class="card-info">
              <div class="card-title">${WR.escapeHTML(book.title || "")}</div>
              <div class="card-author">${WR.escapeHTML(book.author || "")}</div>
              ${badges ? `<div class="card-badges">${badges}</div>` : ""}
            </div>
          </div>
        </a>`;
    }

    function applyLibrarySort() {
      const val = document.getElementById("sortSelect")?.value || "addedAt-desc";
      const [field, dir] = val.split("-");
      let books = allBooks.filter(b => b.inLibrary);
      books.sort((a, b) => {
        if (field === "addedAt") { const av = a.addedAt?.seconds||0, bv = b.addedAt?.seconds||0; return dir === "desc" ? bv-av : av-bv; }
        if (field === "title")  { const av = (a.title||"").toLowerCase(), bv = (b.title||"").toLowerCase(); return dir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av); }
        if (field === "author") { const av = (a.author||"").toLowerCase(), bv = (b.author||"").toLowerCase(); return av.localeCompare(bv); }
        return 0;
      });
      const area = document.getElementById("libraryBooksArea");
      if (area) area.innerHTML = renderLibraryBooks(books);
    }

    function setView(view) {
      currentView = view;
      document.getElementById("viewGrid")?.classList.toggle("active", view === "grid");
      document.getElementById("viewList")?.classList.toggle("active", view === "list");
      applyLibrarySort();
    }

    function toggleLending() {
      const body   = document.getElementById("lendingBody");
      const toggle = document.getElementById("lendingToggle");
      const arrow  = document.getElementById("lendingArrow");
      if (!body) return;
      const open = body.classList.toggle("open");
      toggle.classList.toggle("open", open);
    }

    function switchLendTab(tab) {
      lendTab = tab;
    }

    // ── Library Book Modal ────────────────────────────────────
    function openBookModal(bookId) {
      const book = allBooks.find(b => b.id === bookId);
      if (!book) return;
      openBookId = bookId;

      const coverArea = document.getElementById("modalCoverArea");
      coverArea.innerHTML = book.coverURL
        ? `<img class="modal-cover" src="${WR.escapeHTML(book.coverURL)}" alt="">`
        : `<div class="modal-cover-placeholder">📖</div>`;

      document.getElementById("modalTitle").textContent  = book.title  || "";
      document.getElementById("modalAuthor").textContent = book.author || "";
      document.getElementById("modalISBN").textContent   = book.isbn ? "ISBN: " + book.isbn : "";

      const session = book.readingSessions?.[0] || {};
      const isLent  = book.lendingHistory?.some(l => l.currentlyLent);
      const lend    = book.lendingHistory?.find(l => l.currentlyLent) || {};

      document.getElementById("modalBody").innerHTML = `
        <div class="modal-section">
          <p class="modal-label">Reading Details</p>
          <div class="modal-field-row">
            <div class="modal-field">
              <label>Format</label>
              <select id="mFormat">
                <option value="read"     ${session.format==="read"     ? "selected" : ""}>Read</option>
                <option value="listened" ${session.format==="listened" ? "selected" : ""}>Listened</option>
              </select>
            </div>
            <div class="modal-field">
              <label>Started</label>
              <input type="date" id="mStartDate" value="${session.startDate || ""}">
            </div>
            <div class="modal-field">
              <label>Finished</label>
              <input type="date" id="mEndDate" value="${session.endDate || ""}">
            </div>
          </div>
          <label class="modal-checkbox-row" style="margin-top:8px;">
            <input type="checkbox" id="mDNF" ${session.dnf ? "checked" : ""}> Did Not Finish (DNF)
          </label>
        </div>
        <div class="modal-section">
          <p class="modal-label">Lending</p>
          <label class="modal-checkbox-row">
            <input type="checkbox" id="mLent" ${isLent ? "checked" : ""} onchange="toggleLendFields(this.checked)">
            Currently lent to someone
          </label>
          <div id="lendFields" style="display:${isLent ? "block" : "none"};margin-top:8px;">
            <div class="modal-field-row">
              <div class="modal-field"><label>Borrower Name</label><input type="text" id="mBorrowerName" value="${WR.escapeHTML(lend.borrowerName || "")}" placeholder="Their name"></div>
              <div class="modal-field"><label>Lent On</label><input type="date" id="mLentDate" value="${lend.lentDate || ""}"></div>
            </div>
          </div>
          ${buildLendHistory(book.lendingHistory || [])}
        </div>`;

      document.getElementById("bookModal").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function buildLendHistory(history) {
      const past = history.filter(l => !l.currentlyLent);
      if (!past.length) return "";
      return `<div class="lend-history">
        <p class="lend-history-title">History</p>
        ${past.map(l => `
          <div class="lend-history-item">
            <span>${WR.escapeHTML(l.borrowerName || "Unknown")}</span>
            <span>${l.lentDate || ""} → ${l.returnedDate || "?"}</span>
            <span class="lend-returned">Returned</span>
          </div>`).join("")}
      </div>`;
    }

    function toggleLendFields(show) {
      document.getElementById("lendFields").style.display = show ? "block" : "none";
    }

    function closeModal() {
      document.getElementById("bookModal").classList.remove("open");
      document.body.style.overflow = "";
      openBookId = null;
    }

    function viewOnBookPage() {
      if (openBookId) location.href = `book.html?id=${encodeURIComponent(openBookId)}`;
    }

    async function saveBookDetails() {
      if (!openBookId) return;
      const user  = WR.getCurrentUser();
      const book  = allBooks.find(b => b.id === openBookId);
      if (!book)  return;

      const startDate    = document.getElementById("mStartDate")?.value || null;
      const endDate      = document.getElementById("mEndDate")?.value   || null;
      const format       = document.getElementById("mFormat")?.value    || "read";
      const dnf          = document.getElementById("mDNF")?.checked     || false;
      const isLent       = document.getElementById("mLent")?.checked    || false;
      const borrowerName = document.getElementById("mBorrowerName")?.value.trim() || null;
      const lentDate     = document.getElementById("mLentDate")?.value  || null;

      try {
        const ref = WR.getDb().collection("users").doc(user.uid).collection("books").doc(openBookId);
        let sessions = book.readingSessions || [];
        if (!sessions.length) sessions = [{ sessionId: WR.generateId() }];
        sessions[0] = { ...sessions[0], startDate, endDate, format, dnf, completed: !!endDate && !dnf };

        let lendingHistory = (book.lendingHistory || []).filter(l => !l.currentlyLent);
        if (isLent) {
          lendingHistory.push({ lendId: WR.generateId(), borrowerUid: null, borrowerName: borrowerName || "Unknown", lentDate: lentDate || null, returnedDate: null, currentlyLent: true });
        }

        await ref.set({ readingSessions: sessions, lendingHistory, onReadList: !!(startDate || endDate || dnf), updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });

        const idx = allBooks.findIndex(b => b.id === openBookId);
        if (idx !== -1) allBooks[idx] = { ...allBooks[idx], readingSessions: sessions, lendingHistory };

        WR.showToast("Saved! 📚", "success");
        closeModal();
        renderLibrary();
      } catch (e) {
        console.error("Save error:", e);
        WR.showToast("Error saving.", "error");
      }
    }

    // ════════════════════════════════════════════════════════
    // ── READ LIST TAB ────────────────────────────────────────
    // ════════════════════════════════════════════════════════
    function renderReadList() {
      // Books with any reading session (in progress or completed)
      let books = allBooks.filter(b => b.readingSessions?.length > 0);
      document.getElementById("pageTitle").textContent    = "📖 Reading Log";
      document.getElementById("pageSubtitle").textContent = `${books.length} book${books.length === 1 ? "" : "s"} logged`;

      const completed  = books.filter(b =>
        b.readingSessions?.[0]?.completed ||
        b.readingSessions?.[0]?.completedWithoutDate
      ).length;
      const inProgress = books.filter(b => {
        const s = b.readingSessions?.[0];
        return s && !s.completed && !s.dnf && !s.completedWithoutDate;
      }).length;
      const thisYear   = books.filter(b => {
        const end = b.readingSessions?.[0]?.endDate;
        return end && new Date(end).getFullYear() === new Date().getFullYear();
      }).length;
      const dnf = books.filter(b => b.readingSessions?.[0]?.dnf).length;
      const ratings = books.map(b => b.readingSessions?.[0]?.rating).filter(r => r > 0);
      const avg = ratings.length ? (ratings.reduce((a,b) => a+b, 0) / ratings.length).toFixed(1) : "—";

      document.getElementById("contentArea").innerHTML = `
        <div class="stats-bar" style="margin-bottom:1.25rem;">
          <div class="stat-card"><span class="stat-num">${inProgress}</span><span class="stat-label">In Progress</span></div>
          <div class="stat-card"><span class="stat-num">${completed}</span><span class="stat-label">Completed</span></div>
          <div class="stat-card"><span class="stat-num">${thisYear}</span><span class="stat-label">This Year</span></div>
          <div class="stat-card"><span class="stat-num">${avg !== "—" ? "★ " + avg : "—"}</span><span class="stat-label">Avg Rating</span></div>
        </div>
        <div class="controls-bar">
          <select class="sort-select" id="readSort" onchange="applyReadSort()">
            <option value="dateCompleted-desc">Recently Finished</option>
            <option value="dateCompleted-asc">Oldest First</option>
            <option value="title-asc">Title A–Z</option>
            <option value="rating-desc">Highest Rated</option>
          </select>
          <div class="filter-row">
            <button class="filter-pill active" id="pill-all"        onclick="setReadFilter('all')">All</button>
            <button class="filter-pill"        id="pill-inprogress" onclick="setReadFilter('inprogress')">In Progress</button>
            <button class="filter-pill"        id="pill-completed"  onclick="setReadFilter('completed')">Completed</button>
            <button class="filter-pill"        id="pill-dnf"        onclick="setReadFilter('dnf')">DNF</button>
          </div>
        </div>
        <div id="readListBooks">${buildReadListBooks(books)}</div>`;
    }

    function setReadFilter(filter) {
      activeFilter = filter;
      document.querySelectorAll("#contentArea .filter-pill").forEach(p => p.classList.remove("active"));
      document.getElementById("pill-" + filter)?.classList.add("active");
      applyReadSort();
    }

    function applyReadSort() {
      const val  = document.getElementById("readSort")?.value || "dateCompleted-desc";
      const [field, dir] = val.split("-");
      let books = allBooks.filter(b => b.readingSessions?.length > 0);
      if (activeFilter === "inprogress") books = books.filter(b => {
        const s = b.readingSessions?.[0];
        return s && !s.completed && !s.dnf && !s.completedWithoutDate;
      });
      if (activeFilter === "completed")  books = books.filter(b => b.readingSessions?.[0]?.completed);
      if (activeFilter === "dnf")        books = books.filter(b => b.readingSessions?.[0]?.dnf);
      books.sort((a, b) => {
        const sa = a.readingSessions?.[0] || {}, sb = b.readingSessions?.[0] || {};
        if (field === "dateCompleted") { const av = sa.endDate||"", bv = sb.endDate||""; return dir === "desc" ? bv.localeCompare(av) : av.localeCompare(bv); }
        if (field === "rating") return dir === "desc" ? (sb.rating||0)-(sa.rating||0) : (sa.rating||0)-(sb.rating||0);
        if (field === "title")  { const av = (a.title||"").toLowerCase(), bv = (b.title||"").toLowerCase(); return av.localeCompare(bv); }
        return 0;
      });
      const area = document.getElementById("readListBooks");
      if (area) area.innerHTML = buildReadListBooks(books);
    }

    function buildReadListBooks(books) {
      if (!books.length) return `<div class="empty-state"><span class="empty-icon">📖</span><h2 class="empty-title">Nothing here yet</h2><p class="empty-desc">Mark books as read to see them here.</p><a href="search.html" class="empty-btn">🔍 Find a Book</a></div>`;
      return `<div class="books-list">${books.map(b => {
        const s = b.readingSessions?.[0] || {};
        const cover = b.coverURL ? `<img class="book-cover-img" src="${WR.escapeHTML(b.coverURL)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : "";
        const ph    = `<div class="book-cover-placeholder" ${b.coverURL ? 'style="display:none"' : ""}>📖</div>`;
        let badges  = "";
        if (s.completed)             badges += `<span class="status-badge badge-read">Completed</span>`;
        if (s.dnf)                   badges += `<span class="status-badge badge-dnf">DNF</span>`;
        if (s.format === "listened") badges += `<span class="status-badge badge-listened">Audiobook</span>`;
        const stars = s.rating ? "★".repeat(s.rating)+"☆".repeat(5-s.rating) : "";
        const metaItems = [];
        if (s.startDate) metaItems.push(`Started ${WR.formatDateInput(s.startDate)}`);
        if (s.endDate)   metaItems.push(`Finished ${WR.formatDateInput(s.endDate)}`);
        const cardId = "rc-" + b.id.replace(/[^a-z0-9]/gi,"");
        return `<div class="book-card" id="${cardId}">
          <div class="card-main" onclick="location.href='book.html?id=${encodeURIComponent(b.id)}'">
            ${cover}${ph}
            <div class="card-info">
              <div class="card-title">${WR.escapeHTML(b.title||"")}</div>
              <div class="card-author">${WR.escapeHTML(b.author||"")}</div>
              ${metaItems.length ? `<div class="card-meta">${metaItems.join(" · ")}</div>` : ""}
              ${badges ? `<div class="card-badges">${badges}</div>` : ""}
              ${stars ? `<div class="card-stars">${stars}</div>` : ""}
              <div class="card-actions">
                <button class="card-btn card-btn-expand" onclick="event.stopPropagation();toggleReview('${cardId}')">📝 ${s.review ? "My Review" : "Notes"}</button>
                <button class="card-btn card-btn-view" onclick="event.stopPropagation();location.href='book.html?id=${encodeURIComponent(b.id)}'">View Book →</button>
              </div>
            </div>
          </div>
          <div class="card-review-section" id="${cardId}-review">
            ${s.review ? `<p class="review-text">"${WR.escapeHTML(s.review)}"</p>` : `<p class="no-review-text">No review yet. <a href="book.html?id=${encodeURIComponent(b.id)}" style="color:var(--amethyst);">Add one →</a></p>`}
          </div>
        </div>`;
      }).join("")}</div>`;
    }

    function toggleReview(cardId) {
      document.getElementById(cardId + "-review")?.classList.toggle("open");
    }

    // ════════════════════════════════════════════════════════
    // ── TBR TAB ──────────────────────────────────────────────
    // ════════════════════════════════════════════════════════
    function sortByTbrOrder(books) {
      // Sort books according to tbrOrder, unordered books go to the end
      const orderMap = {};
      tbrOrder.forEach((id, i) => { orderMap[id] = i; });
      return [...books].sort((a, b) => {
        const ai = orderMap[a.id] ?? 9999;
        const bi = orderMap[b.id] ?? 9999;
        return ai - bi;
      });
    }

    function renderTBR() {
      let books = sortByTbrOrder(allBooks.filter(b => b.onTBR));
      document.getElementById("pageTitle").textContent    = "🔖 To Be Read";
      document.getElementById("pageSubtitle").textContent = `${books.length} book${books.length === 1 ? "" : "s"} to read`;

      document.getElementById("contentArea").innerHTML = `
        <div class="filter-row" style="margin-bottom:0.75rem;">
          <button class="filter-pill active" id="pill-all"     onclick="setTBRFilter('all')">All</button>
          <button class="filter-pill"        id="pill-owned"   onclick="setTBRFilter('owned')">In My Library</button>
          <button class="filter-pill"        id="pill-acquire" onclick="setTBRFilter('acquire')">Need to Acquire</button>
        </div>
        <p class="tbr-drag-note">☰ Drag cards to arrange your reading order — changes save automatically.</p>
        <div id="tbrBooks">${buildTBRBooks(books)}</div>`;

      initTBRDragDrop();
    }

    function setTBRFilter(filter) {
      activeFilter = filter;
      document.querySelectorAll("#contentArea .filter-pill").forEach(p => p.classList.remove("active"));
      document.getElementById("pill-" + filter)?.classList.add("active");
      let books = sortByTbrOrder(allBooks.filter(b => b.onTBR));
      if (filter === "owned")   books = books.filter(b => b.inLibrary);
      if (filter === "acquire") books = books.filter(b => b.tbrNeedsAcquisition);
      const area = document.getElementById("tbrBooks");
      if (area) {
        area.innerHTML = buildTBRBooks(books);
        initTBRDragDrop();
      }
    }

    function buildTBRBooks(books) {
      if (!books.length) return `<div class="empty-state"><span class="empty-icon">🔖</span><h2 class="empty-title">Your TBR list is empty</h2><p class="empty-desc">Add books you're planning to read.</p><a href="search.html" class="empty-btn">🔍 Find a Book</a></div>`;
      return `<div class="books-list" id="tbrList">${books.map(b => {
        const cover = b.coverURL ? `<img class="book-cover-img" src="${WR.escapeHTML(b.coverURL)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : "";
        const ph    = `<div class="book-cover-placeholder" ${b.coverURL ? 'style="display:none"' : ""}>🔖</div>`;
        let flags   = "";
        if (b.inLibrary)           flags += `<span class="flag-badge flag-owned">In My Library</span>`;
        if (b.tbrNeedsAcquisition) flags += `<span class="flag-badge flag-acquire">Need to Acquire</span>`;
        return `<div class="book-card" draggable="true" data-id="${b.id}">
          <div class="card-main">
            <span class="tbr-drag-handle" title="Drag to reorder">☰</span>
            ${cover}${ph}
            <div class="card-info" onclick="location.href='book.html?id=${encodeURIComponent(b.id)}'">
              <div class="card-title">${WR.escapeHTML(b.title||"")}</div>
              <div class="card-author">${WR.escapeHTML(b.author||"")}</div>
              ${flags ? `<div class="card-badges" style="margin-top:6px;">${flags}</div>` : ""}
            </div>
            <div class="tbr-actions">
              <button class="tbr-btn tbr-btn-start"  onclick="markReading('${b.id}')">📖 Start</button>
              <button class="tbr-btn tbr-btn-remove" onclick="removeFromTBR('${b.id}')">Remove</button>
            </div>
          </div>
        </div>`;
      }).join("")}</div>`;
    }

    // ── Drag and Drop Logic ───────────────────────────────────
    let dragSrcId = null;
    let saveTbrOrderTimer = null;

    function initTBRDragDrop() {
      const list = document.getElementById("tbrList");
      if (!list) return;

      list.querySelectorAll(".book-card[draggable]").forEach(card => {
        // Desktop drag events
        card.addEventListener("dragstart", onDragStart);
        card.addEventListener("dragover",  onDragOver);
        card.addEventListener("dragleave", onDragLeave);
        card.addEventListener("drop",      onDrop);
        card.addEventListener("dragend",   onDragEnd);

        // Touch events for mobile
        const handle = card.querySelector(".tbr-drag-handle");
        if (handle) {
          handle.addEventListener("touchstart", onTouchStart, { passive: false });
        }
      });
    }

    let touchDragCard  = null;
    let touchClone     = null;
    let touchOffsetY   = 0;

    function onTouchStart(e) {
      e.preventDefault();
      const card = this.closest(".book-card");
      if (!card) return;
      touchDragCard = card;
      dragSrcId     = card.dataset.id;
      const rect    = card.getBoundingClientRect();
      touchOffsetY  = e.touches[0].clientY - rect.top;

      // Create a visual clone
      touchClone = card.cloneNode(true);
      touchClone.style.cssText = `
        position:fixed;left:${rect.left}px;top:${rect.top}px;
        width:${rect.width}px;opacity:0.85;z-index:9999;
        pointer-events:none;border-radius:14px;
        box-shadow:0 8px 24px rgba(45,27,78,0.2);
        transition:none;`;
      document.body.appendChild(touchClone);
      card.style.opacity = "0.3";

      document.addEventListener("touchmove", onTouchMove, { passive: false });
      document.addEventListener("touchend",  onTouchEnd);
    }

    function onTouchMove(e) {
      e.preventDefault();
      if (!touchClone) return;
      const y = e.touches[0].clientY - touchOffsetY;
      const x = parseFloat(touchClone.style.left);
      touchClone.style.top = y + "px";

      // Find card under touch point
      touchClone.style.display = "none";
      const el = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
      touchClone.style.display = "";
      const targetCard = el?.closest(".book-card[data-id]");
      document.querySelectorAll(".book-card.drag-over").forEach(c => c.classList.remove("drag-over"));
      if (targetCard && targetCard !== touchDragCard) {
        targetCard.classList.add("drag-over");
      }
    }

    function onTouchEnd(e) {
      document.removeEventListener("touchmove", onTouchMove);
      document.removeEventListener("touchend",  onTouchEnd);

      if (touchClone) { touchClone.remove(); touchClone = null; }
      if (touchDragCard) touchDragCard.style.opacity = "";

      // Find drop target
      const pt = e.changedTouches[0];
      const el = document.elementFromPoint(pt.clientX, pt.clientY);
      const targetCard = el?.closest(".book-card[data-id]");
      document.querySelectorAll(".book-card.drag-over").forEach(c => c.classList.remove("drag-over"));

      if (targetCard && touchDragCard && targetCard !== touchDragCard) {
        const list    = document.getElementById("tbrList");
        const cards   = [...list.querySelectorAll(".book-card[data-id]")];
        const srcIdx  = cards.indexOf(touchDragCard);
        const tgtIdx  = cards.indexOf(targetCard);
        if (srcIdx < tgtIdx) targetCard.after(touchDragCard);
        else targetCard.before(touchDragCard);

        tbrOrder = [...list.querySelectorAll(".book-card[data-id]")].map(c => c.dataset.id);
        clearTimeout(saveTbrOrderTimer);
        saveTbrOrderTimer = setTimeout(saveTbrOrder, 800);
        WR.showToast("Order saved 🔖", "success");
      }

      touchDragCard = null;
      dragSrcId     = null;
    }

    function onDragStart(e) {
      dragSrcId = this.dataset.id;
      this.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", dragSrcId);
    }

    function onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      if (this.dataset.id !== dragSrcId) {
        this.classList.add("drag-over");
      }
    }

    function onDragLeave() {
      this.classList.remove("drag-over");
    }

    function onDrop(e) {
      e.preventDefault();
      this.classList.remove("drag-over");
      const targetId = this.dataset.id;
      if (!dragSrcId || dragSrcId === targetId) return;

      const list  = document.getElementById("tbrList");
      const cards = [...list.querySelectorAll(".book-card[data-id]")];
      const srcEl = list.querySelector(`[data-id="${dragSrcId}"]`);
      const tgtEl = list.querySelector(`[data-id="${targetId}"]`);
      if (!srcEl || !tgtEl) return;

      // Reorder in DOM
      const srcIdx = cards.indexOf(srcEl);
      const tgtIdx = cards.indexOf(tgtEl);
      if (srcIdx < tgtIdx) {
        tgtEl.after(srcEl);
      } else {
        tgtEl.before(srcEl);
      }

      // Update tbrOrder from new DOM order
      tbrOrder = [...list.querySelectorAll(".book-card[data-id]")].map(c => c.dataset.id);

      // Debounce save to Firestore
      clearTimeout(saveTbrOrderTimer);
      saveTbrOrderTimer = setTimeout(() => {
        saveTbrOrder().then(() => WR.showToast("Order saved 🔖", "success"));
      }, 800);
    }

    function onDragEnd() {
      this.classList.remove("dragging");
      document.querySelectorAll(".book-card.drag-over").forEach(c => c.classList.remove("drag-over"));
    }

    async function saveTbrOrder() {
      const user = WR.getCurrentUser();
      try {
        await WR.getDb().collection("users").doc(user.uid).set(
          { tbrOrder },
          { merge: true }
        );
      } catch (e) {
        console.error("Save TBR order error:", e);
        WR.showToast("Could not save order.", "error");
      }
    }

    async function markReading(bookId) {
      const user  = WR.getCurrentUser();
      const book  = allBooks.find(b => b.id === bookId);
      if (!book) { WR.showToast("Book not found.", "error"); return; }

      try {
        const today   = new Date().toISOString().split("T")[0];
        const session = {
          sessionId:       WR.generateId(),
          startDate:       today,
          endDate:         null,
          completed:       false,
          dnf:             false,
          format:          "read",
          review:          null,
          rating:          null,
          reviewPublished: false
        };

        // Use the Firestore document ID (b.id) which is what was used when saving
        const docId = book.bookId || book.id;
        const ref   = WR.getDb()
          .collection("users").doc(user.uid)
          .collection("books").doc(docId);

        await ref.set({
          onTBR:           false,
          tbrNeedsAcquisition: false,
          readingSessions: firebase.firestore.FieldValue.arrayUnion(session),
          updatedAt:       firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        // Update local state
        const idx = allBooks.findIndex(b => b.id === bookId);
        if (idx !== -1) {
          allBooks[idx].onTBR            = false;
          allBooks[idx].tbrNeedsAcquisition = false;
          if (!allBooks[idx].readingSessions) allBooks[idx].readingSessions = [];
          allBooks[idx].readingSessions.unshift(session);
        }
        updateCounts();
        renderTBR();
        WR.showToast("Happy reading! 📖", "success");
      } catch (e) {
        console.error("Start reading error:", e);
        WR.showToast("Something went wrong.", "error");
      }
    }

    async function removeFromTBR(bookId) {
      const user = WR.getCurrentUser();
      try {
        tbrOrder = tbrOrder.filter(id => id !== bookId);

        // Update the book's onTBR flag on the book subcollection doc
        await WR.getDb()
          .collection("users").doc(user.uid)
          .collection("books").doc(bookId)
          .set({ onTBR: false, tbrNeedsAcquisition: false, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });

        // Also save the updated tbrOrder on the user doc
        await WR.getDb()
          .collection("users").doc(user.uid)
          .set({ tbrOrder }, { merge: true });

        const idx = allBooks.findIndex(b => b.id === bookId);
        if (idx !== -1) allBooks[idx].onTBR = false;
        updateCounts();
        renderTBR();
        WR.showToast("Removed from TBR.");
      } catch (e) {
        console.error("Remove from TBR error:", e);
        WR.showToast("Something went wrong.", "error");
      }
    }

    // ════════════════════════════════════════════════════════
    // ── WISHLIST TAB ─────────────────────────────────────────
    // ════════════════════════════════════════════════════════
    function renderWishlist() {
      const books = allBooks.filter(b => b.onWishlist);
      document.getElementById("pageTitle").textContent    = "⭐ My Wishlist";
      document.getElementById("pageSubtitle").textContent = `${books.length} book${books.length === 1 ? "" : "s"} on your wishlist`;
      const user    = WR.getCurrentUser();
      const shareLink = `${location.origin}/wishlist-public.html?uid=${user.uid}`;

      document.getElementById("contentArea").innerHTML = `
        <div class="visibility-banner">
          <div class="visibility-info">
            <span id="visIcon">${isPublic ? "🌐" : "🔒"}</span>
            <span id="visText">Your wishlist is <strong>${isPublic ? "public" : "private"}</strong></span>
          </div>
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <button style="font-family:'Nunito Sans',sans-serif;font-size:13px;font-weight:600;padding:7px 14px;border-radius:7px;border:none;background:var(--faded-moss);color:#1A3D2E;cursor:pointer;" onclick="toggleShareBox()">🔗 Share List</button>
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--terracotta);cursor:pointer;">
              ${isPublic ? "Public" : "Private"}
              <label class="toggle-switch">
                <input type="checkbox" id="visibilityToggle" ${isPublic ? "checked" : ""} onchange="toggleVisibility()">
                <span class="toggle-track"></span>
              </label>
            </label>
          </div>
        </div>
        <div class="share-box" id="shareBox">
          <p style="font-size:12px;font-weight:600;color:var(--amethyst);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">🔗 Share your wishlist</p>
          <div class="share-link-row">
            <input type="text" class="share-link-input" value="${shareLink}" readonly>
            <button class="copy-btn" onclick="copyShareLink('${shareLink}')">Copy Link</button>
          </div>
          <p style="font-size:12px;color:var(--terracotta);margin-top:6px;">Anyone with this link can view your wishlist — no account needed.</p>
        </div>
        <div id="wishlistBooks">${buildWishlistBooks(books)}</div>`;
    }

    function buildWishlistBooks(books) {
      if (!books.length) return `<div class="empty-state"><span class="empty-icon">⭐</span><h2 class="empty-title">Your wishlist is empty</h2><p class="empty-desc">Add books you want to buy, borrow, or read.</p><a href="search.html" class="empty-btn">🔍 Find a Book</a></div>`;
      return `<div class="books-list">${books.map(b => {
        const cover = b.coverURL ? `<img class="book-cover-img" src="${WR.escapeHTML(b.coverURL)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : "";
        const ph    = `<div class="book-cover-placeholder" ${b.coverURL ? 'style="display:none"' : ""}>⭐</div>`;
        return `<div class="book-card">
          <div class="card-main">
            ${cover}${ph}
            <div class="card-info" onclick="location.href='book.html?id=${encodeURIComponent(b.id)}'">
              <div class="card-title">${WR.escapeHTML(b.title||"")}</div>
              <div class="card-author">${WR.escapeHTML(b.author||"")}</div>
              ${b.addedAt ? `<div class="card-meta">Added ${WR.formatRelativeTime(b.addedAt)}</div>` : ""}
            </div>
            <div class="wish-actions">
              <button class="wish-btn wish-btn-add"    onclick="moveToLibrary('${b.id}')">📚 Own It</button>
              <button class="wish-btn wish-btn-tbr"    onclick="moveToTBR('${b.id}')">🔖 TBR</button>
              <button class="wish-btn wish-btn-remove" onclick="removeFromWishlist('${b.id}')">Remove</button>
            </div>
          </div>
        </div>`;
      }).join("")}</div>`;
    }

    async function toggleVisibility() {
      const user = WR.getCurrentUser();
      isPublic   = document.getElementById("visibilityToggle").checked;
      document.getElementById("visIcon").textContent = isPublic ? "🌐" : "🔒";
      document.getElementById("visText").innerHTML   = `Your wishlist is <strong>${isPublic ? "public" : "private"}</strong>`;
      try {
        await WR.getDb().collection("users").doc(user.uid).set({ profileVisibility: { wishlist: isPublic } }, { merge: true });
        WR.showToast(isPublic ? "Wishlist set to public." : "Wishlist set to private.");
      } catch (e) { WR.showToast("Error saving visibility.", "error"); }
    }

    function toggleShareBox() {
      shareBoxOpen = !shareBoxOpen;
      document.getElementById("shareBox")?.classList.toggle("show", shareBoxOpen);
    }

    function copyShareLink(link) {
      navigator.clipboard.writeText(link)
        .then(() => WR.showToast("Link copied! 🔗", "success"))
        .catch(() => WR.showToast("Copy failed — select the link manually.", "error"));
    }

    async function moveToLibrary(bookId) {
      const user = WR.getCurrentUser();
      try {
        await WR.getDb().collection("users").doc(user.uid).collection("books").doc(bookId)
          .set({ inLibrary: true, onWishlist: false, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        const idx = allBooks.findIndex(b => b.id === bookId);
        if (idx !== -1) { allBooks[idx].inLibrary = true; allBooks[idx].onWishlist = false; }
        updateCounts();
        renderWishlist();
        WR.showToast("Added to your library! 📚", "success");
      } catch (e) { WR.showToast("Something went wrong.", "error"); }
    }

    async function moveToTBR(bookId) {
      const user = WR.getCurrentUser();
      try {
        await WR.getDb().collection("users").doc(user.uid).collection("books").doc(bookId)
          .set({ onTBR: true, tbrNeedsAcquisition: true, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        const idx = allBooks.findIndex(b => b.id === bookId);
        if (idx !== -1) allBooks[idx].onTBR = true;
        updateCounts();
        WR.showToast("Added to TBR! 🔖", "success");
      } catch (e) { WR.showToast("Something went wrong.", "error"); }
    }

    async function removeFromWishlist(bookId) {
      const user = WR.getCurrentUser();
      try {
        await WR.getDb().collection("users").doc(user.uid).collection("books").doc(bookId)
          .update({ onWishlist: false, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        const idx = allBooks.findIndex(b => b.id === bookId);
        if (idx !== -1) allBooks[idx].onWishlist = false;
        updateCounts();
        renderWishlist();
        WR.showToast("Removed from wishlist.");
      } catch (e) { WR.showToast("Something went wrong.", "error"); }
    }

    // ── Expose ────────────────────────────────────────────────
    window.switchTab        = switchTab;
    window.setView          = setView;
    window.applyLibrarySort = applyLibrarySort;
    window.toggleLending    = toggleLending;
    window.switchLendTab    = switchLendTab;
    window.openBookModal    = openBookModal;
    window.closeModal       = closeModal;
    window.viewOnBookPage   = viewOnBookPage;
    window.saveBookDetails  = saveBookDetails;
    window.toggleLendFields = toggleLendFields;
    window.toggleReview     = toggleReview;
    window.setReadFilter    = setReadFilter;
    window.applyReadSort    = applyReadSort;
    window.setTBRFilter     = setTBRFilter;
    window.markReading      = markReading;
    window.removeFromTBR    = removeFromTBR;
    window.toggleVisibility = toggleVisibility;
    window.toggleShareBox   = toggleShareBox;
    window.copyShareLink    = copyShareLink;
    window.moveToLibrary    = moveToLibrary;
    window.moveToTBR        = moveToTBR;
    window.removeFromWishlist = removeFromWishlist;
  </script>

  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
  </script>
</body>
