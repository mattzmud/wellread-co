<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WellRead Co. — Profile</title>
  <meta name="theme-color" content="#2D1B4E">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon-96x96.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --lavender-mist: #F7F3FF;
      --aged-paper:    #FAF6EE;
      --deep-plum:     #2D1B4E;
      --amethyst:      #7B5EA7;
      --faded-moss:    #9DC4B0;
      --warm-gold:     #C9A84C;
      --terracotta:    #A0674A;
      --border:        #E8DFC8;
    }

    html, body {
      min-height: 100%;
      font-family: 'Nunito Sans', sans-serif;
      background: var(--lavender-mist);
      color: var(--deep-plum);
    }

    .page-wrap {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1.25rem 6rem;
    }

    /* ── Profile Hero ── */
    .profile-hero {
      background: #fff;
      border-radius: 20px;
      border: 1px solid var(--border);
      padding: 2rem;
      margin-bottom: 1.25rem;
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .profile-photo-wrap { flex-shrink: 0; position: relative; }

    .profile-photo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--faded-moss);
      display: block;
    }

    .profile-photo-placeholder {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--lavender-mist);
      border: 3px solid var(--faded-moss);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
    }

    .profile-info { flex: 1; min-width: 0; }

    .profile-display-name {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--deep-plum);
      margin-bottom: 4px;
    }

    .profile-handle {
      font-size: 14px;
      color: var(--terracotta);
      margin-bottom: 8px;
    }

    .wellread-since {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      color: var(--amethyst);
      background: var(--lavender-mist);
      border: 1px solid #DDD6F3;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    .profile-bio {
      font-size: 14px;
      color: var(--deep-plum);
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .social-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--amethyst);
      text-decoration: none;
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--lavender-mist);
      border: 1px solid #DDD6F3;
      transition: background 0.15s;
      line-height: 1;
    }

    .social-link svg { display: block; flex-shrink: 0; border-radius: 3px; }

    .social-link:hover { background: #EDE4F7; }

    .profile-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .profile-btn {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .profile-btn:hover { opacity: 0.85; }
    .btn-primary   { background: var(--amethyst); color: #FAF6EE; }
    .btn-secondary { background: var(--lavender-mist); color: var(--amethyst); border: 1.5px solid var(--amethyst); }
    .btn-moss      { background: var(--faded-moss); color: #1A3D2E; }
    .btn-pending   { background: var(--aged-paper); color: var(--terracotta); border: 1.5px solid var(--border); cursor: default; }
    .btn-settings  { background: var(--aged-paper); color: var(--terracotta); border: 1.5px solid var(--border); }

    /* ── Quick Stats ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 1.25rem;
    }

    .stat-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 1rem;
      text-align: center;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.15s;
      cursor: pointer;
    }

    .stat-card:hover { box-shadow: 0 3px 10px rgba(45,27,78,0.07); }

    .stat-num   { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--amethyst); display: block; }
    .stat-label { font-size: 12px; color: var(--terracotta); margin-top: 2px; }

    /* ── Content Sections ── */
    .profile-section {
      background: #fff;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 1.25rem;
      overflow: hidden;
    }

    .section-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .section-toggle:hover { background: var(--lavender-mist); }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      color: var(--deep-plum);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-arrow {
      font-size: 12px;
      color: var(--terracotta);
      transition: transform 0.2s;
    }

    .section-toggle.open .section-arrow { transform: rotate(180deg); }

    .section-body {
      display: none;
      border-top: 1px solid var(--border);
      padding: 1.25rem;
    }

    .section-body.open { display: block; }

    /* ── Currently Reading ── */
    .reading-shelf {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: thin;
    }

    .reading-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 90px;
      max-width: 90px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .reading-cover-sm {
      width: 90px;
      height: 128px;
      object-fit: cover;
      border-radius: 5px;
      box-shadow: 2px 3px 8px rgba(45,27,78,0.15);
      display: block;
    }

    .reading-cover-sm-placeholder {
      width: 90px;
      height: 128px;
      border-radius: 5px;
      background: linear-gradient(135deg, var(--amethyst), #4A2D7A);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .reading-card-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--deep-plum);
      text-align: center;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }

    /* ── Read List ── */
    .read-list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 14px;
    }

    .read-grid-item {
      text-align: center;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .read-cover {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      border-radius: 5px;
      box-shadow: 1px 2px 8px rgba(45,27,78,0.14);
      display: block;
      margin-bottom: 5px;
    }

    .read-cover-placeholder {
      width: 100%;
      aspect-ratio: 2/3;
      border-radius: 5px;
      background: linear-gradient(135deg, var(--amethyst), #4A2D7A);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 5px;
    }

    .read-title {
      font-size: 10px;
      color: var(--deep-plum);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }

    /* ── Wishlist ── */
    .wishlist-items { display: flex; flex-direction: column; gap: 8px; }

    .wishlist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 8px;
      background: var(--lavender-mist);
      text-decoration: none;
      color: inherit;
      transition: background 0.15s;
    }

    .wishlist-item:hover { background: #EDE4F7; }

    .wl-cover {
      width: 40px;
      height: 58px;
      object-fit: cover;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .wl-cover-placeholder {
      width: 40px;
      height: 58px;
      border-radius: 3px;
      background: linear-gradient(135deg, var(--warm-gold), #A07820);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .wl-info { flex: 1; min-width: 0; }
    .wl-title  { font-size: 13px; font-weight: 600; color: var(--deep-plum); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wl-author { font-size: 11px; color: var(--terracotta); }

    /* ── Clubs ── */
    .clubs-list { display: flex; flex-direction: column; gap: 10px; }

    .club-item {
      background: var(--faded-moss);
      border-radius: 10px;
      padding: 0.875rem 1rem;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      transition: opacity 0.15s;
    }

    .club-item:hover { opacity: 0.88; }

    .club-item-icon { font-size: 22px; flex-shrink: 0; }

    .club-item-info { flex: 1; min-width: 0; }
    .club-item-name { font-size: 14px; font-weight: 600; color: #1A3D2E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .club-item-meta { font-size: 12px; color: #2E5E47; }

    /* ── Recently Finished ── */
    .recent-list { display: flex; flex-direction: column; gap: 10px; }

    .recent-item {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .recent-cover {
      width: 48px;
      height: 68px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
      box-shadow: 1px 2px 6px rgba(45,27,78,0.14);
    }

    .recent-cover-placeholder {
      width: 48px;
      height: 68px;
      border-radius: 4px;
      background: linear-gradient(135deg, var(--amethyst), #4A2D7A);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .recent-info { flex: 1; min-width: 0; }
    .recent-title  { font-family: 'Playfair Display', serif; font-size: 14px; color: var(--deep-plum); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .recent-author { font-size: 12px; color: var(--terracotta); margin-bottom: 3px; }
    .recent-date   { font-size: 11px; color: #BDB5CC; }
    .recent-stars  { font-size: 13px; color: var(--warm-gold); }

    /* ── Empty / Loading ── */
    .section-empty {
      text-align: center;
      padding: 1rem;
      font-size: 13px;
      color: var(--terracotta);
    }

    .skeleton-line {
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(90deg,#ede8f5 25%,#e0d8ef 50%,#ede8f5 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      margin-bottom: 8px;
    }

    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ── Not Found ── */
    .not-found {
      text-align: center;
      padding: 4rem 2rem;
    }

    .not-found-icon  { font-size: 52px; display: block; margin-bottom: 1rem; }
    .not-found-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--deep-plum); margin-bottom: 0.5rem; }
    .not-found-desc  { font-size: 14px; color: var(--terracotta); }

    @media (max-width: 580px) {
      .profile-hero { flex-direction: column; align-items: center; text-align: center; }
      .social-links, .profile-actions { justify-content: center; }
      .stats-row    { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <div class="page-wrap" id="pageWrap">
    <!-- Skeleton while loading -->
    <div style="background:#fff;border-radius:20px;border:1px solid var(--border);padding:2rem;margin-bottom:1.25rem;">
      <div style="display:flex;gap:1.5rem;align-items:flex-start;">
        <div style="width:100px;height:100px;border-radius:50%;background:linear-gradient(90deg,#ede8f5 25%,#e0d8ef 50%,#ede8f5 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;flex-shrink:0;"></div>
        <div style="flex:1;">
          <div class="skeleton-line" style="width:55%;height:22px;margin-bottom:10px;"></div>
          <div class="skeleton-line" style="width:35%"></div>
          <div class="skeleton-line" style="width:70%;margin-top:12px;"></div>
          <div class="skeleton-line" style="width:60%"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase -->
  <!-- Goal Modal -->
  <div id="profileGoalModal" onclick="if(event.target===this)closeProfileGoalModal()" style="display:none;position:fixed;inset:0;background:rgba(45,27,78,0.45);z-index:500;align-items:flex-end;justify-content:center;">
    <div style="background:var(--aged-paper);border-radius:20px 20px 0 0;padding:1.75rem;width:100%;max-width:420px;box-shadow:0 -4px 32px rgba(45,27,78,0.18);">
      <div style="width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 1.25rem;"></div>
      <h2 style="font-family:'Playfair Display',serif;font-size:20px;color:var(--deep-plum);margin-bottom:0.25rem;">🎯 Monthly Reading Goal</h2>
      <p id="profileGoalModalDesc" style="font-size:13px;color:var(--terracotta);margin-bottom:1.25rem;"></p>
      <div style="display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:1.25rem;">
        <button onclick="adjustProfileGoal(-1)" style="width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border);background:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;">−</button>
        <input type="number" id="profileGoalInput" value="4" min="1" max="100"
          style="width:80px;text-align:center;font-family:'Playfair Display',serif;font-size:36px;color:var(--deep-plum);border:none;background:transparent;outline:none;-moz-appearance:textfield;">
        <button onclick="adjustProfileGoal(1)" style="width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border);background:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;">+</button>
        <span style="font-size:14px;color:var(--terracotta);">books</span>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button onclick="closeProfileGoalModal()" style="font-family:'Nunito Sans',sans-serif;font-size:14px;font-weight:600;padding:10px 20px;border-radius:8px;border:1.5px solid var(--border);background:var(--aged-paper);color:var(--terracotta);cursor:pointer;">Cancel</button>
        <button onclick="saveProfileGoal()" style="font-family:'Nunito Sans',sans-serif;font-size:14px;font-weight:600;padding:10px 20px;border-radius:8px;border:none;background:var(--amethyst);color:#FAF6EE;cursor:pointer;">Save Goal</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <script src="common.js"></script>

  <script>
    // ── State ─────────────────────────────────────────────────
    let profileData  = null;
    let profileUid   = null;
    let isOwnProfile = false;
    let friendStatus = null; // null | 'pending' | 'accepted'
    let friendshipId = null;
    let userBooks    = [];
    let userClubs    = [];

    // ── Init ──────────────────────────────────────────────────
    WR.initAuth(async (user) => {
      if (!user) return;

      const params = new URLSearchParams(location.search);
      profileUid   = params.get("uid") || user.uid;
      isOwnProfile = profileUid === user.uid;

      await Promise.all([
        loadProfile(),
        loadUserBooks(),
        loadUserClubs(),
        isOwnProfile ? Promise.resolve() : checkFriendStatus()
      ]);

      if (!profileData) {
        showNotFound();
        return;
      }

      document.title = `${profileData.displayName} — WellRead Co.`;
      renderPage();

      // Auto-migrate friendsList for own profile if not yet set
      await migrateFriendsListIfNeeded();

      // Load friend profile cards after page renders
      loadFriendsListProfiles();

      // If viewing own profile, run badge check and refresh the badges section
      // in case new badges were just awarded
      if (isOwnProfile) {
        setTimeout(async () => {
          await WR.checkBadges();
          await WR.showBadgePopupIfNeeded();
          // Re-fetch profile to pick up any newly written badges
          try {
            const refreshed = await WR.getDb().collection("users").doc(profileUid).get();
            if (refreshed.exists) {
              const newBadges = refreshed.data().badges || [];
              if (newBadges.length !== (profileData.badges || []).length) {
                profileData.badges = newBadges;
                // Re-render just the badges section
                const badgesEl = document.querySelector("#badges-body")?.closest(".profile-section");
                if (badgesEl) {
                  badgesEl.outerHTML = buildBadgesSection(profileData, true);
                }
              }
            }
          } catch (e) { console.error("Badge refresh error:", e); }
        }, 2000);
      }
    });

    // ── Loaders ───────────────────────────────────────────────
    async function loadProfile() {
      try {
        const snap = await WR.getDb().collection("users").doc(profileUid).get();
        if (snap.exists) profileData = snap.data();
      } catch (e) { console.error("Profile load error:", e); }
    }

    async function loadUserBooks() {
      try {
        const snap = await WR.getDb()
          .collection("users").doc(profileUid)
          .collection("books").get();
        userBooks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (e) { console.error("Books load error:", e); }
    }

    async function loadUserClubs() {
      try {
        const snap = await WR.getDb()
          .collection("clubs")
          .where("memberUids", "array-contains", profileUid)
          .limit(10)
          .get();
        userClubs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (e) { console.error("Clubs load error:", e); }
    }

    async function checkFriendStatus() {
      const currentUid = WR.getCurrentUser().uid;
      friendshipId     = WR.getFriendshipId(currentUid, profileUid);
      try {
        const snap = await WR.getDb().collection("friends").doc(friendshipId).get();
        if (snap.exists) {
          const data = snap.data();
          friendStatus = data.status; // 'pending' | 'accepted'
        }
      } catch (e) { console.error("Friend status error:", e); }
    }

    // ── Render ────────────────────────────────────────────────
    function renderPage() {
      const wrap = document.getElementById("pageWrap");
      const vis  = profileData.profileVisibility || {};

      // Derived book lists
      const currentlyReading = userBooks.filter(b => {
        const s = b.readingSessions?.[0];
        return b.onReadList && s?.startDate && !s?.completed && !s?.dnf;
      });

      const recentlyFinished = userBooks.filter(b => {
        const s = b.readingSessions?.[0];
        if (!s?.endDate) return false;
        const end  = new Date(s.endDate);
        const diff = (Date.now() - end.getTime()) / (1000 * 60 * 60 * 24);
        return diff <= 15;
      });

      const wishlistBooks = userBooks.filter(b => b.onWishlist);
      const libraryBooks  = userBooks.filter(b => b.inLibrary);
      const readBooks     = userBooks.filter(b => b.onReadList);

      const joinedDate = profileData.joinedAt
        ? profileData.joinedAt.toDate
          ? profileData.joinedAt.toDate().toLocaleDateString("en-US", { month: "long", year: "numeric" })
          : new Date(profileData.joinedAt).toLocaleDateString("en-US", { month: "long", year: "numeric" })
        : null;

      wrap.innerHTML = `
        <!-- Profile Hero -->
        <div class="profile-hero">
          <div class="profile-photo-wrap">
            ${profileData.photoURL
              ? `<img class="profile-photo" src="${WR.escapeHTML(profileData.photoURL)}" alt="${WR.escapeHTML(profileData.displayName || "")}">`
              : `<div class="profile-photo-placeholder">👤</div>`}
          </div>
          <div class="profile-info">
            <h1 class="profile-display-name">${WR.escapeHTML(profileData.displayName || "")}</h1>
            <p class="profile-handle">${WR.escapeHTML(profileData.firstName || "")} ${WR.escapeHTML(profileData.lastName || "")}</p>
            ${joinedDate ? `<span class="wellread-since">📖 WellRead since ${joinedDate}</span>` : ""}
            ${profileData.bio ? `<p class="profile-bio">${WR.escapeHTML(profileData.bio)}</p>` : ""}
            ${buildSocialLinks()}
            <div class="profile-actions">
              ${buildActionButtons()}
            </div>
          </div>
        </div>

        <!-- Quick Stats -->
        <div class="stats-row">
          <div class="stat-card" onclick="${isOwnProfile ? "location.href='library.html'" : ""}">
            <span class="stat-num">${libraryBooks.length}</span>
            <span class="stat-label">Books in Library</span>
          </div>
          <div class="stat-card" onclick="${isOwnProfile ? "location.href='library.html?tab=readlist'" : ""}">
            <span class="stat-num">${readBooks.length}</span>

    // ── Friends Section ───────────────────────────────────────
    function buildFriendsSection(profile, isOwn) {
      const friendsList    = profile.friendsList || [];
      const count          = friendsList.length;
      const vis            = profile.profileVisibility || {};
      const friendsVisible = vis.friendsList !== false;

      // Own profile — always show
      // Other profile — check visibility setting
      if (!isOwn && !friendsVisible) {
        return `
          <div class="profile-section">
            <div class="section-toggle" onclick="toggleSection('friends', this)">
              <span class="section-title">🤝 Friends</span>
              <span class="section-arrow">▼</span>
            </div>
            <div class="section-body" id="friends-body">
              <p style="font-size:13px;color:#BDB5CC;text-align:center;padding:1rem;">This user's friends list is private.</p>
            </div>
          </div>`;
      }

      if (!count && isOwn) {
        return `
          <div class="profile-section">
            <div class="section-toggle" onclick="toggleSection('friends', this)">
              <span class="section-title">🤝 Friends</span>
              <span class="section-arrow">▼</span>
            </div>
            <div class="section-body" id="friends-body">
              <div style="text-align:center;padding:1rem;">
                <p style="font-size:14px;color:var(--terracotta);margin-bottom:0.75rem;">You haven't added any friends yet.</p>
                <a href="search.html?tab=people" style="font-family:'Nunito Sans',sans-serif;font-size:13px;font-weight:600;padding:8px 16px;border-radius:8px;border:none;background:var(--amethyst);color:#FAF6EE;text-decoration:none;">🔍 Find Readers</a>
              </div>
            </div>
          </div>`;
      }

      return `
        <div class="profile-section">
          <div class="section-toggle" onclick="toggleSection('friends', this)">
            <span class="section-title">🤝 Friends
              <span style="font-size:12px;font-family:'Nunito Sans';font-weight:600;background:var(--lavender-mist);color:var(--amethyst);padding:2px 8px;border-radius:10px;margin-left:4px;">${count}</span>
            </span>
            <span class="section-arrow">▼</span>
          </div>
          <div class="section-body" id="friends-body">
            <div id="friendsListInner">
              <p style="font-size:13px;color:#BDB5CC;text-align:center;padding:0.5rem;">Loading friends...</p>
            </div>
            ${isOwn ? `<div style="margin-top:1rem;"><a href="search.html?tab=people" style="font-size:13px;color:var(--amethyst);text-decoration:none;">+ Find more readers →</a></div>` : ""}
          </div>
        </div>`;
    }

    async function loadFriendsListProfiles() {
      const friendsList = profileData.friendsList || [];
      if (!friendsList.length) return;

      const el = document.getElementById("friendsListInner");
      if (!el) return;

      try {
        // Load profiles for all friends in the list
        const profiles = await Promise.all(
          friendsList.slice(0, 48).map(uid =>
            WR.getDb().collection("users").doc(uid).get()
          )
        );

        const friends = profiles
          .filter(s => s.exists)
          .map(s => ({ uid: s.id, ...s.data() }));

        // Get current user's own friendsList for mutual detection
        const myFriendsList = isOwnProfile
          ? (profileData.friendsList || [])
          : (WR.getCurrentUser()._profile?.friendsList || []);

        const myUid = WR.getCurrentUser().uid;

        el.innerHTML = `
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:12px;margin-bottom:0.5rem;">
            ${friends.map(f => {
              const isMutual = !isOwnProfile && myFriendsList.includes(f.uid);
              const isMe     = f.uid === myUid;
              const isAlreadyFriend = myFriendsList.includes(f.uid);

              return `
                <div style="text-align:center;">
                  <a href="profile.html?uid=${f.uid}" style="text-decoration:none;">
                    ${f.photoURL
                      ? `<img src="${WR.escapeHTML(f.photoURL)}" style="width:52px;height:52px;border-radius:50%;object-fit:cover;margin:0 auto 5px;display:block;border:2px solid ${isMutual ? "var(--amethyst)" : "var(--border)"};">`
                      : `<div style="width:52px;height:52px;border-radius:50%;background:var(--lavender-mist);border:2px solid ${isMutual ? "var(--amethyst)" : "var(--border)"};display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 5px;">👤</div>`}
                    <div style="font-size:10px;color:var(--deep-plum);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${WR.escapeHTML(f.displayName || "")}</div>
                    ${isMutual ? `<div style="font-size:9px;color:var(--amethyst);margin-top:2px;font-weight:600;">Mutual</div>` : ""}
                  </a>
                  ${!isOwnProfile && !isMe && !isAlreadyFriend ? `
                    <button onclick="addFriendFromList('${f.uid}')" id="add-btn-${f.uid}"
                      style="font-family:'Nunito Sans',sans-serif;font-size:10px;font-weight:600;padding:3px 8px;border-radius:6px;border:1px solid var(--amethyst);background:#fff;color:var(--amethyst);cursor:pointer;margin-top:4px;">
                      + Add
                    </button>` : ""}
                </div>`;
            }).join("")}
          </div>`;
      } catch (e) {
        console.error("Load friends list error:", e);
        if (el) el.innerHTML = `<p style="font-size:13px;color:var(--terracotta);text-align:center;">Couldn't load friends list.</p>`;
      }
    }

    async function addFriendFromList(targetUid) {
      const btn = document.getElementById(`add-btn-${targetUid}`);
      if (btn) { btn.textContent = "Sent!"; btn.disabled = true; btn.style.color = "#BDB5CC"; btn.style.borderColor = "#BDB5CC"; }
      try {
        const myUid   = WR.getCurrentUser().uid;
        const fid     = WR.getFriendshipId(myUid, targetUid);
        await WR.getDb().collection("friends").doc(fid).set({
          users:     [myUid, targetUid],
          status:    "pending",
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          createdBy: myUid
        });
        await WR.createNotification(targetUid, {
          type:    "friend_request",
          title:   "New friend request",
          body:    `${WR.getCurrentUser()._profile?.displayName || "Someone"} wants to be your friend.`,
          linkedId: fid
        });
        WR.showToast("Friend request sent! 🤝", "success");
      } catch (e) {
        console.error("Add friend error:", e);
        WR.showToast("Error sending request.", "error");
        if (btn) { btn.textContent = "+ Add"; btn.disabled = false; }
      }
    }

    // ── Auto-migration: build friendsList from friends collection ──
    async function migrateFriendsListIfNeeded() {
      const user = WR.getCurrentUser();
      if (!user || !isOwnProfile) return;
      if (profileData.friendsList !== undefined) return; // already migrated

      try {
        const snap = await WR.getDb()
          .collection("friends")
          .where("users", "array-contains", user.uid)
          .get();

        const acceptedUids = snap.docs
          .filter(d => d.data().status === "accepted")
          .map(d => d.data().users.find(u => u !== user.uid))
          .filter(Boolean);

        // Write friendsList to user doc (even if empty, so we don't re-run)
        await WR.getDb().collection("users").doc(user.uid).set(
          { friendsList: acceptedUids },
          { merge: true }
        );

        profileData.friendsList = acceptedUids;
        console.log(`Migrated friendsList: ${acceptedUids.length} friends`);

        // Refresh the friend count stat in the UI
        const statEl = document.querySelector(".stat-num[data-stat='friends']");
        if (statEl) statEl.textContent = acceptedUids.length;
      } catch (e) {
        console.error("friendsList migration error:", e);
      }
    }

    function buildGoalSection(profile) {
      const now       = new Date();
      const thisMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
      const monthName = now.toLocaleString("default", { month: "long", year: "numeric" });
      const goal      = profile?.monthlyGoal;
      const history   = profile?.goalHistory || {};

      // Current month goal status
      const hasGoal       = goal?.month === thisMonth && goal?.target;
      const booksThisMonth = hasGoal ? countProfileBooksThisMonth(thisMonth) : 0;
      const pct           = hasGoal ? Math.min(100, Math.round((booksThisMonth / goal.target) * 100)) : 0;

      const currentGoalHTML = `
        <div style="background:var(--lavender-mist);border-radius:10px;padding:1rem;margin-bottom:1rem;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
            <span style="font-size:13px;font-weight:600;color:var(--deep-plum);">${monthName}</span>
            ${hasGoal
              ? `<span style="font-size:12px;color:var(--terracotta);">${booksThisMonth} of ${goal.target} books</span>`
              : `<span style="font-size:12px;color:#BDB5CC;">No goal set</span>`}
          </div>
          ${hasGoal ? `
          <div style="background:var(--border);border-radius:4px;height:8px;overflow:hidden;margin-bottom:6px;">
            <div style="height:100%;width:${pct}%;background:${pct >= 100 ? "var(--faded-moss)" : "var(--amethyst)"};border-radius:4px;transition:width 0.4s;"></div>
          </div>
          <div style="font-size:11px;color:var(--terracotta);">
            ${pct >= 100 ? (booksThisMonth > goal.target ? "🏆 Goal surpassed!" : "🎉 Goal complete!") : `${pct}% complete`}
          </div>` : ""}
          <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
            <button onclick="openProfileGoalModal()" style="font-family:'Nunito Sans',sans-serif;font-size:12px;font-weight:600;padding:6px 14px;border-radius:7px;border:none;background:var(--amethyst);color:#FAF6EE;cursor:pointer;">
              ${hasGoal ? "✏️ Edit Goal" : "🎯 Set Goal"}
            </button>
            <button onclick="location.href='share.html'" style="font-family:'Nunito Sans',sans-serif;font-size:12px;font-weight:700;padding:6px 14px;border-radius:7px;border:1.5px solid var(--border);background:#fff;color:var(--amethyst);cursor:pointer;">
              📸 Share Reads
            </button>
          </div>
        </div>`;

      // History sorted newest first
      const historyEntries = Object.entries(history)
        .sort((a, b) => b[0].localeCompare(a[0]))
        .slice(0, 24); // show up to 24 months

      const historyHTML = historyEntries.length ? `
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${historyEntries.map(([month, entry]) => {
            const [year, mo] = month.split("-");
            const label = new Date(year, parseInt(mo) - 1, 1)
              .toLocaleString("default", { month: "long", year: "numeric" });
            const pctH  = Math.min(100, Math.round((entry.booksRead / entry.target) * 100));
            const color = entry.surpassed ? "var(--warm-gold)" : entry.met ? "var(--faded-moss)" : "var(--border)";
            return `
              <div style="background:var(--lavender-mist);border-radius:8px;padding:10px 12px;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
                  <span style="font-size:12px;font-weight:600;color:var(--deep-plum);">${label}</span>
                  <span style="font-size:11px;color:var(--terracotta);">${entry.booksRead} of ${entry.target} books ${entry.surpassed ? "🏆" : entry.met ? "🎉" : ""}</span>
                </div>
                <div style="background:var(--border);border-radius:4px;height:6px;overflow:hidden;">
                  <div style="height:100%;width:${pctH}%;background:${color};border-radius:4px;"></div>
                </div>
              </div>`;
          }).join("")}
        </div>` : `<p style="font-size:13px;color:#BDB5CC;text-align:center;padding:0.5rem;">No reading history yet. Complete a month to see it here.</p>`;

      return `
        <div class="profile-section">
          <div class="section-toggle" onclick="toggleSection('goals', this)">
            <span class="section-title">🎯 Reading Goals</span>
            <span class="section-arrow">▼</span>
          </div>
          <div class="section-body" id="goals-body">
            ${currentGoalHTML}
            ${historyEntries.length ? `
            <p style="font-size:11px;font-weight:600;color:var(--terracotta);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">Past Goals</p>
            ${historyHTML}` : historyHTML}
          </div>
        </div>`;
    }

    function buildBadgesSection(profile, isOwn) {
      const badges  = profile?.badges || [];
      const earned  = badges.filter(b => b.id);

      // On other profiles — hide the section entirely if no badges
      if (!earned.length && !isOwn) return "";

      const count    = earned.length;
      const total    = Object.keys(WR.BADGE_DEFS).length;

      // On own profile with no badges — show empty state
      if (!count && isOwn) {
        return `
          <div class="profile-section">
            <div class="section-toggle" onclick="toggleSection('badges', this)">
              <span class="section-title">🏅 Earned Badges</span>
              <span class="section-arrow">▼</span>
            </div>
            <div class="section-body" id="badges-body">
              <div style="text-align:center;padding:1.25rem;">
                <p style="font-size:13px;color:#BDB5CC;margin-bottom:4px;">No badges earned yet — keep reading!</p>
                <p style="font-size:12px;color:#BDB5CC;">Badges are earned by completing books, writing reviews, meeting goals, and more.</p>
              </div>
            </div>
          </div>`;
      }

      // Show only earned badges — no greyed-out silhouettes
      const gridHTML = WR.buildBadgeGrid(earned);

      return `
        <div class="profile-section">
          <div class="section-toggle" onclick="toggleSection('badges', this)">
            <span class="section-title">🏅 Earned Badges
              <span style="font-size:12px;font-family:'Nunito Sans';font-weight:600;background:var(--lavender-mist);color:var(--amethyst);padding:2px 8px;border-radius:10px;margin-left:4px;">${count}</span>

            <span class="section-arrow">▼</span>
          </div>
          <div class="section-body" id="badges-body">
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;">
              ${gridHTML}
            </div>
            ${isOwn ? `<p style="font-size:11px;color:#BDB5CC;text-align:center;margin-top:10px;">${count} of ${total} badges earned</p>` : ""}
          </div>
        </div>`;
    }

    function countProfileBooksThisMonth(monthKey) {
      // Count from userBooks which is already loaded
      let count = 0;
      userBooks.forEach(b => {
        (b.readingSessions || []).forEach(s => {
          if (s.completed && s.endDate && s.endDate.startsWith(monthKey)) count++;
        });
      });
      return count;
    }

      bluesky: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="24" height="24" rx="6" fill="#0085FF"/>
        <path d="M12 10.4C11.04 8.88 8.4 6.08 6 5.28C4.08 4.64 3.5 5.92 3.5 7.04C3.5 8.16 3.98 10.08 4.24 10.88C5.04 13.36 7.6 14.08 10.08 13.6C9.84 13.68 9.6 13.84 9.36 13.92C7.36 14.72 4.48 16 5.76 18.64C6.56 20.24 9.04 19.92 10.64 18.72C11.44 18.16 11.84 17.6 12 17.04C12.16 17.6 12.56 18.16 13.36 18.72C14.96 19.92 17.44 20.24 18.24 18.64C19.52 16 16.64 14.72 14.64 13.92C14.4 13.84 14.16 13.68 13.92 13.6C16.4 14.08 18.96 13.36 19.76 10.88C20.02 10.08 20.5 8.16 20.5 7.04C20.5 5.92 19.92 4.64 18 5.28C15.6 6.08 12.96 8.88 12 10.4Z" fill="#fff"/>
      </svg>`
    };

    function buildSocialLinks() {
      const links = profileData.socialLinks || {};
      const items = [];
      if (links.instagram) items.push({ key: "instagram", label: "Instagram", href: `https://instagram.com/${links.instagram.replace("@","")}` });
      if (links.facebook)  items.push({ key: "facebook",  label: "Facebook",  href: links.facebook.startsWith("http") ? links.facebook : `https://facebook.com/${links.facebook}` });
      if (links.x)         items.push({ key: "x",         label: "X",         href: `https://x.com/${links.x.replace("@","")}` });
      if (links.bluesky)   items.push({ key: "bluesky",   label: "Bluesky",   href: `https://bsky.app/profile/${links.bluesky.replace("@","")}` });
      if (!items.length) return "";
      return `<div class="social-links">${items.map(i =>
        `<a class="social-link" href="${WR.escapeHTML(i.href)}" target="_blank" rel="noopener">
          ${SOCIAL_SVGS[i.key] || ""} ${i.label}
        </a>`
      ).join("")}</div>`;
    }

    function buildActionButtons() {
      if (isOwnProfile) {
        return `
          <a class="profile-btn btn-settings" href="settings.html">⚙️ Edit Profile</a>
          <a class="profile-btn btn-secondary" href="library.html?tab=wishlist">⭐ My Wishlist</a>`;
      }

      let friendBtn = "";
      if (friendStatus === "accepted") {
        friendBtn = `<button class="profile-btn btn-moss" onclick="sendMessage()">✉️ Message</button>
                     <button class="profile-btn btn-secondary" onclick="removeFriend()">Remove Friend</button>`;
      } else if (friendStatus === "pending") {
        friendBtn = `<button class="profile-btn btn-pending" disabled>⏳ Request Sent</button>`;
      } else {
        friendBtn = `<button class="profile-btn btn-primary" onclick="sendFriendRequest()">👤 Add Friend</button>`;
      }

      return friendBtn;
    }

    // ── Friend Actions ────────────────────────────────────────
    async function sendFriendRequest() {
      const currentUser = WR.getCurrentUser();
      try {
        await WR.getDb().collection("friends").doc(friendshipId).set({
          users:        [currentUser.uid, profileUid],
          initiatorUid: currentUser.uid,
          status:       "pending",
          createdAt:    firebase.firestore.FieldValue.serverTimestamp(),
          acceptedAt:   null
        });

        await WR.createNotification(profileUid, {
          type:     "friend_request",
          title:    "New Friend Request",
          body:     `${currentUser._profile?.displayName || "Someone"} wants to be your friend on WellRead Co.`,
          linkedId: friendshipId
        });

        friendStatus = "pending";
        document.querySelector(".profile-actions").innerHTML = buildActionButtons();
        WR.showToast("Friend request sent!", "success");

        // Send email notification if they have it enabled (fire and forget)
        try {
          const theirSnap = await WR.getDb().collection("users").doc(profileUid).get();
          const them      = theirSnap.data();
          if (them?.emailPreferences?.friendRequest !== false && them?.email) {
            WR.callWorker("send_friend_request_email", {
              to:            them.email,
              recipientName: them.displayName,
              requesterName: currentUser._profile?.displayName || "Someone"
            });
          }
        } catch (emailErr) {
          console.error("Friend request email error:", emailErr);
        }
      } catch (e) {
        console.error("Friend request error:", e);
        WR.showToast("Error sending friend request.", "error");
      }
    }

    async function removeFriend() {
      if (!confirm("Remove this friend?")) return;
      try {
        const user = WR.getCurrentUser();
        await WR.getDb().collection("friends").doc(friendshipId).delete();

        // Remove each other from friendsList and decrement count
        await Promise.all([
          WR.getDb().collection("users").doc(user.uid).set({
            friendsList: firebase.firestore.FieldValue.arrayRemove(profileUid),
            friendCount: firebase.firestore.FieldValue.increment(-1)
          }, { merge: true }),
          WR.getDb().collection("users").doc(profileUid).set({
            friendsList: firebase.firestore.FieldValue.arrayRemove(user.uid),
            friendCount: firebase.firestore.FieldValue.increment(-1)
          }, { merge: true })
        ]);

        friendStatus = null;
        document.querySelector(".profile-actions").innerHTML = buildActionButtons();
        WR.showToast("Friend removed.");
      } catch (e) {
        WR.showToast("Error removing friend.", "error");
      }
    }

    function sendMessage() {
      location.href = `messages.html?uid=${profileUid}`;
    }

    // ── Section Toggle ────────────────────────────────────────
    function toggleSection(id, toggle) {
      const body = document.getElementById(id + "-body");
      if (!body) return;
      const isOpen = body.classList.contains("open");
      toggle.classList.toggle("open", !isOpen);
      body.classList.toggle("open", !isOpen);
    }

    // ── Not Found ─────────────────────────────────────────────
    function showNotFound() {
      document.getElementById("pageWrap").innerHTML = `
        <div class="not-found">
          <span class="not-found-icon">👤</span>
          <h2 class="not-found-title">Profile not found</h2>
          <p class="not-found-desc">This user doesn't exist or their profile is unavailable.</p>
        </div>`;
    }

    // ── Profile Goal Modal ────────────────────────────────────
    function openProfileGoalModal() {
      const now       = new Date();
      const thisMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
      const monthName = now.toLocaleString("default", { month: "long" });
      const goal      = profileData?.monthlyGoal;

      document.getElementById("profileGoalModalDesc").textContent =
        `How many books do you want to read in ${monthName}?`;
      document.getElementById("profileGoalInput").value =
        (goal?.month === thisMonth ? goal.target : 4);

      const modal = document.getElementById("profileGoalModal");
      modal.style.display = "flex";
      document.body.style.overflow = "hidden";
    }

    function closeProfileGoalModal() {
      document.getElementById("profileGoalModal").style.display = "none";
      document.body.style.overflow = "";
    }

    function adjustProfileGoal(delta) {
      const input = document.getElementById("profileGoalInput");
      input.value = Math.max(1, Math.min(100, parseInt(input.value || "4") + delta));
    }

    async function saveProfileGoal() {
      const user   = WR.getCurrentUser();
      const target = parseInt(document.getElementById("profileGoalInput").value);
      if (!target || target < 1) return;

      const now       = new Date();
      const thisMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;

      try {
        await WR.getDb().collection("users").doc(user.uid).set({
          monthlyGoal: { month: thisMonth, target, achieved: false }
        }, { merge: true });

        if (profileData) profileData.monthlyGoal = { month: thisMonth, target, achieved: false };
        closeProfileGoalModal();
        WR.showToast(`Goal set: ${target} books this month! 🎯`, "success");
        renderPage();
      } catch (e) {
        console.error("Profile goal save error:", e);
        WR.showToast("Error saving goal.", "error");
      }
    }

    window.toggleSection        = toggleSection;
    window.sendFriendRequest    = sendFriendRequest;
    window.addFriendFromList    = addFriendFromList;
    window.openProfileGoalModal  = openProfileGoalModal;
    window.closeProfileGoalModal = closeProfileGoalModal;
    window.adjustProfileGoal     = adjustProfileGoal;
    window.saveProfileGoal       = saveProfileGoal;
    window.countProfileBooksThisMonth = countProfileBooksThisMonth;
    window.removeFriend      = removeFriend;
    window.sendMessage       = sendMessage;
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>

</body>
</html>
