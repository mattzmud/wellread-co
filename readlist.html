<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WellRead Co. — My Read List</title>
  <meta name="theme-color" content="#2D1B4E">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon-96x96.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --lavender-mist: #F7F3FF;
      --aged-paper:    #FAF6EE;
      --deep-plum:     #2D1B4E;
      --amethyst:      #7B5EA7;
      --faded-moss:    #9DC4B0;
      --warm-gold:     #C9A84C;
      --terracotta:    #A0674A;
      --border:        #E8DFC8;
    }

    html, body {
      min-height: 100%;
      font-family: 'Nunito Sans', sans-serif;
      background: var(--lavender-mist);
      color: var(--deep-plum);
    }

    .page-wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1.25rem 6rem;
    }

    /* ── Header ── */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--deep-plum);
      margin-bottom: 0.25rem;
    }

    .page-subtitle { font-size: 14px; color: var(--terracotta); }

    .header-btn {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: var(--amethyst);
      color: #FAF6EE;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .header-btn:hover { opacity: 0.85; }

    /* ── Stats Bar ── */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 1rem;
      text-align: center;
    }

    .stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: var(--amethyst);
      display: block;
    }

    .stat-label { font-size: 12px; color: var(--terracotta); margin-top: 2px; }

    /* ── Controls ── */
    .controls-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .sort-select {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--deep-plum);
      cursor: pointer;
      outline: none;
    }

    .sort-select:focus { border-color: var(--amethyst); }

    .filter-pill {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: #fff;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--terracotta);
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-pill:hover  { border-color: var(--amethyst); color: var(--amethyst); }
    .filter-pill.active { background: var(--amethyst); border-color: var(--amethyst); color: #FAF6EE; }

    /* ── Book Cards ── */
    .books-list { display: flex; flex-direction: column; gap: 14px; }

    .book-card {
      background: #fff;
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow: hidden;
      transition: box-shadow 0.15s;
    }

    .book-card:hover { box-shadow: 0 4px 16px rgba(45,27,78,0.08); }

    .card-main {
      display: flex;
      gap: 14px;
      padding: 1rem;
      align-items: flex-start;
    }

    .book-cover-img {
      width: 72px;
      height: 104px;
      object-fit: cover;
      border-radius: 6px;
      box-shadow: 2px 3px 10px rgba(45,27,78,0.16);
      flex-shrink: 0;
      display: block;
    }

    .book-cover-placeholder {
      width: 72px;
      height: 104px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--amethyst), #4A2D7A);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      flex-shrink: 0;
    }

    .card-info { flex: 1; min-width: 0; }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      color: var(--deep-plum);
      margin-bottom: 3px;
      line-height: 1.3;
      cursor: pointer;
      text-decoration: none;
      display: block;
    }

    .card-title:hover { color: var(--amethyst); }

    .card-author { font-size: 13px; color: var(--terracotta); margin-bottom: 6px; }

    .card-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-bottom: 8px;
    }

    .card-meta-item { font-size: 12px; color: #BDB5CC; }
    .card-meta-item strong { color: var(--deep-plum); }

    .card-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }

    .status-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .badge-completed { background: #DCF0E8; color: #2E6B50; }
    .badge-reading   { background: #EDE4F7; color: #5B3E8A; }
    .badge-dnf       { background: #FCE8E8; color: #8B2020; }
    .badge-listened  { background: #FEF3CD; color: #8B6914; }
    .badge-library   { background: #E8F0FE; color: #1A4A8A; }

    .card-stars { font-size: 15px; color: var(--warm-gold); }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .card-btn {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .card-btn:hover  { opacity: 0.8; }
    .card-btn-expand { background: var(--lavender-mist); color: var(--amethyst); }
    .card-btn-view   { background: var(--aged-paper); color: var(--terracotta); border: 1px solid var(--border); }

    /* ── Collapsible Review ── */
    .card-review-section {
      border-top: 1px solid var(--border);
      padding: 1rem;
      display: none;
      background: var(--lavender-mist);
    }

    .card-review-section.open { display: block; }

    .review-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--terracotta);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
    }

    .review-text {
      font-size: 13px;
      line-height: 1.7;
      color: var(--deep-plum);
      font-style: italic;
    }

    .no-review-text {
      font-size: 13px;
      color: #BDB5CC;
    }

    /* ── Empty ── */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
    }

    .empty-icon  { font-size: 56px; margin-bottom: 1rem; display: block; }
    .empty-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--deep-plum); margin-bottom: 0.5rem; }
    .empty-desc  { font-size: 14px; color: var(--terracotta); margin-bottom: 1.5rem; line-height: 1.6; }
    .empty-btn   {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 11px 22px;
      background: var(--amethyst);
      color: #FAF6EE;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .empty-btn:hover { opacity: 0.85; }

    /* ── Skeleton ── */
    .skeleton-list { display: flex; flex-direction: column; gap: 14px; }
    .skeleton-card { background: #fff; border-radius: 14px; border: 1px solid var(--border); padding: 1rem; display: flex; gap: 14px; }
    .skeleton-cover { width: 72px; height: 104px; border-radius: 6px; background: linear-gradient(90deg,#ede8f5 25%,#e0d8ef 50%,#ede8f5 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; flex-shrink: 0; }
    .skeleton-lines { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
    .skeleton-line  { height: 12px; border-radius: 6px; background: linear-gradient(90deg,#ede8f5 25%,#e0d8ef 50%,#ede8f5 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    @media (max-width: 768px) {
      .page-header { flex-direction: column; }
    }
  </style>
</head>
<body>

  <div class="page-wrap">

    <div class="page-header">
      <div>
        <h1 class="page-title">✅ My Read List</h1>
        <p class="page-subtitle" id="readSubtitle">Books I've read</p>
      </div>
      <a href="search.html" class="header-btn">+ Add a Book</a>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <span class="stat-num" id="statTotal">—</span>
        <span class="stat-label">Total Read</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statThisYear">—</span>
        <span class="stat-label">This Year</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statDNF">—</span>
        <span class="stat-label">Did Not Finish</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statAvgRating">—</span>
        <span class="stat-label">Avg Rating</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-bar">
      <select class="sort-select" id="sortSelect" onchange="applyFilters()">
        <option value="dateCompleted-desc">Recently Finished</option>
        <option value="dateCompleted-asc">Oldest First</option>
        <option value="title-asc">Title A–Z</option>
        <option value="author-asc">Author A–Z</option>
        <option value="rating-desc">Highest Rated</option>
      </select>
      <button class="filter-pill active" id="pill-all"  onclick="setFilter('all')">All</button>
      <button class="filter-pill"        id="pill-dnf"  onclick="setFilter('dnf')">DNF Only</button>
      <button class="filter-pill"        id="pill-read" onclick="setFilter('read')">Completed</button>
    </div>

    <!-- Books -->
    <div id="booksArea">
      <div class="skeleton-list">
        <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-lines"><div class="skeleton-line" style="width:70%;height:18px;"></div><div class="skeleton-line" style="width:45%"></div><div class="skeleton-line" style="width:55%"></div><div class="skeleton-line" style="width:35%"></div></div></div>
        <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-lines"><div class="skeleton-line" style="width:80%;height:18px;"></div><div class="skeleton-line" style="width:50%"></div><div class="skeleton-line" style="width:60%"></div><div class="skeleton-line" style="width:40%"></div></div></div>
        <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-lines"><div class="skeleton-line" style="width:65%;height:18px;"></div><div class="skeleton-line" style="width:40%"></div><div class="skeleton-line" style="width:50%"></div><div class="skeleton-line" style="width:30%"></div></div></div>
        <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-lines"><div class="skeleton-line" style="width:75%;height:18px;"></div><div class="skeleton-line" style="width:55%"></div><div class="skeleton-line" style="width:45%"></div><div class="skeleton-line" style="width:38%"></div></div></div>
      </div>
    </div>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <script src="common.js"></script>

  <script>
    let allBooks     = [];
    let activeFilter = "all";

    WR.initAuth(async (user) => {
      if (!user) return;
      await loadReadList();
    });

    async function loadReadList() {
      const user = WR.getCurrentUser();
      try {
        const snap = await WR.getDb()
          .collection("users").doc(user.uid)
          .collection("books")
          .where("onReadList", "==", true)
          .get();
        allBooks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderStats();
        applyFilters();
      } catch (e) {
        console.error("Error loading read list:", e);
        WR.showToast("Error loading your read list.", "error");
      }
    }

    function renderStats() {
      const total    = allBooks.length;
      const thisYear = allBooks.filter(b => {
        const end = b.readingSessions?.[0]?.endDate;
        return end && new Date(end).getFullYear() === new Date().getFullYear();
      }).length;
      const dnf = allBooks.filter(b => b.readingSessions?.[0]?.dnf).length;
      const ratings = allBooks
        .map(b => b.readingSessions?.[0]?.rating)
        .filter(r => r && r > 0);
      const avg = ratings.length
        ? (ratings.reduce((a, b) => a + b, 0) / ratings.length).toFixed(1)
        : "—";

      document.getElementById("statTotal").textContent    = total;
      document.getElementById("statThisYear").textContent = thisYear;
      document.getElementById("statDNF").textContent      = dnf;
      document.getElementById("statAvgRating").textContent = avg !== "—" ? "★ " + avg : "—";
      document.getElementById("readSubtitle").textContent =
        `${total} book${total === 1 ? "" : "s"} read`;
    }

    function setFilter(filter) {
      activeFilter = filter;
      document.querySelectorAll(".filter-pill").forEach(p => p.classList.remove("active"));
      document.getElementById("pill-" + filter).classList.add("active");
      applyFilters();
    }

    function applyFilters() {
      const sort = document.getElementById("sortSelect").value;
      let books  = [...allBooks];

      if (activeFilter === "dnf")  books = books.filter(b => b.readingSessions?.[0]?.dnf);
      if (activeFilter === "read") books = books.filter(b => b.readingSessions?.[0]?.completed);

      const [field, dir] = sort.split("-");
      books.sort((a, b) => {
        const sa = a.readingSessions?.[0] || {};
        const sb = b.readingSessions?.[0] || {};

        if (field === "dateCompleted") {
          const av = sa.endDate || "";
          const bv = sb.endDate || "";
          return dir === "desc" ? bv.localeCompare(av) : av.localeCompare(bv);
        }
        if (field === "rating") {
          return dir === "desc" ? (sb.rating || 0) - (sa.rating || 0) : (sa.rating || 0) - (sb.rating || 0);
        }
        if (field === "title") {
          const av = (a.title || "").toLowerCase();
          const bv = (b.title || "").toLowerCase();
          return dir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
        }
        if (field === "author") {
          const av = (a.author || "").toLowerCase();
          const bv = (b.author || "").toLowerCase();
          return av.localeCompare(bv);
        }
        return 0;
      });

      renderBooks(books);
    }

    function renderBooks(books) {
      const area = document.getElementById("booksArea");

      if (!books.length) {
        area.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">📖</span>
            <h2 class="empty-title">${activeFilter === "all" ? "No books read yet" : "No books match this filter"}</h2>
            <p class="empty-desc">${activeFilter === "all"
              ? "Start tracking your reading by marking books as read."
              : "Try a different filter."}</p>
            ${activeFilter === "all" ? `<a href="search.html" class="empty-btn">🔍 Find a Book</a>` : ""}
          </div>`;
        return;
      }

      area.innerHTML = `<div class="books-list">${books.map(b => buildCard(b)).join("")}</div>`;
    }

    function buildCard(book) {
      const session   = book.readingSessions?.[0] || {};
      const cover     = book.coverURL
        ? `<img class="book-cover-img" src="${WR.escapeHTML(book.coverURL)}" alt=""
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : "";
      const placeholder = `<div class="book-cover-placeholder" ${book.coverURL ? 'style="display:none"' : ""}>📖</div>`;

      // Badges
      let badges = "";
      if (session.completed)             badges += `<span class="status-badge badge-completed">Completed</span>`;
      if (session.dnf)                   badges += `<span class="status-badge badge-dnf">DNF</span>`;
      if (session.format === "listened") badges += `<span class="status-badge badge-listened">Audiobook</span>`;
      if (book.inLibrary)                badges += `<span class="status-badge badge-library">In Library</span>`;

      // Rating stars
      const stars = session.rating
        ? `<div class="card-stars">${"★".repeat(session.rating)}${"☆".repeat(5 - session.rating)}</div>`
        : "";

      // Dates
      const metaItems = [];
      if (session.startDate) metaItems.push(`<span class="card-meta-item">Started <strong>${WR.formatDateInput(session.startDate)}</strong></span>`);
      if (session.endDate)   metaItems.push(`<span class="card-meta-item">Finished <strong>${WR.formatDateInput(session.endDate)}</strong></span>`);
      if (book.isbn)         metaItems.push(`<span class="card-meta-item">ISBN <strong>${WR.escapeHTML(book.isbn)}</strong></span>`);

      const cardId = "card-" + book.id.replace(/[^a-z0-9]/gi, "");

      return `
        <div class="book-card" id="${cardId}">
          <div class="card-main">
            ${cover}${placeholder}
            <div class="card-info">
              <a class="card-title" href="book.html?id=${encodeURIComponent(book.id)}">${WR.escapeHTML(book.title || "")}</a>
              <div class="card-author">${WR.escapeHTML(book.author || "")}</div>
              ${metaItems.length ? `<div class="card-meta-row">${metaItems.join("")}</div>` : ""}
              ${badges ? `<div class="card-badges">${badges}</div>` : ""}
              ${stars}
              <div class="card-actions">
                <button class="card-btn card-btn-expand" onclick="toggleReview('${cardId}')">
                  ${session.review ? "📝 My Review" : "📝 Notes"}
                </button>
                <button class="card-btn card-btn-view" onclick="location.href='book.html?id=${encodeURIComponent(book.id)}'">
                  View Book →
                </button>
              </div>
            </div>
          </div>
          <div class="card-review-section" id="${cardId}-review">
            <p class="review-label">My Review</p>
            ${session.review
              ? `<p class="review-text">"${WR.escapeHTML(session.review)}"</p>`
              : `<p class="no-review-text">No review written yet. <a href="book.html?id=${encodeURIComponent(book.id)}" style="color:var(--amethyst);">Add one on the book page →</a></p>`}
          </div>
        </div>`;
    }

    function toggleReview(cardId) {
      const section = document.getElementById(cardId + "-review");
      if (section) section.classList.toggle("open");
    }

    window.setFilter     = setFilter;
    window.applyFilters  = applyFilters;
    window.toggleReview  = toggleReview;
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>

</body>
</html>
