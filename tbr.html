<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WellRead Co. — To Be Read</title>
  <meta name="theme-color" content="#2D1B4E">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon-96x96.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --lavender-mist: #F7F3FF;
      --aged-paper:    #FAF6EE;
      --deep-plum:     #2D1B4E;
      --amethyst:      #7B5EA7;
      --faded-moss:    #9DC4B0;
      --warm-gold:     #C9A84C;
      --terracotta:    #A0674A;
      --border:        #E8DFC8;
    }

    html, body {
      min-height: 100%;
      font-family: 'Nunito Sans', sans-serif;
      background: var(--lavender-mist);
      color: var(--deep-plum);
    }

    .page-wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1.25rem 6rem;
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .page-title { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; color: var(--deep-plum); margin-bottom: 0.25rem; }
    .page-subtitle { font-size: 14px; color: var(--terracotta); }

    .header-btn {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: var(--warm-gold);
      color: #FAF6EE;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .header-btn:hover { opacity: 0.85; }

    /* ── Filter Pills ── */
    .filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .filter-pill {
      padding: 7px 16px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: #fff;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--terracotta);
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-pill:hover  { border-color: var(--warm-gold); color: var(--warm-gold); }
    .filter-pill.active { background: var(--warm-gold); border-color: var(--warm-gold); color: #FAF6EE; }

    /* ── TBR Cards ── */
    .tbr-list { display: flex; flex-direction: column; gap: 10px; }

    .tbr-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 1rem;
      display: flex;
      gap: 14px;
      align-items: center;
      transition: box-shadow 0.15s;
    }

    .tbr-card:hover { box-shadow: 0 3px 14px rgba(45,27,78,0.07); }

    .book-cover-img {
      width: 56px;
      height: 80px;
      object-fit: cover;
      border-radius: 4px;
      box-shadow: 1px 2px 8px rgba(45,27,78,0.14);
      flex-shrink: 0;
      display: block;
    }

    .book-cover-placeholder {
      width: 56px;
      height: 80px;
      border-radius: 4px;
      background: linear-gradient(135deg, var(--warm-gold), #A07820);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .tbr-info { flex: 1; min-width: 0; }

    .tbr-title {
      font-family: 'Playfair Display', serif;
      font-size: 15px;
      color: var(--deep-plum);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-decoration: none;
      display: block;
      cursor: pointer;
    }

    .tbr-title:hover { color: var(--amethyst); }

    .tbr-author { font-size: 12px; color: var(--terracotta); margin-bottom: 6px; }

    .tbr-flags { display: flex; flex-wrap: wrap; gap: 4px; }

    .flag-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .flag-acquire  { background: #FEF3CD; color: #8B6914; }
    .flag-library  { background: #DCF0E8; color: #2E6B50; }

    .tbr-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .tbr-btn {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    .tbr-btn:hover { opacity: 0.8; }
    .tbr-btn-start  { background: var(--amethyst); color: #FAF6EE; }
    .tbr-btn-remove { background: var(--aged-paper); color: var(--terracotta); border: 1px solid var(--border); }

    /* ── Empty ── */
    .empty-state { text-align: center; padding: 4rem 2rem; }
    .empty-icon  { font-size: 56px; margin-bottom: 1rem; display: block; }
    .empty-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--deep-plum); margin-bottom: 0.5rem; }
    .empty-desc  { font-size: 14px; color: var(--terracotta); margin-bottom: 1.5rem; line-height: 1.6; }
    .empty-btn   {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: 'Nunito Sans', sans-serif; font-size: 14px; font-weight: 600;
      padding: 11px 22px; background: var(--warm-gold); color: #FAF6EE;
      border: none; border-radius: 8px; cursor: pointer; text-decoration: none; transition: opacity 0.15s;
    }
    .empty-btn:hover { opacity: 0.85; }

    /* ── Skeleton ── */
    .skeleton-list { display: flex; flex-direction: column; gap: 10px; }
    .skeleton-card { background: #fff; border-radius: 12px; border: 1px solid var(--border); padding: 1rem; display: flex; gap: 14px; align-items: center; }
    .skeleton-cover { width: 56px; height: 80px; border-radius: 4px; background: linear-gradient(90deg,#ede8f5 25%,#e0d8ef 50%,#ede8f5 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; flex-shrink: 0; }
    .skeleton-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .skeleton-line  { height: 11px; border-radius: 6px; background: linear-gradient(90deg,#ede8f5 25%,#e0d8ef 50%,#ede8f5 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    @media (max-width: 600px) {
      .tbr-card    { flex-wrap: wrap; }
      .tbr-actions { flex-direction: row; width: 100%; }
    }
  </style>
</head>
<body>

  <div class="page-wrap">

    <div class="page-header">
      <div>
        <h1 class="page-title">🔖 To Be Read</h1>
        <p class="page-subtitle" id="tbrSubtitle">Books I plan to read</p>
      </div>
      <a href="search.html" class="header-btn">+ Add a Book</a>
    </div>

    <div class="filter-row">
      <button class="filter-pill active" id="pill-all"      onclick="setFilter('all')">All</button>
      <button class="filter-pill"        id="pill-owned"    onclick="setFilter('owned')">In My Library</button>
      <button class="filter-pill"        id="pill-acquire"  onclick="setFilter('acquire')">Need to Acquire</button>
    </div>

    <div id="booksArea">
      <div class="skeleton-list">
        <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-lines"><div class="skeleton-line" style="width:65%;height:15px;"></div><div class="skeleton-line" style="width:40%"></div><div class="skeleton-line" style="width:30%"></div></div></div>
        <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-lines"><div class="skeleton-line" style="width:75%;height:15px;"></div><div class="skeleton-line" style="width:50%"></div><div class="skeleton-line" style="width:35%"></div></div></div>
        <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-lines"><div class="skeleton-line" style="width:60%;height:15px;"></div><div class="skeleton-line" style="width:45%"></div><div class="skeleton-line" style="width:28%"></div></div></div>
        <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-lines"><div class="skeleton-line" style="width:80%;height:15px;"></div><div class="skeleton-line" style="width:38%"></div><div class="skeleton-line" style="width:32%"></div></div></div>
        <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-lines"><div class="skeleton-line" style="width:70%;height:15px;"></div><div class="skeleton-line" style="width:42%"></div><div class="skeleton-line" style="width:26%"></div></div></div>
      </div>
    </div>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <script src="common.js"></script>

  <script>
    let allBooks     = [];
    let activeFilter = "all";

    WR.initAuth(async (user) => {
      if (!user) return;
      await loadTBR();
    });

    async function loadTBR() {
      const user = WR.getCurrentUser();
      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          const snap = await WR.getDb()
            .collection("users").doc(user.uid)
            .collection("books")
            .where("onTBR", "==", true)
            .get();
          allBooks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          document.getElementById("tbrSubtitle").textContent =
            `${allBooks.length} book${allBooks.length === 1 ? "" : "s"} to read`;
          applyFilter();
          return;
        } catch (e) {
          if (attempt === 0) {
            await new Promise(r => setTimeout(r, 500));
          } else {
            console.error("Error loading TBR:", e);
            WR.showToast("Error loading your TBR list.", "error");
          }
        }
      }
    }

    function setFilter(filter) {
      activeFilter = filter;
      document.querySelectorAll(".filter-pill").forEach(p => p.classList.remove("active"));
      document.getElementById("pill-" + filter).classList.add("active");
      applyFilter();
    }

    function applyFilter() {
      let books = [...allBooks];
      if (activeFilter === "owned")   books = books.filter(b => b.inLibrary);
      if (activeFilter === "acquire") books = books.filter(b => b.tbrNeedsAcquisition);
      renderBooks(books);
    }

    function renderBooks(books) {
      const area = document.getElementById("booksArea");

      if (!books.length) {
        area.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">🔖</span>
            <h2 class="empty-title">${activeFilter === "all" ? "Your TBR list is empty" : "No books match this filter"}</h2>
            <p class="empty-desc">${activeFilter === "all"
              ? "Add books you're planning to read and they'll show up here."
              : "Try a different filter."}</p>
            ${activeFilter === "all" ? `<a href="search.html" class="empty-btn">🔍 Find a Book</a>` : ""}
          </div>`;
        return;
      }

      area.innerHTML = `<div class="tbr-list">${books.map(b => buildCard(b)).join("")}</div>`;
    }

    function buildCard(book) {
      const cover = book.coverURL
        ? `<img class="book-cover-img" src="${WR.escapeHTML(book.coverURL)}" alt=""
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : "";
      const placeholder = `<div class="book-cover-placeholder" ${book.coverURL ? 'style="display:none"' : ""}>🔖</div>`;

      let flags = "";
      if (book.inLibrary)              flags += `<span class="flag-badge flag-library">In My Library</span>`;
      if (book.tbrNeedsAcquisition)    flags += `<span class="flag-badge flag-acquire">Need to Acquire</span>`;

      return `
        <div class="tbr-card">
          ${cover}${placeholder}
          <div class="tbr-info">
            <a class="tbr-title" href="book.html?id=${encodeURIComponent(book.id)}">${WR.escapeHTML(book.title || "")}</a>
            <div class="tbr-author">${WR.escapeHTML(book.author || "")}</div>
            ${flags ? `<div class="tbr-flags">${flags}</div>` : ""}
          </div>
          <div class="tbr-actions">
            <button class="tbr-btn tbr-btn-start" onclick="markReading('${book.id}')">📖 Start Reading</button>
            <button class="tbr-btn tbr-btn-remove" onclick="removeFromTBR('${book.id}')">Remove</button>
          </div>
        </div>`;
    }

    async function markReading(bookId) {
      const user = WR.getCurrentUser();
      try {
        const ref = WR.getDb()
          .collection("users").doc(user.uid)
          .collection("books").doc(bookId);

        const session = {
          sessionId: WR.generateId(),
          startDate: new Date().toISOString().split("T")[0],
          endDate:   null,
          completed: false,
          dnf:       false,
          format:    "read",
          review:    null,
          rating:    null,
          reviewPublished: false
        };

        await ref.set({
          onReadList: true,
          readingSessions: firebase.firestore.FieldValue.arrayUnion(session),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        WR.showToast("Happy reading! 📖", "success");
        allBooks = allBooks.filter(b => b.id !== bookId);
        document.getElementById("tbrSubtitle").textContent =
          `${allBooks.length} book${allBooks.length === 1 ? "" : "s"} to read`;
        applyFilter();
      } catch (e) {
        console.error("Error starting book:", e);
        WR.showToast("Something went wrong.", "error");
      }
    }

    async function removeFromTBR(bookId) {
      const user = WR.getCurrentUser();
      try {
        await WR.getDb()
          .collection("users").doc(user.uid)
          .collection("books").doc(bookId)
          .update({ onTBR: false, tbrNeedsAcquisition: false,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        allBooks = allBooks.filter(b => b.id !== bookId);
        document.getElementById("tbrSubtitle").textContent =
          `${allBooks.length} book${allBooks.length === 1 ? "" : "s"} to read`;
        applyFilter();
        WR.showToast("Removed from TBR list.");
      } catch (e) {
        console.error("Error removing from TBR:", e);
        WR.showToast("Something went wrong.", "error");
      }
    }

    window.setFilter     = setFilter;
    window.markReading   = markReading;
    window.removeFromTBR = removeFromTBR;
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>

</body>
</html>
